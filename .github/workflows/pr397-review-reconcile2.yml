name: PR397 review reconciliation v2

on:
  push:
    branches:
      - localization/l1-core-contracts
    paths:
      - .github/workflows/pr397-review-reconcile2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile current main and review findings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git worktree add --detach /tmp/pr397-main origin/main
          set +e
          python3 /tmp/pr397-main/tools/recurring-defect-lint.py --repo /tmp/pr397-main > /tmp/main-lint.txt 2>&1
          main_lint_rc=$?
          set -e

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          test "$merge_rc" -ne 0

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          expected=(
            "docs/tracking/CHANGELOG-src.md"
            "docs/tracking/CHANGELOG.md"
            "docs/tracking/file-manifest.md"
            "docs/tracking/spec-error-log.md"
          )
          test "${#conflicts[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${conflicts[@]}" | grep -Fxq "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          def parse_conflicts(path):
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              out = []
              conflicts = []
              i = 0
              while i < len(lines):
                  if not lines[i].startswith("<<<<<<< "):
                      out.append(lines[i]); i += 1; continue
                  i += 1
                  ours = []
                  while lines[i] != "=======":
                      ours.append(lines[i]); i += 1
                  i += 1
                  theirs = []
                  while not lines[i].startswith(">>>>>>> "):
                      theirs.append(lines[i]); i += 1
                  i += 1
                  conflicts.append((ours, theirs))
                  out.append(("__CONFLICT__", len(conflicts) - 1))
              return p, out, conflicts

          def write_resolved(path, resolver):
              p, parsed, conflicts = parse_conflicts(path)
              out = []
              for item in parsed:
                  if isinstance(item, tuple):
                      out.extend(resolver(item[1], *conflicts[item[1]]))
                  else:
                      out.append(item)
              text = "\n".join(out) + "\n"
              if any(marker in text for marker in ("<<<<<<< ", "=======", ">>>>>>> ")):
                  raise SystemExit(f"{path}: conflict marker remains")
              p.write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def resolve_src(idx, ours, theirs):
              if idx == 0:
                  local = next(line for line in ours if "Localization #49 L1 authoritative core contracts" in line)
                  local = local.replace("September 12, 2026 (v2.135", "September 14, 2026 (v2.137", 1)
                  main = list(theirs)
                  main[0] = main[0].replace("> **Last Updated:**", "> **Last Updated (prior):**", 1)
                  return [local, ">"] + main
              if idx == 1:
                  local = next(line for line in ours if line.startswith("| 2.135 |") and "Localization #49 L1 authoritative core" in line)
                  local = local.replace("| 2.135 | 2026-09-12 |", "| 2.137 | 2026-09-14 |", 1)
                  return [local] + list(theirs)
              raise SystemExit(f"unexpected CHANGELOG-src conflict {idx}")

          def resolve_changelog(idx, ours, theirs):
              if idx != 0:
                  raise SystemExit(f"unexpected CHANGELOG conflict {idx}")
              local = list(ours)
              local[0] = local[0].replace("September 12, 2026", "September 14, 2026", 1)
              main = list(theirs)
              main[0] = main[0].replace("> **Last Updated:**", "> **Last Updated (prior):**", 1)
              return local + [""] + main

          def resolve_manifest(idx, ours, theirs):
              if idx == 0:
                  local = list(ours)
                  local[0] = local[0].replace("September 12, 2026", "September 14, 2026", 1)
                  local = [line.replace("`CHANGELOG-src.md` v2.135", "`CHANGELOG-src.md` v2.137", 1) for line in local]
                  local = [line.replace("`spec-error-log.md` v2.57", "`spec-error-log.md` v2.58", 1) for line in local]
                  main = list(theirs)
                  main[0] = main[0].replace("**Last Updated:**", "**Last Updated (prior):**", 1)
                  return local + [""] + main
              # Historical August conflict is a same-entry forward-pointer difference. Keep current-main's newer pointer.
              if idx == 1:
                  return list(theirs)
              raise SystemExit(f"unexpected manifest conflict {idx}")

          def resolve_error_log(idx, ours, theirs):
              if idx != 0:
                  raise SystemExit(f"unexpected spec-error-log conflict {idx}")
              local = next(line for line in ours if "Localization #49 L1 close-out" in line)
              local = local.replace("September 12, 2026 (v2.57", "September 14, 2026 (v2.58", 1)
              main = next(line for line in theirs if "ERR-013-011" in line)
              main = main.replace("**Updated:**", "**Updated (prior):**", 1)
              return [local, main]

          write_resolved("docs/tracking/CHANGELOG-src.md", resolve_src)
          write_resolved("docs/tracking/CHANGELOG.md", resolve_changelog)
          write_resolved("docs/tracking/file-manifest.md", resolve_manifest)
          write_resolved("docs/tracking/spec-error-log.md", resolve_error_log)

          replace_once("docs/tracking/spec-error-log.md", "**Version:** 2.57", "**Version:** 2.58")

          section = "docs/specs/localization-accessibility/section-2.md"
          replace_once(
              section,
              "**Last Updated:** September 12, 2026 (v0.6 — frozen-history restoration and LocaleId external-tag clarification)\n**Last Updated (prior):** September 11, 2026 (v0.5 — L1 typed-selector and value-identity contract; ERR-049-004 fix implemented pending tracker close-out)\n**Last Updated (prior):** July 27, 2026 (v0.4 — back-prop landed atomically with the ten-spec approval wave; see the version-history row)\n**Version:** 0.6",
              "**Last Updated:** September 14, 2026 (v0.7 — restore omitted v0.3 header-chain record; review hardening only)\n**Last Updated (prior):** September 12, 2026 (v0.6 — frozen-history restoration and LocaleId external-tag clarification)\n**Last Updated (prior):** September 11, 2026 (v0.5 — L1 typed-selector and value-identity contract; ERR-049-004 fix implemented pending tracker close-out)\n**Last Updated (prior):** July 27, 2026 (v0.4 — back-prop landed atomically with the ten-spec approval wave; see the version-history row)\n**Last Updated (prior):** July 23, 2026 (v0.3 — repeat AR-3 (1H+1L) fix pass; APPROVED)\n**Version:** 0.7"
          )
          replace_once(
              section,
              "| 0.6 | 2026-09-12 | GPT-5.6 Sol | Restores the frozen v0.4 history row verbatim and clarifies that `LocaleId.Value` is an internal lower-case identity, not BCP-47 canonical form; Wave-8 external file/CLDR lookups map from it to the external canonical tag/form they require. |\n#endregion",
              "| 0.6 | 2026-09-12 | GPT-5.6 Sol | Restores the frozen v0.4 history row verbatim and clarifies that `LocaleId.Value` is an internal lower-case identity, not BCP-47 canonical form; Wave-8 external file/CLDR lookups map from it to the external canonical tag/form they require. |\n| 0.7 | 2026-09-14 | GPT-5.6 Sol | Restores the omitted v0.3 header-chain record. No normative contract change. |\n#endregion"
          )

          tests = "src/localization/tests/LocalizationCoreContractTests.cs"
          replace_once(tests, "// Modified: 2026-09-12", "// Modified: 2026-09-14")
          replace_once(tests,
              "Type[] publicTypes = assembly.GetExportedTypes()\n                .Where(IsAuthoredLocalizationType)\n                .ToArray();",
              "Type[] publicTypes = assembly.GetExportedTypes()\n                .Where(type => !IsExcludedRuntimeArtifact(type))\n                .ToArray();")
          replace_once(tests,
              "Type[] authoredTypes = assembly.GetTypes()\n                .Where(IsAuthoredLocalizationType)\n                .ToArray();",
              "Type[] authoredTypes = assembly.GetTypes()\n                .Where(type => !IsExcludedRuntimeArtifact(type))\n                .ToArray();")
          replace_once(tests,
              "\"Authored L1 localization types must not contain mutable static fields. Compiler-generated and coverage-instrumentation types are not localization-owned state.\");\n            Assert.That(fields.Any(field => ContainsForbiddenStateName(field.FieldType)), Is.False);\n            Assert.That(authoredTypes.Where(type => type.IsPublic || type.IsNestedPublic).Any(HasExplicitSerializableAttribute), Is.False);",
              "\"L1 localization assembly types must not contain mutable static fields. Only compiler-generated and Coverlet instrumentation artifacts are excluded.\");\n            Assert.That(fields.Any(ContainsForbiddenState), Is.False);\n            Assert.That(authoredTypes.Any(HasExplicitSerializableAttribute), Is.False);")
          replace_once(tests,
              "private static bool IsAuthoredLocalizationType(Type type)\n        {\n            return type.Namespace != null\n                && (string.Equals(type.Namespace, \"TacticalDirector.Localization\", StringComparison.Ordinal)\n                    || type.Namespace.StartsWith(\"TacticalDirector.Localization.\", StringComparison.Ordinal))\n                && !type.IsDefined(typeof(CompilerGeneratedAttribute), false);\n        }\n\n        private static bool ContainsForbiddenStateName(Type type)",
              "private static bool IsExcludedRuntimeArtifact(Type type)\n        {\n            return type.IsDefined(typeof(CompilerGeneratedAttribute), false)\n                || type.Namespace != null\n                    && type.Namespace.StartsWith(\"Coverlet.Core.Instrumentation.Tracker\", StringComparison.Ordinal);\n        }\n\n        private static bool ContainsForbiddenState(FieldInfo field)\n        {\n            return ContainsForbiddenStateName(field.FieldType)\n                || ContainsForbiddenStateIdentifier(field.Name);\n        }\n\n        private static bool ContainsForbiddenStateIdentifier(string name)\n        {\n            return name.IndexOf(\"Random\", StringComparison.OrdinalIgnoreCase) >= 0\n                || name.IndexOf(\"Rng\", StringComparison.OrdinalIgnoreCase) >= 0\n                || name.IndexOf(\"Save\", StringComparison.OrdinalIgnoreCase) >= 0\n                || name.IndexOf(\"Snapshot\", StringComparison.OrdinalIgnoreCase) >= 0;\n        }\n\n        private static bool ContainsForbiddenStateName(Type type)")
          replace_once(tests,
              "// | 1.4     | 2026-09-12 | GPT-5.6 Sol | Apply the authored-type scope consistently to public type-shape and serializable-attribute locks; compiler/coverage tracker types are implementation artifacts, not localization-contract types. |\n#endregion",
              "// | 1.4     | 2026-09-12 | GPT-5.6 Sol | Apply the authored-type scope consistently to public type-shape and serializable-attribute locks; compiler/coverage tracker types are implementation artifacts, not localization-contract types. |\n// | 1.5     | 2026-09-14 | GPT-5.6 Sol | Replace namespace allow-listing with explicit compiler/Coverlet exclusions; inspect every other assembly-owned runtime type, RNG/persistence field identifiers, and `[Serializable]` regardless of visibility. |\n#endregion")

          # Synchronize the already-open localization tracking entries with the review hardening.
          p = Path("docs/tracking/CHANGELOG-src.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("Follow-up scopes reflection away from compiler/coverage-generated types.", "Review follow-up restores the omitted §2 v0.3 header-chain record and replaces namespace allow-listing with explicit compiler/Coverlet exclusions so every other assembly-owned runtime type remains covered; RNG/persistence field identifiers and `[Serializable]` regardless of visibility are locked too.", 1)
          text = text.replace("authored public type shape.", "assembly-wide runtime type shape with only compiler/Coverlet artifacts excluded.", 1)
          p.write_text(text, encoding="utf-8")

          p = Path("docs/tracking/CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("Follow-up review restores frozen §2/§7 history, states that lower-case `LocaleId.Value` is an internal identity rather than BCP-47 canonical form, records the L3B tripwire narrowing rule, scopes reflection away from compiler/coverage generated types, and restores the source newline.", "Follow-up review restores frozen §2/§7 history plus the omitted §2 v0.3 header-chain record, states that lower-case `LocaleId.Value` is an internal identity rather than BCP-47 canonical form, records the L3B tripwire narrowing rule, and replaces namespace allow-listing with explicit compiler/Coverlet exclusions so every other assembly-owned runtime type remains covered; RNG/persistence field identifiers and `[Serializable]` regardless of visibility are locked too.", 1)
          text = text.replace("`spec-error-log.md` v2.57", "`spec-error-log.md` v2.58", 1)
          p.write_text(text, encoding="utf-8")

          p = Path("docs/tracking/file-manifest.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("#49 `outline.md`, §§1/2/4/7;", "#49 `outline.md`, §§1/2/4/7 (section-2 v0.7 restores the omitted v0.3 header-chain record);", 1)
          text = text.replace("`spec-error-log.md` v2.57", "`spec-error-log.md` v2.58", 1)
          p.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/pr397-review-reconcile.yml
          git rm .github/workflows/pr397-conflict-inspect2.yml
          git rm .github/workflows/pr397-review-reconcile2.yml
          git add docs/specs/localization-accessibility/section-2.md \
                  src/localization/tests/LocalizationCoreContractTests.cs \
                  docs/tracking/CHANGELOG-src.md \
                  docs/tracking/CHANGELOG.md \
                  docs/tracking/file-manifest.md \
                  docs/tracking/spec-error-log.md

          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' docs/tracking/CHANGELOG-src.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md docs/tracking/spec-error-log.md

          .claude/skills/landing-close-out/scripts/check_drift.sh
          python3 tools/assembly-tier-check.py
          python3 tools/doc-consistency-check.py --repo .

          set +e
          python3 tools/recurring-defect-lint.py --repo . > /tmp/merged-lint.txt 2>&1
          merged_lint_rc=$?
          set -e
          grep '^ERROR  ' /tmp/main-lint.txt | sort > /tmp/main-errors.txt || true
          grep '^ERROR  ' /tmp/merged-lint.txt | sort > /tmp/merged-errors.txt || true
          diff -u /tmp/main-errors.txt /tmp/merged-errors.txt
          if [ "$main_lint_rc" -eq 0 ] && [ "$merged_lint_rc" -ne 0 ]; then
            cat /tmp/merged-lint.txt
            exit 1
          fi

          git status --short
          git commit -m "merge: reconcile PR 397 review with current main"
          git push origin HEAD:localization/l1-core-contracts
