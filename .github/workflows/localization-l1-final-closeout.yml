name: Localization L1 final closeout (one-shot)

on:
  push:
    branches:
      - localization/l1-core-contracts
    paths:
      - .github/workflows/localization-l1-final-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main, close L1, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge origin/main --no-commit --no-ff
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts: %s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                docs/planning/audio-implementation-plan.md|docs/tracking/file-manifest.md)
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def prepend_after_title(path, title, block):
              replace_once(path, title + "\n\n", title + "\n\n" + block + "\n\n")

          # --- Reconcile #49 status with current-main audio/tracking state. ---
          audio = "docs/planning/audio-implementation-plan.md"
          replace_once(audio, "**Last Updated:** September 8, 2026\n**Version:** 1.6", "**Last Updated:** September 12, 2026\n**Version:** 1.7")
          replace_once(audio, "- caption-renderer integration remains blocked on **D49: #49 Localization & Accessibility T0**;", "- #49 L1 core now exists; caption-renderer integration remains blocked on **D49: #49 L2 renderer/catalogue plus the approved caption boundary**, not on the absence of a localization assembly;")
          replace_once(audio, "- #49 has no production assembly; therefore T3 caption rendering is not currently available.", "- #49 now has the dependency-free L1 production assembly `TacticalDirector.Localization`; T3 caption rendering is still unavailable because L2 renderer/catalogue behavior and the approved caption boundary have not landed.")
          replace_once(audio, "- **D49 — Localization & Accessibility T0 exists.** Required before caption rendering integration; not required for T0/T1 audio framework work.", "- **D49 — Localization caption-rendering capability exists.** The L1 core-assembly prerequisite is met by #397; P5B still requires L2 renderer/catalogue behavior plus an approved #49/#51 caption boundary.")
          replace_once(audio, "- real caption rendering once D49 is available;", "- real caption rendering once D49's L2 rendering/boundary capability is available;")
          replace_once(audio, "Before P5B begins, verify #49 T0 exists and can legitimately add the inbound `#49 → #51` reference required by #51 §4.5.", "Before P5B begins, verify #49 L2 rendering/catalogue behavior exists and that the approved integration topology provides a legitimate caption boundary between #49 and #51. #49 L1 core existence alone does not satisfy D49, and this plan does not force the generic localization core to acquire a #51 dependency.")
          replace_once(audio, "| 1.6 | 2026-09-08 | **Codex review of PR #368, two P2 findings, both accepted and both real.**", "| 1.7 | 2026-09-12 | Synchronizes D49 with #397: the dependency-free localization L1 core assembly now exists, while P5B remains blocked on L2 renderer/catalogue behavior plus an approved #49/#51 caption boundary; the generic localization core acquires no audio dependency. |\n| 1.6 | 2026-09-08 | **Codex review of PR #368, two P2 findings, both accepted and both real.**")

          # --- Claude follow-up: frozen history, external locale mapping, tripwire lifecycle. ---
          s2 = "docs/specs/localization-accessibility/section-2.md"
          replace_once(s2, "**Last Updated:** September 11, 2026 (v0.5 — L1 typed-selector and value-identity contract; ERR-049-004 fix implemented pending tracker close-out)", "**Last Updated:** September 12, 2026 (v0.6 — frozen-history restoration and LocaleId external-tag clarification)\n**Last Updated (prior):** September 11, 2026 (v0.5 — L1 typed-selector and value-identity contract; ERR-049-004 fix implemented pending tracker close-out)")
          replace_once(s2, "**Version:** 0.5", "**Version:** 0.6")
          replace_once(s2, "- `LocaleId` performs only identity canonicalization — trim surrounding whitespace and apply invariant\n  lower-case. This is **not** a new BCP-47 validation requirement; `BaseLocale` remains the fixed `\"en\"`.", "- `LocaleId` performs only identity canonicalization — trim surrounding whitespace and apply invariant\n  lower-case. That internal identity is **not a BCP-47 canonical-form guarantee**: for example, `en-US`\n  normalizes to `en-us`. Wave-8 file/CLDR/external-locale lookup must map from this normalized internal\n  identity to the canonical external tag/form required by that boundary. This is **not** a new BCP-47\n  validation requirement; `BaseLocale` remains the fixed `\"en\"`.")
          replace_once(s2, "| 0.4 | 2026-07-27 | — | **ERR-049-001** (at #35's approval): **FR-LC-020 generalized** — `SelectionDraw` is *the producer's own deterministic, locale-independent selection value, carried verbatim*, with #22's `world.text` draw retained as the named example. The original wording named one producer's RNG reservation on a producer-agnostic seam, contradicting §7.3, FR-LC-013/014 and FR-LC-005 — and would have forced every later producer either to register an RNG stream it does not need or to violate the requirement. **Contract-widening only; no #49 code, type or catalogue change.** Load-bearing for #35, #46 and #48. |", "| 0.4 | 2026-07-27 | — | **ERR-049-001** (at #35's approval): **FR-LC-020 generalized** — `SelectionDraw` is *the producer's own deterministic, locale-independent selection value, carried verbatim*, with #22's `world.text` draw retained as the named example. The original wording named one producer's RNG reservation on a producer-agnostic seam, contradicting §7.3, FR-LC-013/014 and FR-LC-005 — and would have forced every later producer either to register an RNG stream it does not need or to violate the requirement. **Contract-widening only; no code, type or catalogue change.** Load-bearing for #35, #46 and #48. |")
          replace_once(s2, "| 0.5 | 2026-09-11 | GPT-5.6 Sol | **L1 ERR-049-004 fix implementation.** Extends the procedural request contract with immutable typed locale-neutral selector operands (cardinal and/or grammatical gender), aligns the pseudo-contract to the L1 get-only property API, and freezes static-key/locale identity policy. Authoritative ERR closure remains pending `spec-error-log.md` landing-closeout synchronization. Selector interpretation remains L2 rendering behavior. |", "| 0.5 | 2026-09-11 | GPT-5.6 Sol | **L1 ERR-049-004 fix implementation.** Extends the procedural request contract with immutable typed locale-neutral selector operands (cardinal and/or grammatical gender), aligns the pseudo-contract to the L1 get-only property API, and freezes static-key/locale identity policy. Authoritative ERR closure remains pending `spec-error-log.md` landing-closeout synchronization. Selector interpretation remains L2 rendering behavior. |\n| 0.6 | 2026-09-12 | GPT-5.6 Sol | Restores the frozen v0.4 history row verbatim and clarifies that `LocaleId.Value` is an internal lower-case identity, not BCP-47 canonical form; Wave-8 external file/CLDR lookups map from it to the external canonical tag/form they require. |")

          s7 = "docs/specs/localization-accessibility/section-7.md"
          replace_once(s7, "**Last Updated:** September 11, 2026 (v0.5 — L1 implements fixes for ERR-049-002/004; authoritative tracker closure remains landing-closeout work; ERR-049-005 fixed to L2)", "**Last Updated:** September 12, 2026 (v0.6 — L1 tracker close-out plus frozen v0.2 restoration)\n**Last Updated (prior):** September 11, 2026 (v0.5 — L1 implements fixes for ERR-049-002/004; authoritative tracker closure remains landing-closeout work; ERR-049-005 fixed to L2)")
          replace_once(s7, "**Version:** 0.5", "**Version:** 0.6")
          replace_once(s7, "| 0.2 | 2026-07-23 | — | Section-file PASS-1 fixes: H-1 generic core / per-producer boundary-adapter split (§2.2 core references nothing sim-side; §2.2.1 `LivingWorldTextBoundary`); M-1 FR-LC-008a construction-time roster-coverage invariant + F1/F5 rewrite + FR-LC-015 intent-value gate; L-1 `{score}` derived → AR-2 convergence; APPROVED. See section-9 §9.3.1. |", "| 0.2 | 2026-07-23 | — | Section-file PASS-1 (1H+1M+1L; H-1 generic-core / per-producer boundary-adapter split, M-1 FR-LC-008a construction-time roster-coverage invariant, L-1 `{score}` derived) → AR-2 convergence; APPROVED. See section-9 §9.3.1. |")
          replace_once(s7, "The L0R pass filed four implementation-time defects before a production localization assembly existed. L1\nnow supplies the executable core seam and implements the two fixes whose proof is purely structural. The\nauthoritative `spec-error-log.md` rows remain OPEN until the landing-closeout pass synchronizes those rows\nwith current-head executable evidence; this section does not pre-empt that tracker state. The other two\nremain open for their named later slices.", "The L0R pass filed four implementation-time defects before a production localization assembly existed. L1\nnow supplies the executable core seam and discharges the two defects whose proof is purely structural. The\nauthoritative `spec-error-log.md` is synchronized in this close-out: ERR-049-002 and ERR-049-004 are RESOLVED;\nERR-049-003 remains open for L3B/T1 and ERR-049-005 remains open for L2.")
          replace_once(s7, "- **ERR-049-002 — L1 FIX IMPLEMENTED; tracker closure pending landing close-out.**", "- **ERR-049-002 — RESOLVED in L1.**")
          replace_once(s7, "- **ERR-049-004 — L1 FIX IMPLEMENTED; tracker closure pending landing close-out.**", "- **ERR-049-004 — RESOLVED in L1.**")
          replace_once(s7, "\nThe owning `spec-error-log.md` rows are the durable status authority and must be synchronized before this L1\nlanding is merge-ready.\n", "\nThe owning `spec-error-log.md` rows are the durable status authority and are synchronized by this L1 close-out.\n")
          replace_once(s7, "| 0.5 | 2026-09-11 | GPT-5.6 Sol | **L1 implementation disposition.** ERR-049-002 and ERR-049-004 fixes are implemented with structural tests, but their authoritative tracker rows remain OPEN until landing-closeout synchronization. The approved `Resolve`/`Render` signatures remain final, so ERR-049-005 is explicitly assigned to L2. ERR-049-003 remains open for L3B/T1. |", "| 0.5 | 2026-09-11 | GPT-5.6 Sol | **L1 implementation disposition.** ERR-049-002 and ERR-049-004 fixes are implemented with structural tests, but their authoritative tracker rows remain OPEN until landing-closeout synchronization. The approved `Resolve`/`Render` signatures remain final, so ERR-049-005 is explicitly assigned to L2. ERR-049-003 remains open for L3B/T1. |\n| 0.6 | 2026-09-12 | GPT-5.6 Sol | L1 landing close-out: restores the frozen v0.2 history row verbatim; synchronizes ERR-049-002 and ERR-049-004 to RESOLVED; retains ERR-049-003 OPEN for L3B/T1 and ERR-049-005 OPEN for L2. |")

          plan = "docs/tracking/localization-implementation-plan.md"
          replace_once(plan, "**Version:** 2.5", "**Version:** 2.6")
          replace_once(plan, "- layer/tier/governance/document-consistency checks green;\n- **no human-readable `InteractionTextCorpus` template/clause ownership remains sim-side**;", "- layer/tier/governance/document-consistency checks green;\n- the L1-only `NoOtherProductionAsmdef_ReferencesLocalizationAtL1` tripwire is deliberately narrowed in L3B, **not deleted or disabled**: it must admit only the approved `TacticalDirector.LocalizationBoundary` production consumer while continuing to reject direct sim/loop references and every other unauthorized production reference to `TacticalDirector.Localization`;\n- **no human-readable `InteractionTextCorpus` template/clause ownership remains sim-side**;")
          replace_once(plan, "| 2.5 | 2026-09-09 | — | Followed the v2.4 four-defect scope through the places it had not reached, and fixed one mis-sliced proof.", "| 2.6 | 2026-09-12 | GPT-5.6 Sol | Records the intentional L1 reverse-reference tripwire lifecycle: L3B must narrow `NoOtherProductionAsmdef_ReferencesLocalizationAtL1` to admit only the approved localization-boundary consumer while preserving the prohibition on direct sim/loop and other unauthorized production references. |\n| 2.5 | 2026-09-09 | — | Followed the v2.4 four-defect scope through the places it had not reached, and fixed one mis-sliced proof.")

          # --- Scope reflection-based locks to authored localization types and preserve newline. ---
          test = "src/localization/tests/LocalizationCoreContractTests.cs"
          replace_once(test, "            Type[] publicTypes = assembly.GetExportedTypes();", "            Type[] publicTypes = assembly.GetExportedTypes()\n                .Where(IsAuthoredLocalizationType)\n                .ToArray();")
          replace_once(test, "            Type[] authoredTypes = assembly.GetTypes()\n                .Where(type => type.Namespace != null\n                    && (string.Equals(type.Namespace, \"TacticalDirector.Localization\", StringComparison.Ordinal)\n                        || type.Namespace.StartsWith(\"TacticalDirector.Localization.\", StringComparison.Ordinal)))\n                .Where(type => !type.IsDefined(typeof(CompilerGeneratedAttribute), false))\n                .ToArray();", "            Type[] authoredTypes = assembly.GetTypes()\n                .Where(IsAuthoredLocalizationType)\n                .ToArray();")
          replace_once(test, "            Assert.That(assembly.GetExportedTypes().Any(HasExplicitSerializableAttribute), Is.False);", "            Assert.That(authoredTypes.Where(type => type.IsPublic || type.IsNestedPublic).Any(HasExplicitSerializableAttribute), Is.False);")
          replace_once(test, "        private static bool ContainsForbiddenStateName(Type type)\n        {", "        private static bool IsAuthoredLocalizationType(Type type)\n        {\n            return type.Namespace != null\n                && (string.Equals(type.Namespace, \"TacticalDirector.Localization\", StringComparison.Ordinal)\n                    || type.Namespace.StartsWith(\"TacticalDirector.Localization.\", StringComparison.Ordinal))\n                && !type.IsDefined(typeof(CompilerGeneratedAttribute), false);\n        }\n\n        private static bool ContainsForbiddenStateName(Type type)\n        {")
          replace_once(test, "// | 1.3     | 2026-09-11 | GPT-5.6 Sol | Scope authored-state reflection to localization-owned namespaces so coverage instrumentation is ignored. |\n#endregion", "// | 1.3     | 2026-09-11 | GPT-5.6 Sol | Scope authored-state reflection to localization-owned namespaces so coverage instrumentation is ignored. |\n// | 1.4     | 2026-09-12 | GPT-5.6 Sol | Apply the same authored-type scope to the public type-shape and serializable-attribute locks; compiler/coverage tracker types are not part of the localization contract. |\n#endregion\n")
          p = Path(test)
          p.write_text(p.read_text(encoding="utf-8").rstrip("\n") + "\n", encoding="utf-8")

          # --- Canonical ERR ledger close-out on current main: 237 rows remain 237. ---
          err = "docs/tracking/spec-error-log.md"
          replace_once(err, "**Version:** 2.56\n**Updated:** September 11, 2026, later (v2.56", "**Version:** 2.57\n**Updated:** September 12, 2026 (v2.57 — **Localization #49 L1 close-out.** `ERR-049-002` and `ERR-049-004` are RESOLVED by the dependency-free core plus structural regression proofs. `ERR-049-003` remains OPEN for L3B/T1. `ERR-049-005` remains OPEN and is explicitly assigned to L2 because L1 froze the approved `Resolve`/`Render` signatures unchanged. Error Index remains 237 rows; no id allocated.)\n**Updated (prior):** September 11, 2026, later (v2.56")
          replace_once(err, "| ERR-049-002 | Localization & Accessibility #49 §1 KD-6 states the stale reverse reference `Localization → living-world` and cites a producer helper, contradicting the approved producer-agnostic core and sibling boundary-adapter architecture in §§2–5. | High | 2 (`section-7.md`, this log) | 🟡 **OPEN — RECORDED, NOT FIXED.** Discharge wholly in L1 / #49 T0 with the core assembly and a mechanical no-producer/no-reverse-reference proof; C6 forbids pre-T0 contract hardening. |", "| ERR-049-002 | Localization & Accessibility #49 §1 KD-6 states the stale reverse reference `Localization → living-world` and cites a producer helper, contradicting the approved producer-agnostic core and sibling boundary-adapter architecture in §§2–5. | High | 7 (`section-1.md`, `outline.md`, `section-7.md`, Code Standards §3.5.2, `localization.asmdef`, `LocalizationCoreContractTests.cs`, this log) | ✅ **RESOLVED September 12, 2026 in L1.** The core has zero production refs; producer mapping is assigned to the later sibling boundary adapter; structural tests parse the asmdef, reject unauthorized production reverse refs and sim-type leakage, and the tier checker independently enforces direction. |")
          replace_once(err, "| ERR-049-004 | Localization & Accessibility #49 FR-LC-009 requires plural/gender selection, but the core seam carries only preformatted strings and exposes no locale-neutral typed selector operand. | High | 2 (`section-7.md`, this log) | 🟡 **OPEN — RECORDED, NOT FIXED.** Discharge wholly in L1 / #49 T0 by landing a locale-neutral typed operand and structural proofs; the concrete operand type remains deliberately undecided under C6. |", "| ERR-049-004 | Localization & Accessibility #49 FR-LC-009 requires plural/gender selection, but the core seam carries only preformatted strings and exposes no locale-neutral typed selector operand. | High | 10 (`section-2.md`, `section-4.md`, `section-7.md`, `GrammaticalGender.cs`, `SelectorOperand.cs`, `NamedSelector.cs`, `NamedSelectorSet.cs`, `LocalizedTextRequest.cs`, `LocalizationCoreContractTests.cs`, this log) | ✅ **RESOLVED September 12, 2026 in L1.** Typed locale-neutral cardinal/gender selector operands and immutable named selector sets now travel separately from preformatted string slots; structural tests lock typed-not-string shape, locale neutrality, deterministic equality/hash, defensive-copy immutability, and no RNG/persistence state. |")
          replace_once(err, "| ERR-049-005 | Localization & Accessibility #49 FR-LC-011 leaves the production terminal result undefined when a static `LocalizationKey` is absent from both selected and base catalogues. | High | 2 (`section-7.md`, this log) | 🟡 **OPEN — RECORDED, NOT FIXED.** Choose the resolution family before L1 freezes `ILocalizer`: discharge in L1 if signature-changing, otherwise in L2 through complete construction coverage or one explicit production-safe terminal result. |", "| ERR-049-005 | Localization & Accessibility #49 FR-LC-011 leaves the production terminal result undefined when a static `LocalizationKey` is absent from both selected and base catalogues. | High | 2 (`section-7.md`, this log) | 🟡 **OPEN — assigned to L2.** L1 froze the approved `Resolve`/`Render` signatures unchanged. L2 must discharge this through complete construction coverage for every admitted static key or one explicit production-safe terminal result, with no throw/marker leak/state mutation. |")
          replace_once(err, "**Status:** 🟡 **RECORDED — OPEN. Discharge wholly in L1 / #49 T0 under Path-to-Playable C6.**\n\n**The defect.** #49 §1 KD-6", "**Status:** ✅ **RESOLVED September 12, 2026 in L1 / #49 T0.**\n\n**The defect.** #49 §1 KD-6")
          replace_once(err, "**Deferred discharge.** L1 must correct KD-6 in the same commit that creates the core and mechanically prove the no-producer/no-reverse-reference direction. Historical PASS-1 text in §9 remains historical evidence, not live contract text to rewrite. No reference mechanism or implementation shape is selected here: #49 has no `src/localization/` assembly, and C6 forbids prose-only hardening before T0.\n\n**Files owed at discharge:** #49 `section-1.md`, `section-7.md` (mark this finding resolved), the L1 core assembly and its structural test. The current record spans `section-7.md` and this authoritative log.", "**Resolution.** L1 corrects KD-6 and the outline, creates dependency-free `TacticalDirector.Localization`, seats it in Code Standards #20 §3.5.2, and mechanically proves the direction. `LocalizationCoreContractTests` parses the production asmdef's empty declared reference list, rejects every other production asmdef referencing localization at L1, and reflects the authored public shape to reject sim-owned types; the assembly-tier checker independently reports zero upward edges. The L1 reverse-reference test is intentionally narrowed, not deleted, when the approved sibling boundary is introduced in L3B. Historical PASS-1 text remains historical evidence.\n\n**Discharged in:** #49 `section-1.md`, `outline.md`, `section-7.md`; Code Standards #20 §3.5.2; `src/localization/localization.asmdef`; `src/localization/tests/LocalizationCoreContractTests.cs`; and this authoritative log.")
          replace_once(err, "**Status:** 🟡 **RECORDED — OPEN. Discharge wholly in L1 / #49 T0 under Path-to-Playable C6.**\n\n**The defect.** FR-LC-009", "**Status:** ✅ **RESOLVED September 12, 2026 in L1 / #49 T0.**\n\n**The defect.** FR-LC-009")
          replace_once(err, "**Deferred discharge.** L1 must repair the core seam when it creates it by supplying a locale-neutral typed selector operand on `LocalizedTextRequest` or `NamedSlotSet`, while preserving FR-LC-006 (no locale-dependent persisted bytes/RNG state) and FR-LC-014 (the boundary adapter assembles the request). Its proof must cover typed-not-string representation, locale neutrality, deterministic equality/hash, immutability/no retained-reference mutation, and absence of persisted or RNG state. The L2 renderer later proves `one/few/many/other` selection as FR-LC-009 conformance, not as this ERR's discharge. The concrete operand type is deliberately not selected here.\n\n**Files owed at discharge:** #49's L1 normative seam, `section-7.md` (mark this finding resolved), the core assembly and structural tests. The current record spans `section-7.md` and this authoritative log.", "**Resolution.** L1 adds typed locale-neutral selector operands (`SelectorOperand`) carrying a cardinal and/or bounded `GrammaticalGender`, keyed by immutable `NamedSelector` / `NamedSelectorSet`, and carries the set on `LocalizedTextRequest` separately from string slots. The structural suite proves the operand is typed rather than string/locale state, deterministic value equality/hash, defensive-copy immutability, exact selector/request shape, and no mutable static/RNG/persistence state. Locale-authored `one/few/many/other` interpretation remains L2 rendering behavior and is not part of this structural ERR.\n\n**Discharged in:** #49 `section-2.md`, `section-4.md`, `section-7.md`; `GrammaticalGender.cs`, `SelectorOperand.cs`, `NamedSelector.cs`, `NamedSelectorSet.cs`, `LocalizedTextRequest.cs`; `LocalizationCoreContractTests.cs`; and this authoritative log.")
          replace_once(err, "**Status:** 🟡 **RECORDED — OPEN. Resolution family decided before L1 freezes `ILocalizer`; discharge in L1 if signature-changing, otherwise in L2.**", "**Status:** 🟡 **RECORDED — OPEN. L1 froze the approved `Resolve`/`Render` signatures unchanged; discharge is assigned to L2.**")
          replace_once(err, "**Deferred discharge.** Before L1 freezes the interface, choose the resolution family. If the correction requires a Try/found-not-found signature, discharge in L1. If the public signature remains final, discharge in L2 by either extending construction coverage to every admitted static key or defining exactly one explicit production-safe terminal result. The implementing slice must prove the chosen path cannot throw, cannot leak the development marker in production, and cannot mutate catalogue, RNG or persisted state. This record deliberately chooses none of those normative alternatives under C6.\n\n**Files owed at discharge:** the selected L1 or L2 #49 normative surface, `section-7.md` (mark this finding resolved), implementation and regression tests. The current record spans `section-7.md` and this authoritative log.", "**Disposition after L1.** L1 keeps the approved `string Resolve(LocalizationKey key)` / `string Render(in LocalizedTextRequest request)` seam unchanged, so the signature-changing branch is closed and this finding is assigned to L2. L2 must either extend construction coverage to every admitted static key or define exactly one explicit production-safe terminal result. Its regression proof must show the path cannot throw, cannot leak the development marker in production, and cannot mutate catalogue, RNG or persisted state.\n\n**Files owed at L2 discharge:** the selected #49 L2 normative surface, `section-7.md` (mark this finding resolved), renderer/catalogue implementation and regression tests, and this authoritative log.")

          # --- Live tracking surfaces / version pointers. ---
          manifest = "docs/tracking/file-manifest.md"
          replace_once(manifest, "# File Manifest (Post-Migration Baseline)\n\n**Last Updated:** September 11, 2026, later — **PR #379 semantic reconciliation of the two valid post-#368 Audio #51 corrections onto current `main`.**", "# File Manifest (Post-Migration Baseline)\n\n**Last Updated:** September 12, 2026 — **#49 Localization L1 authoritative core landing / PR #397 close-out.**\n**NEW (33 paths):** `src/localization.meta`; production folder `src/localization/` with 13 C# contract files plus `.meta` partners, `localization.asmdef` + `.meta`; `tests.meta`; `tests/LocalizationCoreContractTests.cs` + `.meta`; `tests/localization-tests.asmdef` + `.meta`. The new dependency-free production assembly is `TacticalDirector.Localization` (Code Standards #20 Tier 9); `TacticalDirector.Localization.Tests` is the test assembly. **Modified:** #49 `outline.md`, §§1/2/4/7; Code Standards #20 §3.5.2; `localization-implementation-plan.md` v2.6; `path-to-playable-roadmap.md`; audio implementation plan v1.7; `spec-error-log.md` v2.57; `CHANGELOG.md`; `CHANGELOG-src.md` v2.134; `open-issues.md`; README; and this manifest. `ERR-049-002` / `ERR-049-004` close RESOLVED; `ERR-049-003` remains L3B/T1; `ERR-049-005` remains L2. No save/snapshot schema, RNG stream/domain/draw site/order, `[GT]`, or simulation wiring changes. Current-head CI owns the final merge-gate verdict.\n\n**Last Updated (prior):** September 11, 2026, later — **PR #379 semantic reconciliation of the two valid post-#368 Audio #51 corrections onto current `main`.**")
          replace_once(manifest, "| 49 | `docs/specs/localization-accessibility/` | APPROVED (Jul 23, 2026) — no assembly |", "| 49 | `docs/specs/localization-accessibility/` | APPROVED (Jul 23, 2026) — L1 core implemented in `TacticalDirector.Localization`; L2+ pending |")
          replace_once(manifest, "`docs/tracking/localization-implementation-plan.md` | **EXECUTION AUTHORITY** for Localization #49 (**v2.5, Sep 9, 2026**", "`docs/tracking/localization-implementation-plan.md` | **EXECUTION AUTHORITY** for Localization #49 (**v2.6, Sep 12, 2026**")

          open_issues = "docs/tracking/open-issues.md"
          replace_once(open_issues, "`docs/planning/audio-implementation-plan.md` v1.6", "`docs/planning/audio-implementation-plan.md` v1.7")
          replace_once(open_issues, "`spec-error-log.md` v2.56", "`spec-error-log.md` v2.57")
