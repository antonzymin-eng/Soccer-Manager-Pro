name: W12 pointer closeout

on:
  push:
    branches:
      - docs/w12-evidence-repair

permissions:
  contents: write

jobs:
  closeout-pointers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: docs/w12-evidence-repair
          fetch-depth: 1

      - name: Update only maintained v1.16 pointers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/tracking/open-issues.md': [
                  ('`docs/tracking/match-engine-wiring-backlog.md` v1.0, now v1.16', '`docs/tracking/match-engine-wiring-backlog.md` v1.0, now v1.17'),
                  ('`docs/tracking/match-engine-wiring-backlog.md` v1.8, now v1.16', '`docs/tracking/match-engine-wiring-backlog.md` v1.8, now v1.17'),
                  ('`match-engine-wiring-backlog.md` v1.9, now v1.16', '`match-engine-wiring-backlog.md` v1.9, now v1.17'),
                  ('current `match-engine-wiring-backlog.md` v1.16', 'current `match-engine-wiring-backlog.md` v1.17'),
              ],
              'docs/tracking/CHANGELOG.md': [
                  ('**v1.10** *(since v1.16)*', '**v1.10** *(since v1.17)*'),
                  ('**v1.11** *(since v1.16)*', '**v1.11** *(since v1.17)*'),
              ],
              'docs/tracking/file-manifest.md': [
                  ('(**v1.16, Sep 14, 2026**)', '(**v1.17, Sep 14, 2026**)'),
                  ('since advanced to **v1.16**', 'since advanced to **v1.17**'),
              ],
          }

          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify cross-document consistency
        run: python3 tools/doc-consistency-check.py --repo .

      - name: Commit pointer-only closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracking/open-issues.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git diff --cached --check
          git commit -m 'docs(w12): advance maintained backlog pointers'
          git push origin HEAD:docs/w12-evidence-repair
