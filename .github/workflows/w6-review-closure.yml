name: W6 review closure repair

on:
  push:
    branches:
      - wiring/w6-controlled-ball

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply keeper-carry review closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/match-engine/MatchEngine.cs')
          s = p.read_text()
          header = '// Modified: 2026-09-15 (W6 review closure — a goalkeeper physically holding Controlled possession is constrained at his own goal plane; consequence guard restored; no schema/RNG/GT change)\n'
          if header not in s:
              s = s.replace('// Created:  2026-06-16\n', '// Created:  2026-06-16\n' + header, 1)
          old = '''            Vector2 holderPos = _agents[holder].Position;
            float z = _isGoalkeeper[holder]
                ? Mathf.Max(_ball.Position.z, MatchEngineConstants.BALL_REST_HEIGHT_M)
                : MatchEngineConstants.BALL_REST_HEIGHT_M;

            _ball.Position = new Vector3(holderPos.x, holderPos.y, z);'''
          new = '''            Vector2 holderPos = _agents[holder].Position;

            // W6 review closure: Agent Movement deliberately permits a 5 m exterior safety buffer,
            // but a goalkeeper who is physically HOLDING the ball must not carry that attached ball
            // through his own goal plane. Correct the holder, not goal adjudication, so a genuinely
            // crossed loose/kicked ball is still scored normally. Team 0 defends x=0; team 1 x=L,
            // matching the existing goalkeeper/rush convention.
            if (_isGoalkeeper[holder])
            {
                int team = AgentTeamId(holder);
                float ownGoalX = team == 0 ? 0f : MatchEngineConstants.PITCH_LENGTH_M;
                bool pastOwnGoal = team == 0 ? holderPos.x < ownGoalX : holderPos.x > ownGoalX;
                if (pastOwnGoal)
                {
                    holderPos.x = ownGoalX;
                    AgentState corrected = _agents[holder];
                    corrected.Position = holderPos;

                    bool movingFurtherOut = team == 0
                        ? corrected.Velocity.x < 0f
                        : corrected.Velocity.x > 0f;
                    if (movingFurtherOut)
                    {
                        corrected.Velocity = new Vector2(0f, corrected.Velocity.y);
                    }

                    corrected.Speed = corrected.Velocity.magnitude;
                    corrected.LastValidPosition = holderPos;
                    corrected.LastValidVelocity = corrected.Velocity;
                    _agents[holder] = corrected;
                }
            }

            float z = _isGoalkeeper[holder]
                ? Mathf.Max(_ball.Position.z, MatchEngineConstants.BALL_REST_HEIGHT_M)
                : MatchEngineConstants.BALL_REST_HEIGHT_M;

            _ball.Position = new Vector3(holderPos.x, holderPos.y, z);'''
          if old not in s:
              raise SystemExit('DriveControlledBallToPossessor anchor not found')
          s = s.replace(old, new, 1)
          version_anchor = '// | 1.78    | 2026-09-14 | —      | W6 review P2: tackle cooldown ages before the physical-carrier gate, so loose/restart |'
          if '// | 1.79    | 2026-09-15' not in s:
              s = s.replace(version_anchor,
                  '// | 1.79    | 2026-09-15 | —      | W6 review closure: while a goalkeeper physically holds Controlled possession,       |\n'
                  '// |         |            |        | holder + attached ball are constrained at the keeper\'s own goal plane; goal         |\n'
                  '// |         |            |        | adjudication itself is unchanged. No schema/RNG/GT change.                           |\n'
                  + version_anchor, 1)
          p.write_text(s)

          p = Path('src/match-engine/tests/MatchEngineKeeperClaimScenarios.cs')
          s = p.read_text()
          hdr = '// Modified: 2026-09-15 (W6 review closure — retain Controlled attachment lock and restore held-ball own-goal-plane consequence guard)\n'
          if hdr not in s:
              s = s.replace('// Created:  2026-08-03\n', '// Created:  2026-08-03\n' + hdr, 1)
          old = '''            int heldClaimsObserved = 0;
            int detachedWhileHeld = 0;'''
          if old not in s:
              raise SystemExit('keeper counters anchor not found')
          s = s.replace(old, '''            int heldClaimsObserved = 0;
            int detachedWhileHeld = 0;
            int heldOwnGoalCrossings = 0;''', 1)
          old = '''                    ref heldClaimsObserved,
                    ref detachedWhileHeld);'''
          if old not in s:
              raise SystemExit('keeper call anchor not found')
          s = s.replace(old, '''                    ref heldClaimsObserved,
                    ref detachedWhileHeld,
                    ref heldOwnGoalCrossings);''', 1)
          anchor = '''            context.Envelope.CheckTrue("claimed-ball-remains-attached-while-held",
                heldClaimsObserved >= 3 && detachedWhileHeld == 0,
                "heldClaimsObserved=" + inv(heldClaimsObserved)
                + " detachedWhileHeld=" + inv(detachedWhileHeld)
                + " claims=" + inv(claims));'''
          if anchor not in s:
              raise SystemExit('keeper assertion anchor not found')
          s = s.replace(anchor, anchor + '''

            context.Envelope.CheckTrue("held-ball-does-not-cross-own-goal-line",
                heldOwnGoalCrossings == 0,
                "heldOwnGoalCrossings=" + inv(heldOwnGoalCrossings) + " of " + inv(claims));''', 1)
          old = '''            ref int heldClaimsObserved,
            ref int detachedWhileHeld)'''
          if old not in s:
              raise SystemExit('keeper signature anchor not found')
          s = s.replace(old, '''            ref int heldClaimsObserved,
            ref int detachedWhileHeld,
            ref int heldOwnGoalCrossings)''', 1)
          old = '''                    heldClaimsObserved++;
                    if (!IsControlledAtHolder(engine, claimingAgent[t]))'''
          if old not in s:
              raise SystemExit('keeper held observation anchor not found')
          s = s.replace(old, '''                    heldClaimsObserved++;
                    if (HasHeldBallCrossedOwnGoalLine(engine, claimingAgent[t]))
                    {
                        heldOwnGoalCrossings++;
                    }
                    if (!IsControlledAtHolder(engine, claimingAgent[t]))''', 1)
          old = '''                            heldClaimsObserved++;
                            if (!IsControlledAtHolder(engine, agentId))'''
          if old not in s:
              raise SystemExit('keeper initial observation anchor not found')
          s = s.replace(old, '''                            heldClaimsObserved++;
                            if (HasHeldBallCrossedOwnGoalLine(engine, agentId))
                            {
                                heldOwnGoalCrossings++;
                            }
                            if (!IsControlledAtHolder(engine, agentId))''', 1)
          helper_anchor = '''        private static bool IsControlledAtHolder(MatchEngine engine, int agentId)
        {'''
          if helper_anchor not in s:
              raise SystemExit('keeper helper anchor not found')
          s = s.replace(helper_anchor, '''        private static bool HasHeldBallCrossedOwnGoalLine(MatchEngine engine, int agentId)
        {
            int team = engine.AgentTeamId(agentId);
            float x = engine.BallView.Position.x;
            return team == 0 ? x < 0f : x > MatchEngineConstants.PITCH_LENGTH_M;
        }

''' + helper_anchor, 1)
          vh = '// | 1.2     | 2026-09-15 | —      | W6 probe observes attachment only at held-state tick boundaries;'
          if '// | 1.3     | 2026-09-15' not in s:
              s = s.replace(vh,
                  '// | 1.3     | 2026-09-15 | —      | W6 review closure: retain attachment structure and restore the       |\n'
                  '// |         |            |        | consequence lock that held claims never cross the keeper\'s own     |\n'
                  '// |         |            |        | goal plane.                                                         |\n'
                  + vh, 1)
          p.write_text(s)

          p = Path('docs/tracking/w6-controlled-ball-closeout.md')
          s = p.read_text()
          start = s.index('## Keeper-claim acceptance compatibility — closed')
          end = s.index('## Pre-registration carried forward before measurement')
          replacement = '''## Keeper-held carry review closure

The earlier compatibility pass correctly established that W6 makes a held ball follow live keeper locomotion, but it drew the wrong conclusion from that fact. The deterministic keeper-claim corpus measured **2 of 17 claims** in which the keeper carried the attached `Controlled` ball through his own goal plane. Law 10 goal adjudication was correct; the defect was the composition of the general 5 m Agent Movement exterior buffer with a physically attached held ball.

The review closure therefore fixes production behavior rather than deleting the consequence. `DriveControlledBallToPossessor` now constrains a goalkeeper who is physically holding `Controlled` possession at his own goal plane, correcting the holder and his movement safety checkpoint before the ball is attached. Loose/kicked-ball goal adjudication is unchanged, the general Agent Movement pitch buffer is unchanged, and no new `[GT]`, RNG draw/stream/domain, durable field, or snapshot schema is introduced.

`sim_match_engine_keeper_claim` retains the W6 structural predicate `claimed-ball-remains-attached-while-held` and restores an independent football consequence predicate, `held-ball-does-not-cross-own-goal-line`. The latter fails on the measured pre-closure 2/17 behavior rather than merely proving the attachment assignment exists.

## Owner-held RED observation — pending post-fix remeasurement

On pre-closure W6 head `4dd62477`, the ordinary MatchEngine suite was green (499 passed, 12 skipped) but `sim_match_engine_close_chance` unexpectedly passed its separate owner-held-RED execution. That result is **not** a retirement or rebaseline decision: W6 changes carrier/ball position coupling and that same pre-closure state contained the keeper-carry defect above. `tools/dotnet-ci/owner-held-red.txt` and its pinned `meanCosine=-0.165` / `goalwardShare=0.407` diagnostics remain unchanged. The exact close-chance scenario must be re-measured after this carry fix; any retirement remains an owner decision based on that post-fix evidence.

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Focused keeper-claim gate
        run: bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'Name=sim_match_engine_keeper_claim'
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/w6-review-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/match-engine/MatchEngine.cs src/match-engine/tests/MatchEngineKeeperClaimScenarios.cs docs/tracking/w6-controlled-ball-closeout.md .github/workflows/w6-review-closure.yml
          git commit -m 'fix(w6): prevent keeper-held own-goal carry'
          git push origin HEAD:wiring/w6-controlled-ball
