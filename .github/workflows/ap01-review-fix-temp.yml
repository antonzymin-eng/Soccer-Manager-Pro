name: Temporary AP-01 review fix

'on':
  push:
    branches:
      - tmp/ap01-review-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ap01-review-fix
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: art/ap-01-repository-contract
          path: work
      - name: Apply review fixes
        run: python3 helper/tools/ap01-review-fix-temp.py
      - name: Commit and push
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/unity-ci/test-meta-integrity-gameart.sh .github/workflows/ci.yml
          git commit -m "Tighten AP-01 proof and CI description"
          git push origin HEAD:art/ap-01-repository-contract
