name: W4 Close-out Runner

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-closeout-marker

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
          fetch-depth: 0
      - name: Apply W4 close-out edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/w4_closeout.py')
          s = p.read_text()
          old = 'text = replace_once(text, "**Last Updated:**", "**Last Updated (prior):**", "manifest prior label")'
          new = 'text = text.replace("**Last Updated:**", "**Last Updated (prior):**", 1)'
          if s.count(old) != 1:
              raise SystemExit(f'expected one manifest replacement line, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/w4_closeout.py
      - name: Validate and commit close-out
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git diff --cached --check
          git commit -m "docs: close W4 keeper perception wiring"
          git push origin HEAD:codex/w4-keeper-perception-final
