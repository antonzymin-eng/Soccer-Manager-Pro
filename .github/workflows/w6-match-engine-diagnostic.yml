name: W6 MatchEngine Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  affected-fixtures:
    name: W6 diagnostic — ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: possession-core
            filter: 'FullyQualifiedName~MatchEngineMatchContextTests|FullyQualifiedName~MatchEngineResolveTests|FullyQualifiedName~MatchEnginePossessionBootstrapTests|FullyQualifiedName~MatchEngineFirstTouchTests'
          - shard: pass-restart-events
            filter: 'FullyQualifiedName~MatchEngineEventsTests|FullyQualifiedName~MatchEngineGoalTests|FullyQualifiedName~PassInFlightPossessionTests|FullyQualifiedName~MatchEngineRestartTests'
          - shard: tactics-mechanics-tackle
            filter: 'FullyQualifiedName~MatchEngineTacticTests|FullyQualifiedName~MatchEngineMechanicsTests|FullyQualifiedName~MatchEngineTackleTests'
          - shard: goalkeeper
            filter: 'FullyQualifiedName~MatchEngineGkHeadingTests'
          - shard: snapshots
            filter: 'FullyQualifiedName~MatchEngineSnapshotRestoreTests|FullyQualifiedName~MatchEngineSnapshotSchemaTests'
          - shard: w6-new
            filter: 'FullyQualifiedName~MatchEngineControlledBallW6Tests'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate projects
        run: python3 tools/dotnet-ci/generate_projects.py
      - name: Restore MatchEngine test project
        run: dotnet restore src/match-engine/tests/match-engine-tests.gen.csproj
      - name: Build MatchEngine test project
        run: dotnet build src/match-engine/tests/match-engine-tests.gen.csproj --no-restore -clp:ErrorsOnly
      - name: Run affected fixture shard with TRX
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/w6-diagnostic/${{ matrix.shard }}"
          mkdir -p "$out"
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj --no-build --no-restore \
            --filter "${{ matrix.filter }}" \
            --logger "trx;LogFileName=${{ matrix.shard }}.trx" \
            --results-directory "$out"
      - name: Upload shard TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-diagnostic-${{ matrix.shard }}
          path: artifacts/w6-diagnostic/${{ matrix.shard }}/*.trx
          if-no-files-found: error
