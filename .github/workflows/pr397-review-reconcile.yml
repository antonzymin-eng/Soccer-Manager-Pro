name: PR397 review reconciliation

on:
  push:
    branches:
      - localization/l1-core-contracts
    paths:
      - .github/workflows/pr397-review-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main, resolve ledgers, and harden localization locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git worktree add --detach /tmp/pr397-main origin/main
          set +e
          python3 /tmp/pr397-main/tools/recurring-defect-lint.py --repo /tmp/pr397-main > /tmp/main-lint.txt 2>&1
          main_lint_rc=$?
          set -e

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -eq 0 ]; then
            echo "Expected ledger conflicts, but merge completed cleanly."
            exit 1
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          expected=(
            "docs/tracking/CHANGELOG-src.md"
            "docs/tracking/CHANGELOG.md"
            "docs/tracking/file-manifest.md"
            "docs/tracking/open-issues.md"
          )
          if [ "${#conflicts[@]}" -ne "${#expected[@]}" ]; then
            printf 'Unexpected conflict count: %s\n' "${#conflicts[@]}"
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            exit 1
          fi
          for path in "${expected[@]}"; do
            printf '%s\n' "${conflicts[@]}" | grep -Fxq "$path" || { echo "Missing expected conflict: $path"; exit 1; }
          done

          python3 - <<'PY'
          from pathlib import Path

          def parse_conflicts(path):
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              out = []
              conflicts = []
              i = 0
              while i < len(lines):
                  if not lines[i].startswith("<<<<<<< "):
                      out.append(lines[i])
                      i += 1
                      continue
                  i += 1
                  ours = []
                  while i < len(lines) and lines[i] != "=======":
                      ours.append(lines[i]); i += 1
                  if i >= len(lines):
                      raise SystemExit(f"{path}: unterminated ours side")
                  i += 1
                  theirs = []
                  while i < len(lines) and not lines[i].startswith(">>>>>>> "):
                      theirs.append(lines[i]); i += 1
                  if i >= len(lines):
                      raise SystemExit(f"{path}: unterminated theirs side")
                  i += 1
                  conflicts.append((ours, theirs))
                  out.append(("__CONFLICT__", len(conflicts)-1))
              return p, out, conflicts

          def write_resolved(path, resolver):
              p, parsed, conflicts = parse_conflicts(path)
              resolved = []
              for item in parsed:
                  if isinstance(item, tuple):
                      idx = item[1]
                      resolved.extend(resolver(idx, *conflicts[idx]))
                  else:
                      resolved.append(item)
              text = "\n".join(resolved) + "\n"
              for marker in ("<<<<<<< ", "=======", ">>>>>>> "):
                  if marker in text:
                      raise SystemExit(f"{path}: conflict marker remains: {marker}")
              p.write_text(text, encoding="utf-8")

          def first_index(lines, predicate):
              for i, line in enumerate(lines):
                  if predicate(line):
                      return i
              return None

          def resolve_src(idx, ours, theirs):
              if any("Localization #49 L1 authoritative core contracts" in line and "Last Updated:" in line for line in ours):
                  local = next(line for line in ours if "Localization #49 L1 authoritative core contracts" in line and "Last Updated:" in line)
                  local = local.replace("(v2.135 —", "(v2.137 —", 1)
                  main = list(theirs)
                  pos = first_index(main, lambda line: "> **Last Updated:**" in line)
                  if pos is None:
                      raise SystemExit("CHANGELOG-src main Last Updated anchor missing")
                  main[pos] = main[pos].replace("> **Last Updated:**", "> **Last Updated (prior):**", 1)
                  return [local, ">"] + main
              if any(line.startswith("| 2.135 |") and "Localization #49 L1 authoritative core" in line for line in ours):
                  local = next(line for line in ours if line.startswith("| 2.135 |") and "Localization #49 L1 authoritative core" in line)
                  return [local.replace("| 2.135 |", "| 2.137 |", 1)] + list(theirs)
              raise SystemExit(f"CHANGELOG-src unexpected conflict {idx}")

          def resolve_changelog(idx, ours, theirs):
              if not any("Localization #49 L1 authoritative core landing" in line for line in ours):
                  raise SystemExit(f"CHANGELOG localization block missing in conflict {idx}")
              main = list(theirs)
              pos = first_index(main, lambda line: "> **Last Updated:**" in line)
              if pos is None:
                  raise SystemExit("CHANGELOG main Last Updated anchor missing")
              main[pos] = main[pos].replace("> **Last Updated:**", "> **Last Updated (prior):**", 1)
              return list(ours) + [""] + main

          def resolve_manifest(idx, ours, theirs):
              if not any("#49 Localization L1 authoritative core landing" in line for line in ours):
                  raise SystemExit(f"manifest localization block missing in conflict {idx}")
              local = [line.replace("`CHANGELOG-src.md` v2.135", "`CHANGELOG-src.md` v2.137", 1) for line in ours]
              main = list(theirs)
              pos = first_index(main, lambda line: "**Last Updated:**" in line)
              if pos is None:
                  raise SystemExit("manifest main Last Updated anchor missing")
              main[pos] = main[pos].replace("**Last Updated:**", "**Last Updated (prior):**", 1)
              return local + [""] + main

          def resolve_open_issues(idx, ours, theirs):
              local_audio = [line for line in ours if line.startswith("- **Audio & Sound Design (#51)") and "audio-implementation-plan.md` v1.7" in line]
              if len(local_audio) != 1:
                  raise SystemExit(f"open-issues expected one localization-aware audio row, found {len(local_audio)}")
              main_without_audio = [line for line in theirs if not line.startswith("- **Audio & Sound Design (#51)")]
              return local_audio + main_without_audio

          write_resolved("docs/tracking/CHANGELOG-src.md", resolve_src)
          write_resolved("docs/tracking/CHANGELOG.md", resolve_changelog)
          write_resolved("docs/tracking/file-manifest.md", resolve_manifest)
          write_resolved("docs/tracking/open-issues.md", resolve_open_issues)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          section = "docs/specs/localization-accessibility/section-2.md"
          replace_once(
              section,
              "**Last Updated:** September 12, 2026 (v0.6 — frozen-history restoration and LocaleId external-tag clarification)\n**Last Updated (prior):** September 11, 2026 (v0.5 — L1 typed-selector and value-identity contract; ERR-049-004 fix implemented pending tracker close-out)\n**Last Updated (prior):** July 27, 2026 (v0.4 — back-prop landed atomically with the ten-spec approval wave; see the version-history row)\n**Version:** 0.6",
              "**Last Updated:** September 14, 2026 (v0.7 — restore the omitted v0.3 header-chain record; review hardening only)\n**Last Updated (prior):** September 12, 2026 (v0.6 — frozen-history restoration and LocaleId external-tag clarification)\n**Last Updated (prior):** September 11, 2026 (v0.5 — L1 typed-selector and value-identity contract; ERR-049-004 fix implemented pending tracker close-out)\n**Last Updated (prior):** July 27, 2026 (v0.4 — back-prop landed atomically with the ten-spec approval wave; see the version-history row)\n**Last Updated (prior):** July 23, 2026 (v0.3 — repeat AR-3 (1H+1L) fix pass; APPROVED)\n**Version:** 0.7"
          )
          replace_once(
              section,
              "| 0.6 | 2026-09-12 | GPT-5.6 Sol | Restores the frozen v0.4 history row verbatim and clarifies that `LocaleId.Value` is an internal lower-case identity, not BCP-47 canonical form; Wave-8 external file/CLDR lookups map from it to the external canonical tag/form they require. |\n#endregion",
              "| 0.6 | 2026-09-12 | GPT-5.6 Sol | Restores the frozen v0.4 history row verbatim and clarifies that `LocaleId.Value` is an internal lower-case identity, not BCP-47 canonical form; Wave-8 external file/CLDR lookups map from it to the external canonical tag/form they require. |\n| 0.7 | 2026-09-14 | GPT-5.6 Sol | Restores the omitted v0.3 header-chain record. No normative contract change. |\n#endregion"
          )

          tests = "src/localization/tests/LocalizationCoreContractTests.cs"
          replace_once(tests, "// Modified: 2026-09-12", "// Modified: 2026-09-14")
          replace_once(
              tests,
              "Type[] publicTypes = assembly.GetExportedTypes()\n                .Where(IsAuthoredLocalizationType)\n                .ToArray();",
              "Type[] publicTypes = assembly.GetExportedTypes()\n                .Where(type => !IsExcludedRuntimeArtifact(type))\n                .ToArray();"
          )
          replace_once(
              tests,
              "Type[] authoredTypes = assembly.GetTypes()\n                .Where(IsAuthoredLocalizationType)\n                .ToArray();",
              "Type[] authoredTypes = assembly.GetTypes()\n                .Where(type => !IsExcludedRuntimeArtifact(type))\n                .ToArray();"
          )
          replace_once(
              tests,
              "\"Authored L1 localization types must not contain mutable static fields. Compiler-generated and coverage-instrumentation types are not localization-owned state.\");\n            Assert.That(fields.Any(field => ContainsForbiddenStateName(field.FieldType)), Is.False);\n            Assert.That(authoredTypes.Where(type => type.IsPublic || type.IsNestedPublic).Any(HasExplicitSerializableAttribute), Is.False);",
              "\"L1 localization assembly types must not contain mutable static fields. Only compiler-generated and Coverlet instrumentation artifacts are excluded.\");\n            Assert.That(fields.Any(ContainsForbiddenState), Is.False);\n            Assert.That(authoredTypes.Any(HasExplicitSerializableAttribute), Is.False);"
          )
          replace_once(
              tests,
              "private static bool IsAuthoredLocalizationType(Type type)\n        {\n            return type.Namespace != null\n                && (string.Equals(type.Namespace, \"TacticalDirector.Localization\", StringComparison.Ordinal)\n                    || type.Namespace.StartsWith(\"TacticalDirector.Localization.\", StringComparison.Ordinal))\n                && !type.IsDefined(typeof(CompilerGeneratedAttribute), false);\n        }\n\n        private static bool ContainsForbiddenStateName(Type type)",
              "private static bool IsExcludedRuntimeArtifact(Type type)\n        {\n            return type.IsDefined(typeof(CompilerGeneratedAttribute), false)\n                || type.Namespace != null\n                    && type.Namespace.StartsWith(\"Coverlet.Core.Instrumentation.Tracker\", StringComparison.Ordinal);\n        }\n\n        private static bool ContainsForbiddenState(FieldInfo field)\n        {\n            return ContainsForbiddenStateName(field.FieldType)\n                || ContainsForbiddenStateIdentifier(field.Name);\n        }\n\n        private static bool ContainsForbiddenStateIdentifier(string name)\n        {\n            return name.IndexOf(\"Random\", StringComparison.OrdinalIgnoreCase) >= 0\n                || name.IndexOf(\"Rng\", StringComparison.OrdinalIgnoreCase) >= 0\n                || name.IndexOf(\"Save\", StringComparison.OrdinalIgnoreCase) >= 0\n                || name.IndexOf(\"Snapshot\", StringComparison.OrdinalIgnoreCase) >= 0;\n        }\n\n        private static bool ContainsForbiddenStateName(Type type)"
          )
          replace_once(
              tests,
              "// | 1.4     | 2026-09-12 | GPT-5.6 Sol | Apply the authored-type scope consistently to public type-shape and serializable-attribute locks; compiler/coverage tracker types are implementation artifacts, not localization-contract types. |\n#endregion",
              "// | 1.4     | 2026-09-12 | GPT-5.6 Sol | Apply the authored-type scope consistently to public type-shape and serializable-attribute locks; compiler/coverage tracker types are implementation artifacts, not localization-contract types. |\n// | 1.5     | 2026-09-14 | GPT-5.6 Sol | Replace namespace allow-listing with explicit compiler/Coverlet exclusions; inspect all assembly-owned runtime types, field identifiers for RNG/persistence state, and `[Serializable]` on non-public types too. |\n#endregion"
          )

          changelog_src = "docs/tracking/CHANGELOG-src.md"
          p = Path(changelog_src)
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "Follow-up scopes reflection away from compiler/coverage-generated types.",
              "Review follow-up restores the omitted §2 v0.3 header-chain record and hardens reflection by excluding only compiler/Coverlet artifacts while checking every other assembly-owned runtime type, RNG/persistence field identifiers, and `[Serializable]` regardless of visibility.",
              1,
          )
          text = text.replace(
              "Structural locks for asmdef/reference direction, no sim/RNG/persistence state, exact `ulong` `SelectionDraw`, deterministic identity/hash and authored public type shape.",
              "Structural locks for asmdef/reference direction, no sim/RNG/persistence state, exact `ulong` `SelectionDraw`, deterministic identity/hash and assembly-wide runtime type shape with only compiler/Coverlet artifacts excluded.",
              1,
          )
          p.write_text(text, encoding="utf-8")

          changelog = "docs/tracking/CHANGELOG.md"
          p = Path(changelog)
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "Follow-up review restores frozen §2/§7 history, states that lower-case `LocaleId.Value` is an internal identity rather than BCP-47 canonical form, records the L3B tripwire narrowing rule, scopes reflection away from compiler/coverage generated types, and restores the source newline.",
              "Follow-up review restores frozen §2/§7 history plus the omitted §2 v0.3 header-chain record, states that lower-case `LocaleId.Value` is an internal identity rather than BCP-47 canonical form, records the L3B tripwire narrowing rule, and replaces namespace allow-listing with explicit compiler/Coverlet exclusions so all other assembly-owned runtime types remain covered; RNG/persistence field identifiers and `[Serializable]` on non-public types are now locked too.",
              1,
          )
          p.write_text(text, encoding="utf-8")

          manifest = "docs/tracking/file-manifest.md"
          p = Path(manifest)
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "#49 `outline.md`, §§1/2/4/7; Code Standards #20 §3.5.2;",
              "#49 `outline.md`, §§1/2/4/7 (section-2 now v0.7 with the omitted v0.3 header-chain record restored); Code Standards #20 §3.5.2;",
              1,
          )
          p.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/pr397-review-reconcile.yml
          git add docs/specs/localization-accessibility/section-2.md \
                  src/localization/tests/LocalizationCoreContractTests.cs \
                  docs/tracking/CHANGELOG-src.md \
                  docs/tracking/CHANGELOG.md \
                  docs/tracking/file-manifest.md \
                  docs/tracking/open-issues.md

          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' docs/tracking/CHANGELOG-src.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md docs/tracking/open-issues.md

          .claude/skills/landing-close-out/scripts/check_drift.sh
          python3 tools/assembly-tier-check.py
          python3 tools/doc-consistency-check.py --repo .

          set +e
          python3 tools/recurring-defect-lint.py --repo . > /tmp/merged-lint.txt 2>&1
          merged_lint_rc=$?
          set -e
          grep '^ERROR  ' /tmp/main-lint.txt | sort > /tmp/main-errors.txt || true
          grep '^ERROR  ' /tmp/merged-lint.txt | sort > /tmp/merged-errors.txt || true
          diff -u /tmp/main-errors.txt /tmp/merged-errors.txt
          if [ "$main_lint_rc" -eq 0 ] && [ "$merged_lint_rc" -ne 0 ]; then
            echo "Merged tree introduced a recurring-defect lint failure."
            cat /tmp/merged-lint.txt
            exit 1
          fi

          git status --short
          git commit -m "merge: reconcile PR 397 review with current main"
          git push origin HEAD:localization/l1-core-contracts
