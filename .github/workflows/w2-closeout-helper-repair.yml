name: Repair W2 closeout helper syntax

on:
  push:
    branches:
      - wiring/w2-production-activation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-production-activation
      - name: Repair helper and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/w2-activation-closeout.yml')
          text = p.read_text(encoding='utf-8')
          needle = "              '**PRODUCTION ACTIVATION — September 16, 2026.** The separate activation change now makes the catalogue fallback equal to `LooseBallPickupRadiusM` rather than `0`. The composed suite exercises that shipping value directly and locks the durable relationship `TackleContactRadiusM > 0` and `TackleContactRadiusM <= LooseBallPickupRadiusM`. The paired evidence under `docs/tracking/evidence/w2/` remains the activation prerequisite; focused run `35122576991` is the post-change execution proof. No tackle outcome/cooldown `[GT]` was calibrated, and no T-DA-DET-005 credit is claimed.\\n\\n'\n          if text.count(activation_marker) != 1:\n"
          replacement = needle.replace("          if text.count(activation_marker) != 1:\n", "          )\n          if text.count(activation_marker) != 1:\n")
          if text.count(needle) != 1:
              raise SystemExit(f'expected one syntax target, found {text.count(needle)}')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          Path('.github/workflows/w2-closeout-helper-repair.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair W2 activation closeout helper"
          git push origin HEAD:wiring/w2-production-activation
