name: W2 activation closeout one-shot

on:
  push:
    branches:
      - wiring/w2-production-activation

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-production-activation
          fetch-depth: 0
      - name: Apply closeout and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def insert_before_once(path, marker, addition):
              text = read(path)
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {marker[:100]!r}')
              write(path, text.replace(marker, addition + marker, 1))

          # Source/test file metadata: semantic change lives in MatchEngineConstants; test and discipline edits are locks/commentary.
          replace_once(
              'src/discipline/DisciplineConstants.cs',
              '// Modified: 2026-08-13\n',
              '// Modified: 2026-09-16 (W2 activation boundary — pre-tackle calibration is historical; post-W2 calibration remains separate)\n')
          insert_before_once(
              'src/discipline/DisciplineConstants.cs',
              '#endregion\n',
              '// | 1.6     | 2026-09-16 | —      | Documentation boundary only: W2 is now active; the cited #44 foul/card calibration remains pre-tackle and must be re-measured before retuning. |\n')
          insert_before_once(
              'src/match-engine/MatchEngineConstants.cs',
              '#endregion\n',
              '// | 1.37    | 2026-09-16 | —      | W2 production activation: TackleContactRadiusM fallback now inherits LooseBallPickupRadiusM after the paired post-W6 control; no tackle outcome/cooldown GT changed. |\n')
          insert_before_once(
              'src/match-engine/tests/MatchEngineTackleTests.cs',
              '#endregion\n',
              '// | 1.1     | 2026-09-16 | —      | W2 activation: composed locks exercise the shipping default directly; disabled-default lock replaced by >0 and <= loose-ball-reclaim invariants; restore no longer uses the test-only arm seam. |\n')

          # Append-only project changelog: demote the previous head verbatim, then prepend the activation record.
          changelog = 'docs/tracking/CHANGELOG.md'
          text = read(changelog)
          head = '# Changelog\n\n'
          if not text.startswith(head + '**Last Updated:** September 16, 2026 — W2 post-W6 paired-control closeout'):
              raise SystemExit('CHANGELOG head moved; refusing non-exact append-only edit')
          text = text.replace('**Last Updated:** September 16, 2026 — W2 post-W6 paired-control closeout', '**Last Updated (prior):** September 16, 2026 — W2 post-W6 paired-control closeout', 1)
          entry = (
              '**Last Updated:** September 16, 2026 — **W2 tackle challenge ACTIVATED in production after the governed post-W6 paired control.** '
              '`TackleContactRadiusM` now defaults to `LooseBallPickupRadiusM` (currently 1.0 m) rather than `0`, while the durable locks are relational: `TackleContactRadiusM > 0` and `TackleContactRadiusM <= LooseBallPickupRadiusM`. '
              'The composed tackle suite now exercises the shipping default directly instead of the test-only arm seam. Focused activation validation run `35122576991` built the full tree with 0 errors and passed 12/12 selected MatchEngine tests, including `sim_match_engine_inposs_gate`, the production tackle locks/save-restore path, and the capstone harness selection. Separate real-capstone run `35123092565` passed 1/1 on Linux; this is non-certifying execution evidence, not a certified performance budget claim. '
              'The activation consumes the already-landed keyed tackle draw and may consequently reach the existing `match-flow.card-severity` draw on tackle-foul ticks; it adds no RNG stream/domain/draw site, snapshot field, or schema change. W2 receives **no T-DA-DET-005 credit**. The ten tackle-outcome `[GT]`s and `TackleCooldownStrides` remain uncalibrated and unchanged. The August 13 foul/card figures remain pre-tackle evidence; **post-W2 foul/card calibration is now the next separate pass**. The owner-held `sim_match_engine_close_chance` RED remains unchanged and non-required.\n\n'
          )
          write(changelog, head + entry + text[len(head):])

          # File manifest is also an append-only head chain.
          manifest = 'docs/tracking/file-manifest.md'
          text = read(manifest)
          head = '# File Manifest (Post-Migration Baseline)\n\n'
          if not text.startswith(head + '**Last Updated:** September 16, 2026 — **W2 post-W6 paired evidence closeout'):
              raise SystemExit('file-manifest head moved; refusing non-exact append-only edit')
          text = text.replace('**Last Updated:** September 16, 2026 — **W2 post-W6 paired evidence closeout', '**Last Updated (prior):** September 16, 2026 — **W2 post-W6 paired evidence closeout', 1)
          entry = (
              '**Last Updated:** September 16, 2026 — **W2 production activation / PR #418.**\n'
              '**Modified production/source (2):** `src/match-engine/MatchEngineConstants.cs` (shipping `TackleContactRadiusM` fallback `0` → `LooseBallPickupRadiusM`; current fallback 1.0 m) and `src/discipline/DisciplineConstants.cs` (comment/version record only; no discipline value change). **Modified test (1):** `src/match-engine/tests/MatchEngineTackleTests.cs` — production default is exercised directly and locked `> 0` / `<= LooseBallPickupRadiusM`; restore no longer re-arms a test seam. **Tracking:** `docs/tracking/match-engine-wiring-backlog.md` v1.20 → v1.21, `docs/tracking/tackle-wiring-design.md`, `docs/tracking/open-issues.md`, `docs/tracking/CHANGELOG.md`, and this manifest. Focused run `35122576991`: full-tree build 0 errors, 12/12 selected activation tests green. Capstone-only run `35123092565`: 1/1 green on Linux, explicitly non-certifying. No assembly edge, durable field, snapshot/save schema, new RNG stream/domain/draw site, or `[GT]` value changed. W2 receives no T-DA-DET-005 credit. Ten tackle-outcome `[GT]`s plus `TackleCooldownStrides` remain uncalibrated; post-W2 foul/card calibration is next.\n\n'
          )
          write(manifest, head + entry + text[len(head):])

          # Backlog current-status head + W2 activation record. Historical August disabled text stays verbatim.
          backlog = 'docs/tracking/match-engine-wiring-backlog.md'
          text = read(backlog)
          start = text.index('> **UPDATED September 16, 2026 (v1.20):**')
          end = text.index('\n\n## 0. Why this document exists', start)
          new_head = (
              '> **UPDATED September 16, 2026 (v1.21):** W2 is now **ACTIVE IN PRODUCTION** after the completed post-W6 paired-control obligation. '
              '`TackleContactRadiusM` defaults to `LooseBallPickupRadiusM` (currently 1.0 m), with durable locks `> 0` and `<= LooseBallPickupRadiusM`; the exact 1.0 m value is not an eternal invariant. '
              'Focused validation run `35122576991` built the full tree with 0 errors and passed 12/12 selected activation tests, including the governed InPoss gate and production-default tackle locks; capstone-only run `35123092565` passed 1/1 on Linux and is non-certifying. '
              'Four Class-A items remain: W3, W8, W9, W10. The ten tackle-outcome `[GT]`s and `TackleCooldownStrides` remain explicitly uncalibrated; post-W2 foul/card calibration is now the next separate realism pass. No T-DA-DET-005 credit is claimed, and the owner-held close-chance RED remains unchanged.'
          )
          text = text[:start] + new_head + text[end:]
          old_heading = '### W2 — No player has ever made a tackle — ⚙️ **BUILT August 12, 2026; SHIPS DISABLED; P-W6-1 STALL BLOCKER CLEARED September 15, 2026**'
          new_heading = '### W2 — No player had ever made a tackle — ✅ **ACTIVE IN PRODUCTION September 16, 2026; P-W6-1 STALL BLOCKER CLEARED**'
          if text.count(old_heading) != 1:
              raise SystemExit('W2 heading changed unexpectedly')
          text = text.replace(old_heading, new_heading, 1)
          activation_marker = '**W2 NOW GATES THE FOUL/CARD CALIBRATION — owner sequencing decision, August 15, 2026.**'
          activation_note = (
              '**PRODUCTION ACTIVATION — September 16, 2026.** The separate activation change now makes the catalogue fallback equal to `LooseBallPickupRadiusM` rather than `0`. The composed suite exercises that shipping value directly and locks the durable relationship `TackleContactRadiusM > 0` and `TackleContactRadiusM <= LooseBallPickupRadiusM`. The paired evidence under `docs/tracking/evidence/w2/` remains the activation prerequisite; focused run `35122576991` is the post-change execution proof. No tackle outcome/cooldown `[GT]` was calibrated, and no T-DA-DET-005 credit is claimed.\n\n'
          if text.count(activation_marker) != 1:
              raise SystemExit('W2 foul/card marker changed unexpectedly')
          text = text.replace(activation_marker, activation_note + activation_marker, 1)
          vh_marker = '|---|---|---|---|\n| 1.20 | 2026-09-16 | — |'
          if text.count(vh_marker) != 1:
              raise SystemExit('backlog version-history head changed unexpectedly')
          text = text.replace(vh_marker, '|---|---|---|---|\n| 1.21 | 2026-09-16 | — | **W2 production activation.** Shipping fallback `0` → `LooseBallPickupRadiusM`; composed locks now exercise production and enforce `>0` / `<= reclaim radius`; focused activation run `35122576991` 12/12 green and capstone-only run `35123092565` 1/1 non-certifying green. Ten outcome `[GT]`s/cooldown unchanged; foul/card calibration follows; no T-DA-DET-005 credit. |\n| 1.20 | 2026-09-16 | — |', 1)
          write(backlog, text)

          # Tackle design gets a current-status overlay; the August design/evidence body is historical and stays untouched.
          tackle_design = 'docs/tracking/tackle-wiring-design.md'
          text = read(tackle_design)
          first_rule = '\n---\n\n## 0. This is a wiring task, not a realism pass\n'
          if text.count(first_rule) != 1:
              raise SystemExit('tackle design opening structure changed unexpectedly')
          overlay = (
              '\n---\n\n## Current activation status — September 16, 2026\n\n'
              'W2 is **ACTIVE IN PRODUCTION**. `TackleContactRadiusM` now defaults to `LooseBallPickupRadiusM` (currently 1.0 m), and the production-composed locks require a positive reach that cannot exceed ordinary loose-ball reclaim reach. This is the activation of the already-landed mechanism, not an outcome-model calibration: the ten tackle-outcome `[GT]`s and `TackleCooldownStrides` are unchanged and remain explicitly uncalibrated.\n\n'
              'The release basis is the immutable paired post-W6 evidence in `docs/tracking/evidence/w2/` (Actions `35096793576`). The post-change focused execution proof is Actions `35122576991` (full-tree build 0 errors; 12/12 selected activation tests green, including `sim_match_engine_inposs_gate` and the production tackle locks). The real capstone harness also executed green 1/1 in `35123092565`; Linux timing is non-certifying. No new snapshot state/schema or RNG stream/domain/draw site was added, and W2 receives **no T-DA-DET-005 credit**. The next separate work is foul/card calibration on the now-active contact stream.\n\n'
              'Everything below this overlay is the chronological August investigation/landing record and is intentionally not rewritten to pretend W2 shipped active at that time.\n\n'
              '## 0. This is a wiring task, not a realism pass\n'
          )
          text = text.replace(first_rule, overlay, 1)
          write(tackle_design, text)

          # Live issue summaries only. Historical body stays present and is explicitly labeled where superseded.
          open_issues = 'docs/tracking/open-issues.md'
          text = read(open_issues)
          old_title = '**Match-engine wiring backlog — W1/C1/W4/W5/W6/W7/W12 wired and W2 BUILT-BUT-DISABLED; 4 remaining Class-A wiring items (W3, W8–W10) still need production wiring/integration, and the `[GT]` freeze (KD-W1) that follows**'
          new_title = '**Match-engine wiring backlog — W1/C1/W2/W4/W5/W6/W7/W12 wired/active; 4 remaining Class-A wiring items (W3, W8–W10) still need production wiring/integration, and the `[GT]` freeze (KD-W1) that follows**'
          if text.count(old_title) != 1:
              raise SystemExit('open-issues wiring title changed unexpectedly')
          text = text.replace(old_title, new_title, 1)
          pointer = 'Full inventory, evidence and wire-order: `docs/tracking/match-engine-wiring-backlog.md` v1.0, now v1.20.'
          replacement = pointer.replace('v1.20', 'v1.21') + ' **UPDATE September 16, 2026:** W2 is now active in production at the safe reclaim-relative default; the paired stall evidence and production locks are closed, while its ten outcome `[GT]`s/cooldown remain uncalibrated. Post-W2 foul/card calibration is now next.'
          if text.count(pointer) != 1:
              raise SystemExit('open-issues backlog pointer changed unexpectedly')
          text = text.replace(pointer, replacement, 1)
          text = text.replace('now v1.20', 'now v1.21')
          historical = '**Not fixed here, by KD-W1**:'
          if text.count(historical) != 1:
              raise SystemExit('foul/card historical disposition marker changed unexpectedly')
          text = text.replace(historical, '**UPDATE September 16, 2026 — W2 prerequisite SATISFIED; calibration is now next.** The August 13 `35.0 / 5.0 / 1.00` figures remain pre-tackle evidence and are not a post-activation measurement. No discipline `[GT]` is changed by W2 activation. **Historical pre-activation disposition:**', 1)
          write(open_issues, text)

          # The owning foul/card design retains the August decision and records that its prerequisite is now satisfied.
          foul_design = 'docs/tracking/foul-discipline-balance-design.md'
          text = read(foul_design)
          marker = '   **✅ OWNER DECISION, August 17, 2026: hold the drift. Arm W2 first, then calibrate ONCE.**'
          if text.count(marker) != 1:
              raise SystemExit('foul design owner-decision marker changed unexpectedly')
          text = text.replace(marker, '   **✅ OWNER DECISION, August 17, 2026: hold the drift. Arm W2 first, then calibrate ONCE.**\n   **UPDATE September 16, 2026:** the W2 prerequisite is now satisfied by production activation; the next action is the single post-W2 foul/card re-measurement and calibration pass. The August measurements remain historical pre-tackle evidence.', 1)
          write(foul_design, text)

          # Remove the one-shot itself before the durable commit.
          Path('.github/workflows/w2-activation-closeout.yml').unlink()
          PY

          git diff --check
          python3 tools/doc-consistency-check.py --repo .
          if [ -x .claude/skills/landing-close-out/scripts/check_drift.sh ]; then
            bash .claude/skills/landing-close-out/scripts/check_drift.sh
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close W2 production activation tracking"
          git push origin HEAD:wiring/w2-production-activation
