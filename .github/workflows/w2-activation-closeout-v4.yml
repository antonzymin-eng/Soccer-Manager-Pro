name: W2 activation finalizer

on:
  push:
    branches:
      - wiring/w2-production-activation

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-production-activation
          fetch-depth: 0
      - name: Finalize W2 activation and remove temporary scaffolding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          def replace1(p, old, new):
              s = read(p)
              if s.count(old) != 1:
                  raise SystemExit(f'{p}: expected one occurrence: {old[:100]!r}; found {s.count(old)}')
              write(p, s.replace(old, new, 1))
          def sub1(p, pattern, repl, flags=0):
              s = read(p)
              out, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{p}: expected one regex match: {pattern!r}; found {n}')
              write(p, out)
          def add_before_last_endregion(p, row, token):
              s = read(p)
              if token in s: return
              i = s.rfind('#endregion')
              if i < 0: raise SystemExit(f'{p}: final #endregion missing')
              write(p, s[:i] + row + s[i:])

          # Production lower-bound lock. The existing > LooseBallPickupRadiusM guard remains untouched.
          p = 'src/match-engine/MatchEngine.cs'
          replace1(p, '// Created:  2026-06-16\n',
              '// Created:  2026-06-16\n// Modified: 2026-09-16 (W2 production activation — active tackle reach must be > 0 and <= loose-ball reclaim reach; zero remains only as a test/measurement negative-control override; no schema/RNG change)\n')
          replace1(p,
              '            // DISABLED is disabled, not "reachable only at exactly zero separation". Shipping the\n            // constant at 0 must mean no challenge is ever resolved, and an explicit exit says so\n            // where a >= comparison on a zero radius would merely make it vanishingly unlikely.\n            if (radius <= 0f)\n            {\n                return;\n            }',
              '            // W2 is active in production. A non-positive catalogue value is a configuration\n            // violation and fails loudly; explicit zero remains available only through the\n            // test/measurement override as a negative control.\n            if (radius <= 0f)\n            {\n                if (_tackleContactRadiusOverrideM < 0f)\n                {\n                    throw new InvalidOperationException(\n                        "MatchEngine.TryResolveTackles: production TackleContactRadiusM must be > 0 when W2 is active.");\n                }\n\n                return;\n            }')
          s = read(p)
          sig = '        internal void TestOnly_ArmTackleChallenge(float radiusM) => _tackleContactRadiusOverrideM = radiusM;'
          i = s.index(sig)
          start = s.rfind('        /// <summary>', max(0, i - 1200), i)
          if start < 0: raise SystemExit('MatchEngine.cs: tackle override XML summary not found')
          newdoc = ('        /// <summary>Test-only/measurement seam: overrides the active W2 challenge reach.\n'
                    '        /// Zero is the explicit disarmed negative control; a negative value restores the\n'
                    '        /// production catalogue path. This override is not serialized.</summary>\n')
          write(p, s[:start] + newdoc + s[i:])
          s = read(p)
          field = '        private float _tackleContactRadiusOverrideM = -1f;'
          i = s.index(field)
          start = s.rfind('        // The challenge\'s effective reach.', max(0, i - 900), i)
          if start < 0: raise SystemExit('MatchEngine.cs: tackle override field comment not found')
          fielddoc = ('        // The challenge\'s effective reach. Negative means use the active production catalogue;\n'
                      '        // zero is retained only as an explicit test/measurement negative control. GameplayConfig\n'
                      '        // binding is one-shot per process, so tests use the override instead of rebinding config.\n')
          write(p, s[:start] + fielddoc + s[i:])
          add_before_last_endregion(p,
              '// | 1.80    | 2026-09-16 | —      | W2 production activation: non-positive catalogue reach now fails loud; zero remains only for the explicit test/measurement override. Existing <= LooseBallPickupRadiusM guard unchanged; no schema/RNG change. |\n',
              '// | 1.80    |')

          p = 'src/match-engine/MatchEngineConstants.cs'
          replace1(p,
              '        /// <para><b>It MUST NOT exceed <see cref="LooseBallPickupRadiusM"/>, and that is a correctness\n',
              '        /// <para><b>It MUST be greater than zero and MUST NOT exceed <see cref="LooseBallPickupRadiusM"/>, and those are correctness\n')
          add_before_last_endregion(p,
              '// | 1.37    | 2026-09-16 | —      | W2 production activation: TackleContactRadiusM fallback now inherits LooseBallPickupRadiusM; durable contract is > 0 and <= reclaim radius; outcome/cooldown GTs unchanged. |\n',
              '// | 1.37    |')

          add_before_last_endregion('src/match-engine/tests/MatchEngineTackleTests.cs',
              '// | 1.1     | 2026-09-16 | —      | W2 activation: composed locks exercise the shipping default; disabled-default lock becomes >0 / <= reclaim invariants; restore no longer arms the test seam. |\n',
              '// | 1.1     | 2026-09-16 |')
          p = 'src/discipline/DisciplineConstants.cs'
          s = read(p)
          if '// Modified: 2026-09-16 (W2 activation boundary' not in s:
              if '// Modified: 2026-08-13\n' not in s: raise SystemExit('DisciplineConstants header anchor missing')
              s = s.replace('// Modified: 2026-08-13\n', '// Modified: 2026-09-16 (W2 activation boundary — pre-tackle calibration is historical; post-W2 calibration remains separate)\n// Modified: 2026-08-13\n', 1)
              write(p, s)
          add_before_last_endregion(p,
              '// | 1.6     | 2026-09-16 | —      | W2 is active; the cited foul/card calibration remains pre-tackle and must be re-measured before any separate retuning pass. |\n',
              '// | 1.6     |')

          # Tracking. Do not record activation-branch commit SHAs: final-head CI/PR identity is enough.
          p = 'docs/tracking/CHANGELOG.md'
          current = '> **Last Updated:** September 16, 2026 — **W2 post-W6 paired-control closeout is durable and activation may proceed as a separate change.**'
          prior = current.replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          replace1(p, current, prior)
          s = read(p)
          entry = ('> **Last Updated:** September 16, 2026 — **W2 tackle resolution is ACTIVE IN PRODUCTION.** '
                   '`TackleContactRadiusM` now defaults relationally to `LooseBallPickupRadiusM` rather than `0`; the production contract is `> 0` and `<= LooseBallPickupRadiusM`, with both violations fail-loud on the production catalogue path. Explicit zero remains only as a test/measurement negative control, so the current 1.0 m fallback is not an eternal ceiling. Composed W2 locks now run against the shipping default. Pre-final focused activation validation run `35122576991` and non-certifying Linux capstone run `35123092565` succeeded before the final lower-bound hardening; final-head PR CI owns the merge verdict. No tackle-outcome `[GT]`, `TackleCooldownStrides`, discipline `[GT]`, RNG stream/domain/draw site, durable field, snapshot schema, or save format changed. **T-DA-DET-005 remains deferred and receives no W2 credit.** The ten tackle-outcome `[GT]` values remain accepted uncalibrated debt, foul/card calibration remains a separate next pass, and the owner-held `sim_match_engine_close_chance` RED is unchanged.\n>\n')
          write(p, s.replace(prior, entry + prior, 1))

          p = 'docs/tracking/CHANGELOG-src.md'
          old = '> **Last Updated:** September 15, 2026 (v2.139 — **W6 Controlled Ball wiring / PR #412 review closure.**'
          prior = old.replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          replace1(p, old, prior)
          s = read(p)
          entry = ('> **Last Updated:** September 16, 2026 (v2.140 — **W2 production activation.** '
                   '`MatchEngineConstants.TackleContactRadiusM` now defaults to `LooseBallPickupRadiusM`; `MatchEngine.TryResolveTackles` fails loud on a non-positive production catalogue value and retains the existing upper fail-loud bound, while explicit zero remains only through the test/measurement override. `MatchEngineTackleTests` exercises the active shipping default and locks `> 0` / `<= LooseBallPickupRadiusM`; save/restore no longer re-arms a test seam. `DisciplineConstants` changes comments/version only. Ten tackle-outcome `[GT]` values and `TackleCooldownStrides` are unchanged; T-DA-DET-005 remains deferred; no schema/RNG/draw-site/save-format change. Full account: `docs/tracking/CHANGELOG.md`.)\n>\n')
          s = s.replace(prior, entry + prior, 1)
          if not re.search(r'^\| 2\.140\s+\|', s, re.M):
              m = re.search(r'^\| 2\.139\s+\|', s, re.M)
              if not m: raise SystemExit('CHANGELOG-src v2.139 table row missing')
              s = s[:m.start()] + '| 2.140   | 2026-09-16 | —      | W2 production activation: active relational tackle reach; lower/upper fail-loud contract; shipping-default composed locks; no GT/schema/RNG retune. |\n' + s[m.start():]
          write(p, s)

          p = 'docs/tracking/file-manifest.md'
          current = '**Last Updated:** September 16, 2026 — **W2 post-W6 paired evidence closeout; documentation/evidence only.**'
          prior = current.replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          replace1(p, current, prior)
          s = read(p)
          entry = ('**Last Updated:** September 16, 2026 — **W2 production activation / PR #418.** **Modified production/source (3):** `src/match-engine/MatchEngineConstants.cs` (shipping fallback `0` → `LooseBallPickupRadiusM`; relational `> 0` / `<= reclaim` contract), `src/match-engine/MatchEngine.cs` (non-positive production catalogue reach now fails loud; test-only zero negative control retained; existing upper guard preserved), and `src/discipline/DisciplineConstants.cs` (comment/version only, no discipline value change). **Modified test (1):** `src/match-engine/tests/MatchEngineTackleTests.cs` (shipping default exercised directly; active/reclaim invariants locked; restore no longer re-arms). **Tracking:** both changelogs, backlog v1.20 → v1.21, tackle design, foul-discipline design, open issues, and this manifest. No assembly edge, durable field, snapshot/save schema, RNG stream/domain/draw site, or `[GT]` value changed. T-DA-DET-005 remains deferred; ten tackle-outcome `[GT]` values and `TackleCooldownStrides` remain uncalibrated; foul/card calibration remains separate.\n\n')
          write(p, s.replace(prior, entry + prior, 1))

          p = 'docs/tracking/match-engine-wiring-backlog.md'
          s = read(p)
          s, n = re.subn(r'> \*\*UPDATED September 16, 2026 \(v1\.20\):\*\*.*?(?=\n\n## 0\.)',
              '> **UPDATED September 16, 2026 (v1.21):** W2 is now **ACTIVE IN PRODUCTION** after the completed post-W6 paired-control obligation. `TackleContactRadiusM` defaults relationally to `LooseBallPickupRadiusM` (currently 1.0 m), with a durable contract `> 0` and `<= LooseBallPickupRadiusM`; 1.0 m is not an eternal invariant. The production path fails loud on a non-positive catalogue value and retains the existing upper guard; explicit zero remains only as a test/measurement negative control. Four Class-A items remain: W3, W8, W9, W10. The ten tackle-outcome `[GT]` values and `TackleCooldownStrides` remain uncalibrated, foul/card calibration remains separate, T-DA-DET-005 remains deferred with no W2 credit, and the owner-held close-chance RED is unchanged.',
              s, count=1, flags=re.S)
          if n != 1: raise SystemExit('backlog current status block missing')
          s, n = re.subn(r'^### W2 — .*$', '### W2 — No player had ever made a tackle — **ACTIVE IN PRODUCTION September 16, 2026; P-W6-1 STALL BLOCKER CLEARED**', s, count=1, flags=re.M)
          if n != 1: raise SystemExit('backlog W2 heading missing')
          owner = '**W2 NOW GATES THE FOUL/CARD CALIBRATION — owner sequencing decision, August 15, 2026.**'
          if owner not in s: raise SystemExit('backlog W2 owner-sequence anchor missing')
          note = ('**PRODUCTION ACTIVATION — September 16, 2026.** The shipping fallback is now `LooseBallPickupRadiusM` rather than `0`, and the composed suite exercises that production value directly. The durable contract is relational (`> 0`, `<= LooseBallPickupRadiusM`), with both violations fail-loud on the production catalogue path; explicit zero remains only for test/measurement negative controls. No tackle outcome/cooldown `[GT]` was calibrated, foul/card calibration remains separate, and no T-DA-DET-005 credit is claimed.\n\n')
          s = s.replace(owner, note + owner, 1)
          if not re.search(r'^\| 1\.21 \|', s, re.M):
              m = re.search(r'^\| 1\.20 \|', s, re.M)
              if not m: raise SystemExit('backlog v1.20 version row missing')
              s = s[:m.start()] + '| 1.21 | 2026-09-16 | — | **W2 production activation.** Shipping fallback `0` → `LooseBallPickupRadiusM`; production contract `> 0` / `<= reclaim radius` is fail-loud; shipping-default composed locks replace the disabled-default posture. Outcome `[GT]`s/cooldown unchanged; foul/card calibration remains separate; no T-DA-DET-005 credit. |\n' + s[m.start():]
          write(p, s)

          p = 'docs/tracking/tackle-wiring-design.md'
          s = read(p)
          heading = '## 0. This is a wiring task, not a realism pass'
          if s.count(heading) != 1: raise SystemExit('tackle design section 0 anchor missing')
          overlay = ('## Current activation status — September 16, 2026\n\nW2 is **ACTIVE IN PRODUCTION**. `TackleContactRadiusM` defaults to `LooseBallPickupRadiusM` (currently 1.0 m); the durable contract is relational: positive reach, never beyond ordinary loose-ball reclaim reach. Production fails loudly on either violation. Zero remains only as an explicit test/measurement negative control, and 1.0 m is not a permanent conceptual ceiling.\n\nThe activation rests on the already-durable paired evidence in `docs/tracking/evidence/w2/`; it does not reinterpret that evidence. The ten tackle-outcome `[GT]` values and `TackleCooldownStrides` remain unchanged and uncalibrated. T-DA-DET-005 still requires `DefensiveAITick`\'s own `DeterministicRngService` path and receives no W2 credit. Foul/card calibration is a separate subsequent pass. Everything below is the chronological August investigation/landing record and is intentionally preserved as history.\n\n')
          write(p, s.replace(heading, overlay + heading, 1))

          p = 'docs/tracking/open-issues.md'
          s = read(p)
          pattern = r'\*\*Match-engine wiring backlog — W1/C1/W4/W5/W6/W7/W12 wired and W2 BUILT-BUT-DISABLED; 4 remaining Class-A wiring items \(W3, W8–W10\) still need production wiring/integration, and the `\[GT\]` freeze \(KD-W1\) that follows\*\*'
          repl = '**Match-engine wiring backlog — W1/C1/W2/W4/W5/W6/W7/W12 wired/active; 4 remaining Class-A wiring items (W3, W8–W10) still need production wiring/integration, and the `[GT]` freeze (KD-W1) that follows**'
          s, n = re.subn(pattern, repl, s, count=1)
          if n != 1: raise SystemExit('open-issues W2 backlog heading missing')
          s = s.replace('`docs/tracking/match-engine-wiring-backlog.md` v1.0, now v1.20.', '`docs/tracking/match-engine-wiring-backlog.md` v1.0, now v1.21.', 1)
          anchor = 'Full inventory, evidence and wire-order: `docs/tracking/match-engine-wiring-backlog.md` v1.0, now v1.21.'
          if anchor not in s: raise SystemExit('open-issues backlog pointer missing')
          s = s.replace(anchor, anchor + ' **W2 production activation landed September 16, 2026: shipping reach is positive and bounded by `LooseBallPickupRadiusM`; tackle outcome/cooldown `[GT]` calibration, T-DA-DET-005, and foul/card calibration remain separate work.**', 1)
          write(p, s)

          p = 'docs/tracking/foul-discipline-balance-design.md'
          s = read(p)
          owner = '**✅ OWNER DECISION, August 17, 2026: hold the drift. Arm W2 first, then calibrate ONCE.**'
          if owner not in s: raise SystemExit('foul-discipline owner decision anchor missing')
          status = '**CURRENT STATUS, September 16, 2026:** W2 is now active in production, satisfying the sequencing prerequisite below. This activation does **not** retune foul/card values; the post-W2 measurement and calibration remain a separate pass. The August 17 paragraph is retained as the historical owner decision that established that order.\n\n'
          write(p, s.replace(owner, status + owner, 1))

          # Boundaries must remain explicit.
          checks = {
              'docs/tracking/match-engine-wiring-backlog.md': ['ACTIVE IN PRODUCTION', 'T-DA-DET-005', 'uncalibrated'],
              'docs/tracking/tackle-wiring-design.md': ['ACTIVE IN PRODUCTION', 'T-DA-DET-005', 'Foul/card calibration'],
              'docs/tracking/CHANGELOG.md': ['W2 tackle resolution is ACTIVE IN PRODUCTION', 'owner-held `sim_match_engine_close_chance` RED'],
          }
          for path, needles in checks.items():
              body = read(path)
              for needle in needles:
                  if needle not in body: raise SystemExit(f'{path}: missing required closeout text {needle!r}')
          PY

          rm -f .github/workflows/w2-activation-closeout-v4.yml .github/w2-activation-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finalize W2 production activation"
          git push origin HEAD:wiring/w2-production-activation
