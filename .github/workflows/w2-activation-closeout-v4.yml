name: W2 activation finalizer

on:
  push:
    branches:
      - wiring/w2-production-activation

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-production-activation
          fetch-depth: 0
      - name: Finalize W2 activation source and tracking
        shell: bash
        run: |
          python3 .github/w2_finalize.py
          rm -f .github/w2-activation-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finalize W2 production activation"
          git push origin HEAD:wiring/w2-production-activation
