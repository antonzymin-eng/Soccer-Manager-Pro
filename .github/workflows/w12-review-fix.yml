name: W12 review fix runner

on:
  push:
    branches:
      - wiring/w12-gate-firing-diagnostic
    paths:
      - '.github/w12-review-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w12-gate-firing-diagnostic
      - name: Apply review fixes and remove one-shot runner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/pressing-ai/PressingAITick.cs')
          s = p.read_text(encoding='utf-8')
          old = (
              "            _lastDirective     = directive;\n"
              "            _lastDiagnostics   = new PressingTickDiagnostics(\n"
              "                snapshot.TickIndex, phase, PressingGateExit.Active,\n"
              "                hasLatestPass, raw, committed, primaryId, shadowCount);\n"
              "            _lastProcessedTick = snapshot.TickIndex;\n"
          )
          new = (
              "            _lastDirective     = directive;\n"
              "            PressingGateExit finalExit = directive.IsActive\n"
              "                ? PressingGateExit.Active\n"
              "                : PressingGateExit.NoPrimaryPresser;\n"
              "            _lastDiagnostics   = new PressingTickDiagnostics(\n"
              "                snapshot.TickIndex, phase, finalExit,\n"
              "                hasLatestPass, raw, committed,\n"
              "                directive.PrimaryPresserId, directive.CoverShadowCount);\n"
              "            _lastProcessedTick = snapshot.TickIndex;\n"
          )
          if old not in s:
              raise SystemExit('expected active diagnostic block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/w12-review-fix.yml .github/w12-review-fix-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(w12): align diagnostics with final directive'
          git push origin HEAD:wiring/w12-gate-firing-diagnostic
