name: Spec 40 T2b docs patch

on:
  push:
    branches:
      - openai/spec-40-finance-t2b-runtime

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/spec-40-finance-t2b-runtime
          fetch-depth: 0
      - name: Apply guarded documentation patch
        run: python3 tools/spec40_t2b_docs_patch.py
      - name: Validate patch hygiene
        run: git diff --check -- docs/specs docs/tracking/spec-error-log.md
      - name: Commit changed documents through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "openai/spec-40-finance-t2b-runtime"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD", "--", "docs/specs", "docs/tracking/spec-error-log.md"],
              text=True,
          ).splitlines()
          if not changed:
              raise SystemExit("documentation patch produced no changes")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          for path in changed:
              quoted = urllib.parse.quote(path, safe="/")
              api = f"https://api.github.com/repos/{repo}/contents/{quoted}?ref={urllib.parse.quote(branch, safe='')}"
              with urllib.request.urlopen(urllib.request.Request(api, headers=headers)) as response:
                  current = json.load(response)
              payload = json.dumps({
                  "message": f"docs(finance): reconcile T2b contract in {path}",
                  "content": base64.b64encode(open(path, "rb").read()).decode("ascii"),
                  "sha": current["sha"],
                  "branch": branch,
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/{quoted}",
                  data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              print(path, result["commit"]["sha"])
          PY
