name: System XI main-drift audit

on:
  push:
    branches:
      - codex/system-xi-naming-migration

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan post-base main changes for retired branding
        shell: bash
        run: |
          set -euo pipefail
          BASE=635f68c3ba1bd58686ae9300116b2cf195cc37b4
          git fetch origin main
          MAIN=$(git rev-parse origin/main)
          echo "main=$MAIN"
          mapfile -t files < <(git diff --name-only "$BASE" "$MAIN")
          found=0
          for f in "${files[@]}"; do
            if git cat-file -e "$MAIN:$f" 2>/dev/null; then
              hits=$(git show "$MAIN:$f" | grep -Ein 'Tactical Director|Soccer Manager Pro' || true)
              if [ -n "$hits" ]; then
                echo "LEGACY_NAME_IN_CURRENT_MAIN: $f"
                echo "$hits"
                found=1
              fi
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo 'Current main has post-base files containing retired product names.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/system-xi-main-drift-audit.yml
          git commit -m 'Complete System XI main-drift audit'
          git push origin HEAD:codex/system-xi-naming-migration
