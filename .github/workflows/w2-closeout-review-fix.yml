name: Address W2 closeout review finding

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w2-closeout-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          fetch-depth: 0
      - name: Mark paired control complete in authoritative sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/tracking/match-engine-wiring-backlog.md')
          text = path.read_text(encoding='utf-8')
          old = ('The separately pre-registered P-W6-1 run is complete and clears the historical stall blocker; '
                 'a like-for-like disarmed control and then a separate production activation change remain before the post-W2 calibration pass.')
          new = ('The separately pre-registered P-W6-1 run and same-head/same-seed disarmed control are complete and clear the historical stall blocker; '
                 'only the separate production activation change remains before the post-W2 calibration pass.')
          if text.count(old) != 1:
              raise SystemExit(f'expected one pending-control sequence sentence, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/doc-consistency-check.py --repo .
          git diff --check
      - name: Commit review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/match-engine-wiring-backlog.md
          git commit -m "Mark W2 disarmed control complete"
          git push origin HEAD:wiring/w2-post-w6-closeout
