name: W4 Apply Consumer Wiring

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/workflows/w4-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
          fetch-depth: 0

      - name: Apply W4 consumer wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "src/collision-system/CollisionSystem.cs"
          old = '''        public void UpdateCollisions(
            AgentState[] agentStates,
            PlayerAttributes[] agentAttrs,
            int[] agentTeamIds,
            bool[] agentIsGoalkeeper,
            bool[] knockdownOut,
            float[] knockdownForceOut,
            bool[] stumbleOut,
            ref BallState ball,
            ulong matchSeed,
            int frameNumber,
            float matchTime,
            ICollisionEventConsumer eventConsumer)
        {
            using var _ = s_updateMarker.Auto();
'''
          new = '''        public void UpdateCollisions(
            AgentState[] agentStates,
            PlayerAttributes[] agentAttrs,
            int[] agentTeamIds,
            bool[] agentIsGoalkeeper,
            bool[] knockdownOut,
            float[] knockdownForceOut,
            bool[] stumbleOut,
            ref BallState ball,
            ulong matchSeed,
            int frameNumber,
            float matchTime,
            ICollisionEventConsumer eventConsumer)
        {
            UpdateCollisions(
                agentStates, agentAttrs, agentTeamIds, agentIsGoalkeeper,
                knockdownOut, knockdownForceOut, stumbleOut,
                ref ball, matchSeed, frameNumber, matchTime, eventConsumer,
                out _);
        }

        /// <summary>
        /// W4 composition overload. Runs the identical collision pipeline and reports whether at least
        /// one confirmed AGENT_BALL contact applied a real Ball Physics deflection during this call.
        /// The result is per-call output only: no latch is retained and CollisionEvent remains unchanged.
        /// </summary>
        /// <param name="ballDeflected">True iff BallCollisionHandler changed the ball flight at least once.</param>
        public void UpdateCollisions(
            AgentState[] agentStates,
            PlayerAttributes[] agentAttrs,
            int[] agentTeamIds,
            bool[] agentIsGoalkeeper,
            bool[] knockdownOut,
            float[] knockdownForceOut,
            bool[] stumbleOut,
            ref BallState ball,
            ulong matchSeed,
            int frameNumber,
            float matchTime,
            ICollisionEventConsumer eventConsumer,
            out bool ballDeflected)
        {
            using var _ = s_updateMarker.Auto();
            ballDeflected = false;
'''
          replace_once(path, old, new)
          replace_once(path,
              '''                    bool collided = j == SpatialHashConstants.BALL_ENTITY_ID
                        ? ProcessAgentBall(agentTeamIds, agentIsGoalkeeper, i, ref ball, matchTime)
                        : ProcessAgentAgent(agentTeamIds, i, j, matchTime);
''',
              '''                    bool collided = j == SpatialHashConstants.BALL_ENTITY_ID
                        ? ProcessAgentBall(
                            agentTeamIds, agentIsGoalkeeper, i, ref ball, matchTime, ref ballDeflected)
                        : ProcessAgentAgent(agentTeamIds, i, j, matchTime);
''')
          replace_once(path,
              '''        private bool ProcessAgentBall(
            int[] teamIds,
            bool[] isGoalkeeper,
            int agentId,
            ref BallState ball,
            float matchTime)
''',
              '''        private bool ProcessAgentBall(
            int[] teamIds,
            bool[] isGoalkeeper,
            int agentId,
            ref BallState ball,
            float matchTime,
            ref bool ballDeflected)
''')
          replace_once(path,
              '''            BallCollisionHandler.OnAgentCollision(ref ball, in data);

            RecordEvent(matchTime, CollisionType.AGENT_BALL, agentId,
''',
              '''            // W4: preserve contact truth separately from response truth. A confirmed overlap
            // still counts toward the collision valve and emits its existing CollisionEvent, while only
            // an actually-applied Ball Physics deflection becomes a keeper new-threat signal.
            if (BallCollisionHandler.OnAgentCollision(ref ball, in data))
            {
                ballDeflected = true; // OR-reduce across every AGENT_BALL contact in this frame.
            }

            RecordEvent(matchTime, CollisionType.AGENT_BALL, agentId,
''')
          replace_once(path, '// Modified: 2026-07-27  [v1.8]\n',
              '// Modified: 2026-09-11  [v1.9] (W4: per-call applied-ball-deflection feedback; no CollisionEvent ABI change)\n')

          path = "src/goalkeeper-mechanics/GoalkeeperMechanics.cs"
          marker = '''        /// <summary>
        /// Notifies that a shot has been struck at the specified GK's goal, opening the §3.2 reaction
'''
          addition = '''        /// <summary>
        /// W4 new-threat seam: a real body deflection changed the live ball flight during Resolve.
        /// Unlike <see cref="OnThreatArmed"/>, this deliberately overwrites an already-live detection
        /// and required-reaction stamp because the keeper must react to the changed trajectory. Unlike
        /// <see cref="OnShotExecutedEvent"/>, it does NOT set <c>_shotEventPending</c>: a deflection is
        /// not a newly struck shot and must not enter the shot-specific early state transition.
        /// </summary>
        /// <param name="gkIndex">Keeper index (== team id; KD-1).</param>
        /// <param name="matchTimeMs">Match time (ms) at which the deflection was resolved.</param>
        /// <param name="ballSpeedMps">Post-deflection ball speed (m/s).</param>
        /// <param name="attrs">The threatened keeper's projected attributes.</param>
        public void OnThreatDeflected(
            int gkIndex, float matchTimeMs, float ballSpeedMps, GoalkeeperAgentAttributes attrs)
        {
            if ((uint)gkIndex >= (uint)GoalkeeperConstants.MaxGkAgents)
            {
                return;
            }

            _attrs[gkIndex] = attrs;
            _shotDetectedTickMs[gkIndex] =
                GoalkeeperReactionPipeline.ComputeShotDetectedTickMs(matchTimeMs, attrs);
            _requiredReactionMs[gkIndex] =
                GoalkeeperReactionPipeline.ComputeRequiredReactionMs(attrs, ballSpeedMps, _states[gkIndex]);
        }

'''
          replace_once(path, marker, addition + marker)
          replace_once(path,
              '// Modified: 2026-08-04 (W1 AR-2: RefreshGkAgentIds detects a CHANGE of keeper-slot occupant and calls GoalkeeperMechanics.ResetSlot — a substitute keeper was inheriting the dismissed keeper\'s locked RushIntent. No new state, no schema change. See docs/tracking/gk-rush-trigger-design.md v1.3)\n',
              '// Modified: 2026-08-04 (W1 AR-2: RefreshGkAgentIds detects a CHANGE of keeper-slot occupant and calls GoalkeeperMechanics.ResetSlot — a substitute keeper was inheriting the dismissed keeper\'s locked RushIntent. No new state, no schema change. See docs/tracking/gk-rush-trigger-design.md v1.3)\n// Modified: 2026-09-11 (W4: OnThreatDeflected overwrites the reaction stamp for a changed live flight without setting the shot-event pending latch; no new state/schema)\n')

          path = "src/goalkeeper-mechanics/Tests/GoalkeeperConversionTests.cs"
          marker = '''        [Test]
        public void ClearSaveIntent_ClearsDetectionStamp()
'''
          test = '''        [Test]
        public void OnThreatDeflected_OverwritesArmingStamp_WithoutShotPending()
        {
            GoalkeeperMechanics gk = NewGk();

            gk.OnThreatArmed(Gk0, 1000f, 20f, MidAttrs());
            float first = gk.CaptureState().ShotDetectedTickMs[Gk0];
            gk.OnThreatDeflected(Gk0, 1400f, 18f, MidAttrs());

            GoalkeeperTickState state = gk.CaptureState();
            float expected = GoalkeeperReactionPipeline.ComputeShotDetectedTickMs(1400f, MidAttrs());
            Assert.AreEqual(expected, state.ShotDetectedTickMs[Gk0], 1e-3f,
