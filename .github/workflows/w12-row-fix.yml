name: W12 history-row fix

on:
  push:
    branches:
      - docs/w12-evidence-repair

permissions:
  contents: write

jobs:
  fix-history-row:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/w12-evidence-repair
          fetch-depth: 1
      - name: Add missing author cell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/tracking/CHANGELOG-src.md')
          s = p.read_text(encoding='utf-8')
          old = '| 2.137 | 2026-09-14 | W12 evidence repair: exact retained Actions archives, corrected matched post-#398 census, mechanical evidence reconciliation, and normalized W6 preregistration; no production/schema/RNG/`[GT]` change. |'
          new = '| 2.137 | 2026-09-14 | — | W12 evidence repair: exact retained Actions archives, corrected matched post-#398 census, mechanical evidence reconciliation, and normalized W6 preregistration; no production/schema/RNG/`[GT]` change. |'
          if s.count(old) != 1:
              raise SystemExit(f'expected one v2.137 malformed row, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit exact row fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracking/CHANGELOG-src.md
          git commit -m 'docs(w12): fix v2.137 history row shape'
          git push origin HEAD:docs/w12-evidence-repair
