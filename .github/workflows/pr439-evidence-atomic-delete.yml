name: PR439 one-shot atomic evidence-ref deletion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr439-evidence-atomic-delete.yml'

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: pr439-atomic-evidence-delete
  cancel-in-progress: false

jobs:
  delete-and-certify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact live evidence refs
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/evidence/pr439-*:refs/remotes/origin/evidence/pr439-*'
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Require complete authorized pre-delete gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/dotnet-ci/check_pr439_evidence_refs.py \
            --repo . --mode all --main-ref refs/remotes/origin/main \
            --live-state pre-delete --require-authorized --verify-actions-api

      - name: Delete the complete 16-ref set in one leased atomic push
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import subprocess
          from pathlib import Path

          rows = list(csv.DictReader(Path(
              'docs/tracking/evidence/pr439-ref-archive/ref-disposition.tsv'
          ).open(encoding='utf-8', newline=''), delimiter='\t'))
          assert len(rows) == 16 and len({r['ref'] for r in rows}) == 16
          assert all(r['disposition'] == 'deletable' and r['delete_now'] == 'true' for r in rows)
          expected = {r['ref']: r['current_head'] for r in rows}
          output = subprocess.check_output(
              ['git', 'ls-remote', '--heads', 'origin', 'evidence/pr439-*'], text=True
          )
          actual = {ref.removeprefix('refs/heads/'): sha for sha, ref in
                    (line.split() for line in output.splitlines())}
          if actual != expected:
              raise SystemExit(f'ref set/head changed; refusing atomic deletion: {actual!r}')

          leases = [f'--force-with-lease=refs/heads/{ref}:{sha}'
                    for ref, sha in sorted(expected.items())]
          deletions = [f':refs/heads/{ref}' for ref in sorted(expected)]
          # Ref deletion transfers no LFS objects; skip any checkout-installed
          # pre-push hook so it cannot turn a local ref transaction into an
          # unrelated LFS API request.
          command = ['git', '-c', 'core.hooksPath=/dev/null', 'push',
                     '--atomic', *leases, 'origin', *deletions]
          subprocess.run([*command[:4], '--dry-run', *command[4:]], check=True)
          subprocess.run(command, check=True)
          remaining = subprocess.check_output(
              ['git', 'ls-remote', '--heads', 'origin', 'evidence/pr439-*'], text=True
          ).strip()
          if remaining:
              raise SystemExit(f'atomic push returned but evidence refs remain: {remaining}')
          print('Deleted exactly 16 PR439 evidence refs atomically at recorded heads.')
          PY

      - name: Certify zero-ref topology immediately
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/evidence/pr439-*:refs/remotes/origin/evidence/pr439-*'
          python3 tools/dotnet-ci/check_pr439_evidence_refs.py \
            --repo . --mode all --main-ref refs/remotes/origin/main \
            --live-state post-delete --require-authorized --verify-actions-api

      - name: Dispatch independent explicit post-delete gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          url = (f'https://api.github.com/repos/{repository}/actions/workflows/'
                 'pr439-evidence-ref-gate.yml/dispatches')
          request = urllib.request.Request(
              url,
              data=json.dumps({'ref': 'main', 'inputs': {'live_state': 'post-delete'}}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'pr439-evidence-atomic-delete',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'post-delete gate dispatch returned {response.status}')
          print('Explicit post-delete PR439 gate dispatched on main.')
          PY
