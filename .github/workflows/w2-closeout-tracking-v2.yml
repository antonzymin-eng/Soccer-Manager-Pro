name: Apply W2 closeout tracking reconciliation v2

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w2-closeout-tracking-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          fetch-depth: 1
      - name: Reconcile durable tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          backlog = Path('docs/tracking/match-engine-wiring-backlog.md')
          text = backlog.read_text(encoding='utf-8')
          new_top = (
              '> **UPDATED September 16, 2026 (v1.20):** W4, W5, W6, W7, and W12 are wired; four Class-A items remain: W3, W8, W9, W10. '
              'W2 remains built and shipping-disabled pending its separate activation change, but its post-W6 evidence obligation is now closed with an exact same-head/same-seed paired control. '
              'On production head `e4335f7f`, armed-at-`LooseBallPickupRadiusM` shares are `0.983/0.983` and `0.985/0.985` with gate/test exits `0/0`; the disarmed control is `0.530/0.530` and `0.979/0.979` with expected exits `1/1`. '
              'Run `35096793576` used measurement-driver head `682e7af9`; both exact artifact ZIPs, provenance, parameterized driver/workflow and SHA-256 manifests are archived under `docs/tracking/evidence/w2/`. '
              'The evidence supports removing the historical InPoss stall blocker at the intended current activation reach; it is not tackle-outcome calibration. The ten tackle-outcome `[GT]`s remain explicitly uncalibrated, foul/card calibration still follows activation, and W2 receives no T-DA-DET-005 credit. '
              'The W12 prerequisite-order deviation is recorded separately in `w12-preregistration-reconciliation.md`; the stricter 5 pp plus suppression-mass material-effect bar remains governing.\n'
          )
          text, n = re.subn(r'^> \*\*UPDATED[^\n]*\n', new_top, text, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit('backlog current-status line not found')
          pending = 'A same-head, same-seed disarmed control is being captured before the production activation change so the W6 baseline shift is measured rather than inferred.'
          closed = 'The required same-head/same-seed control is now complete in run `35096793576`: armed repeats `0.983/0.983` and `0.985/0.985` with `0/0` exits, while disarmed records `0.530/0.530` and `0.979/0.979` with expected `1/1` exits. The exact paired artifacts and their hashes are archived under `docs/tracking/evidence/w2/`.'
          if pending not in text:
              raise SystemExit('pending paired-control sentence not found')
          text = text.replace(pending, closed, 1)
          stale = "site anywhere in `src/`** — the tackle draw is keyed, not reserved, un-blocking #14's own T-DA-DET-005 —\nand the `match-flow.card-severity` draw order **MOVES by design**"
          corrected = "site anywhere in `src/`** — the tackle draw is keyed, not reserved. **Correction (September 16): this does NOT satisfy or unblock T-DA-DET-005**; that deferred #14 test requires `DefensiveAITick`'s own `DeterministicRngService` path, whereas W2 derives its keyed draw in `MatchEngine`. The\n`match-flow.card-severity` draw order **MOVES by design**"
          if stale not in text:
              raise SystemExit('stale T-DA-DET-005 claim not found')
          backlog.write_text(text.replace(stale, corrected, 1), encoding='utf-8')

          changelog = Path('docs/tracking/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          current_pat = r'(?m)^> \*\*Last Updated:\*\*'
          if len(re.findall(current_pat, text)) != 1:
              raise SystemExit('unexpected current CHANGELOG record count')
          text = re.sub(current_pat, '> **Last Updated (prior):**', text, count=1)
          entry = (
              '> **Last Updated:** September 16, 2026 — **W2 post-W6 paired-control closeout is durable and activation may proceed as a separate change.** '
              'Actions run `35096793576` measured exact production head `e4335f7ff059deb483b1aaa534f2190fd3762008` from measurement-driver head `682e7af9ed8cf5eed64d78defe7358e9e7bd81a6`, using the same two governed seeds and the same reporting/assertion transform in both matrix legs. Armed at current `LooseBallPickupRadiusM` (1.0 m), the seeds read **0.983 / 0.983** and **0.985 / 0.985**, with gate/test exits **0 / 0**. Disarmed, they read **0.530 / 0.530** and **0.979 / 0.979**, with expected exits **1 / 1**; the corrected harness validates that negative control rather than incorrectly demanding armed acceptance from it. Exact ZIPs are checked into `docs/tracking/evidence/w2/` with archive SHA-256 digests `5772b980…dcb00` and `3b6dcd10…5e9e9`; both include the parameterized driver/workflow and internal SHA-256 manifests. This closes the pre-activation evidence obligation only: production `TackleContactRadiusM` is still 0, the durable activation lock is `> 0` and `<= LooseBallPickupRadiusM` rather than a permanent literal 1.0 m ceiling, the ten tackle-outcome `[GT]`s remain explicitly uncalibrated, and foul/card calibration still follows activation. **T-DA-DET-005 remains inactive and receives no W2 credit** because its deferred test requires `DefensiveAITick`\'s own `DeterministicRngService` path. The earlier W12 procedure-order deviation is already recorded pre-interpretation in `w12-preregistration-reconciliation.md`; no historical preregistration was rewritten.\n>\n'
          )
          text = text.replace('---\n\n', '---\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          manifest = Path('docs/tracking/file-manifest.md')
          text = manifest.read_text(encoding='utf-8')
          current_pat = r'(?m)^\*\*Last Updated:\*\*'
          matches = list(re.finditer(current_pat, text))
          if len(matches) != 1:
              raise SystemExit(f'unexpected current manifest record count: {len(matches)}')
          text = re.sub(current_pat, '**Last Updated (prior):**', text, count=1)
          entry = (
              '**Last Updated:** September 16, 2026 — **W2 post-W6 paired evidence closeout; documentation/evidence only.**\n'
              '**Added durable evidence (4):** `docs/tracking/evidence/w2/README.md`, `artifact-SHA256SUMS`, and the exact armed/disarmed ZIPs from Actions run `35096793576`. Each ZIP contains provenance, measurement-only patch, gate/instrument output, exit status, TRX, the parameterized driver/workflow, and an internal SHA-256 manifest. **Modified tracking:** `docs/tracking/match-engine-wiring-backlog.md` v1.18 → v1.20, `docs/tracking/CHANGELOG.md`, and this manifest; `docs/tracking/w12-preregistration-reconciliation.md` remains the already-landed record of the prerequisite-order deviation. **Removed temporary measurement scaffolding:** five W2/W6 evidence workflows plus their four apply/trace scripts after their exact driver/workflow copies were preserved inside the archives; the one-shot archive workflow was also removed. No production/source, spec, assembly edge, snapshot/save schema, RNG behavior, or `[GT]` value changed. Production W2 remains disabled pending the separate activation change; the ten tackle-outcome `[GT]`s remain uncalibrated and T-DA-DET-005 remains inactive.\n\n'
          )
          prior_pat = re.compile(r'(?m)^\*\*Last Updated \(prior\):\*\*')
          m = prior_pat.search(text)
          if not m:
              raise SystemExit('first prior manifest record not found after relabel')
          text = text[:m.start()] + entry + text[m.start():]
          manifest.write_text(text, encoding='utf-8')
          PY
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/match-engine-wiring-backlog.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git diff --check
          git commit -m "Close W2 post-W6 evidence tracking"
          git push origin HEAD:wiring/w2-post-w6-closeout
