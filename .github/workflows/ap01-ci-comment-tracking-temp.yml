name: Temporary AP-01 CI comment tracking

'on':
  push:
    branches:
      - tmp/ap01-ci-comment-tracking

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ap01-ci-comment-tracking
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: art/ap-01-repository-contract
          path: work
      - name: Patch AP-01 tracking
        run: python3 helper/tools/ap01-ci-comment-tracking-temp.py
      - name: Commit and push tracking update
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git commit -m "Synchronize AP-01 CI description tracking"
          git push origin HEAD:art/ap-01-repository-contract
