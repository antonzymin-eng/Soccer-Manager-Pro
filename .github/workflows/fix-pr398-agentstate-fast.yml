name: Finalize PR398 W5 repair

on:
  push:
    branches: [wiring/w5-w7-press-kickoff]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w5-w7-press-kickoff
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fix import, remove duplicate history row, and run focused W5 gate
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          test = Path('src/match-engine/tests/MatchEngineEventsTests.cs')
          t = test.read_text(encoding='utf-8')
          anchor = 'using TacticalDirector.DecisionTree;\n'
          if 'using TacticalDirector.AgentMovement;' not in t:
              if anchor not in t:
                  raise SystemExit('MatchEngineEventsTests using anchor missing')
              t = t.replace(anchor, 'using TacticalDirector.AgentMovement;\n' + anchor, 1)
          test.write_text(t, encoding='utf-8')

          engine = Path('src/match-engine/MatchEngine.cs')
          e = engine.read_text(encoding='utf-8')
          duplicate = '// | 1.74     | 2026-09-11 | —      | ERR-013-011: FillPressingSnapshot writes the 60 Hz [N-AI_PHASE_STRIDE,N) pass window separately from the 10 Hz tactical heartbeat. |\n'
          if duplicate in e:
              e = e.replace(duplicate, '', 1)
          engine.write_text(e, encoding='utf-8')

          Path('.github/workflows/fix-pr398-agentstate-fast.yml').unlink()
          PY

          git diff --check
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~PassAttemptEvent_FromCompletedPhysicsWindow_ReachesPressingDebounce'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete W5 clock-domain remediation [skip ci]"
          git push origin HEAD:wiring/w5-w7-press-kickoff
