name: Temporary art G0 acceptance helper

'on':
  push:
    branches:
      - tmp/art-g0-accept-helper-work

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/art-g0-accept-helper-work
          path: helper
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: art/art-pipeline-foundation
          path: work
          fetch-depth: 0
      - name: Update art branch from current main
        working-directory: work
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Record G0 acceptance
        run: python3 helper/tools/art-g0-accept-temp.py work
      - name: Commit and push art acceptance
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/art-pipeline-foundation.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git commit -m "Record art pipeline G0 acceptance"
          git push origin HEAD:art/art-pipeline-foundation
