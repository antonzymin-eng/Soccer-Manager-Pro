name: Temporary D5 manifest patch

on:
  push:
    branches: [codex/d5-transfers-t0]

permissions:
  contents: write

jobs:
  patch-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d5-transfers-t0
          fetch-depth: 0
      - name: Patch authoritative manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/tracking/file-manifest.md')
          s = p.read_text(encoding='utf-8')

          old_head = '**Last Updated:** September 12, 2026 — **Unity-editor compile fixes; Unity recorded as the governing compiler.**'
          new_head = '''**Last Updated:** September 14, 2026 — **D5 / Transfers, Contracts & Negotiation #31 T0 implemented in PR #407; review corrections applied; final CI evidence pending.**\n**New production assembly:** `TacticalDirector.Transfers` (`src/transfers/transfers.asmdef`) plus `transfers-tests.asmdef`. T0 now provides deterministic integer valuation, always-on #27 positional scarcity, synchronous Accepted/CounterOffered/Rejected negotiation, atomic fee-only `SubmitBid`, transfer-window state and the consumer-owned roster read/preflight/commit port. Two football-judgment findings deferred by C6 are discharged in code+spec+tests. **No save/snapshot schema change, RNG stream, domain tag, draw site or draw-order change.** T1 save composition, T2 season/roster production wiring and T3 deep negotiation remain deferred.\n\n**Last Updated (prior):** September 12, 2026 — **Unity-editor compile fixes; Unity recorded as the governing compiler.**'''
          if old_head not in s:
              raise SystemExit('manifest head anchor missing')
          s = s.replace(old_head, new_head, 1)

          old_row = '| 31 | `docs/specs/transfers-contracts-negotiation/` | APPROVED (Jul 23, 2026) — no assembly |'
          new_row = '| 31 | `docs/specs/transfers-contracts-negotiation/` | APPROVED (Jul 23, 2026) — T0 implemented at `src/transfers/` in PR #407; T1 save, T2 production season/roster wiring, T3 deep tier deferred |'
          if old_row not in s:
              raise SystemExit('spec #31 manifest row anchor missing')
          s = s.replace(old_row, new_row, 1)

          old_ptr = '`docs/specs/code-standards/section-3.md` **v1.0.1 → v1.1**, since advanced to **v1.13**'
          if old_ptr not in s:
              raise SystemExit('code-standards maintained pointer anchor missing')
          s = s.replace(old_ptr, '`docs/specs/code-standards/section-3.md` **v1.0.1 → v1.1**, since advanced to **v1.14**')

          marker = '### Club Finances (`src/club-finances/`)'
          if marker not in s:
              raise SystemExit('club-finances inventory anchor missing')
          if '### Transfers / Contracts / Negotiation (`src/transfers/`)' not in s:
              block = '''### Transfers / Contracts / Negotiation (`src/transfers/`)\n\n#31 T0 is hosted here. All listed Unity-managed source/assembly files have companion `.meta` files; T1/T2/T3 remain deferred by #31 §7.\n\n| Path | Role |\n|---|---|\n| `src/transfers/transfers.asmdef` | Production `TacticalDirector.Transfers` assembly; Tier 7 Management; references #27 PlayerDatabase, #40 ClubFinances and ProjectConstants only. |\n| `src/transfers/Contract.cs` | Durable managed-club contract value; fail-loud wage/length validation. |\n| `src/transfers/Offer.cs` | Immutable transfer terms + shared fail-loud validation for every consuming seam. |\n| `src/transfers/NegotiationOutcome.cs` | Accepted / CounterOffered / Rejected closed outcome set. |\n| `src/transfers/TransferWindow.cs` | Inclusive open/close transfer-window value/predicate. |\n| `src/transfers/ClubTransferState.cs` | Season-scoped active window + committed-spend accumulator. |\n| `src/transfers/PlayerValuation.cs` | Integer attributes+age identity plus always-on coarse positional-scarcity multiplier. |\n| `src/transfers/NegotiationEngine.cs` | Draw-free synchronous negotiation with configured counter-offer band. |\n| `src/transfers/TransfersState.cs` | Managed-contract store, spend/window state and #31-owned re-key handling. |\n| `src/transfers/ITransferRosterPort.cs` | Consumer-owned read/position-stock/preflight/commit seam for the #30 T2 producer. |\n| `src/transfers/TransferCommands.cs` | Atomic manager `SubmitBid`; #40 fee posting + #30 roster-port coordination. |\n| `src/transfers/TransfersConstants.cs` | `[FIXED]` identities + `GameplayConfig`-loaded `[GT]` catalogue. |\n| `src/transfers/tests/transfers-tests.asmdef` | NUnit test assembly for #31 T0. |\n| `src/transfers/tests/TransfersT0Tests.cs` | Valuation, positional need, negotiation band, malformed-term, atomicity, budget, re-key, window and integer-state locks. |\n\n---\n\n'''
              s = s.replace(marker, block + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/tracking/file-manifest.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Manifest already patched.'
            exit 0
          fi
          git commit -m 'Sync #31 T0 file manifest'
          git push origin HEAD:codex/d5-transfers-t0
