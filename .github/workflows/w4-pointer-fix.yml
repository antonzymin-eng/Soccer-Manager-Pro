name: W4 Maintained Pointer Sync

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-pointer-fix-marker

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
      - name: Sync W4 maintained pointers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_count(path, old, new, expected):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected} matches for {old!r}, found {n}')
              p.write_text(s.replace(old, new))

          replace_count('docs/tracking/open-issues.md', 'now v1.14', 'now v1.15', 3)
          replace_count('docs/tracking/CHANGELOG.md', '*(since v1.14)*', '*(since v1.15)*', 2)
          replace_count('docs/tracking/file-manifest.md', 'since advanced to **v1.14**, whose L11 row', 'since advanced to **v1.15**, whose L11 row', 1)
          replace_count('docs/tracking/file-manifest.md', '**AUDIT** (**v1.14, Sep 10, 2026**)', '**AUDIT / EXECUTION TRACKER** (**v1.15, Sep 11, 2026**)', 1)

          # Keep the W4 close-out inventory accurate now that the consistency-driven pointer sync
          # necessarily touches open-issues.md as a fifth tracking file.
          replace_count(
              'docs/tracking/file-manifest.md',
              '**Modified tracking (4):** `docs/tracking/match-engine-wiring-backlog.md` v1.14 → v1.15, `docs/tracking/CHANGELOG-src.md` v2.133 → v2.134, `docs/tracking/CHANGELOG.md`, and this manifest.',
              '**Modified tracking (5):** `docs/tracking/match-engine-wiring-backlog.md` v1.14 → v1.15, `docs/tracking/CHANGELOG-src.md` v2.133 → v2.134, `docs/tracking/CHANGELOG.md`, `docs/tracking/open-issues.md` (maintained backlog pointers v1.14 → v1.15), and this manifest.',
              1)

          # The inventory row is a current pointer. Make explicit that v1.15 is not claiming the
          # original audit's dormant count is still the current execution status.
          replace_count(
              'docs/tracking/file-manifest.md',
              'and proposes the wire-order → calibrate-once sequence |',
              'and proposes the wire-order → calibrate-once sequence. **Current v1.15 status:** W1, W2 and W4 are wired; W12 is next in the recorded sequence. |',
              1)
          PY
      - name: Commit pointer sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/open-issues.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git diff --cached --check
          git commit -m "docs: sync W4 backlog maintained pointers"
          git push origin HEAD:codex/w4-keeper-perception-final
