name: PR363 close-out

on:
  push:
    branches:
      - codex/d4-club-finances-t0

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d4-club-finances-t0
          fetch-depth: 0

      - name: Apply close-out synchronization
        run: |
          sed -i 's/old_row = "| v2.127 |"/old_row = "| 2.127 |"/' .github/scripts/pr363_closeout.py
          python3 .github/scripts/pr363_closeout.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/tracking/file-manifest.md")
          text = path.read_text()
          old = "**POINTER INDEX** (v1.2, Aug 22, 2026)"
          new = "**POINTER INDEX** (v1.3, Sep 6, 2026)"
          if text.count(old) != 1:
              raise SystemExit(f"data-contract manifest pointer: expected one {old!r}")
          text = text.replace(old, new, 1)
          tail_old = "the `DeterminismContext` mapping row now reads SPLIT, not SPLIT + GAP |"
          tail_new = "the `DeterminismContext` mapping row now reads SPLIT, not SPLIT + GAP. **v1.3:** #40 finance state/transaction entities and the `FNCE` format pointer are registered, and #40 is removed from the no-assembly table |"
          if text.count(tail_old) != 1:
              raise SystemExit("data-contract manifest row tail not found exactly once")
          path.write_text(text.replace(tail_old, tail_new, 1))
          PY

      - name: Verify documentation and tooling
        run: |
          python3 tools/doc-consistency-check.py --repo .
          python3 tools/assembly-tier-check.py --repo .
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          git diff --check

      - name: Commit and push close-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close out PR #363 review findings"
          git push origin HEAD:codex/d4-club-finances-t0
