name: PR363 close-out synchronization

on:
  push:
    branches:
      - codex/d4-club-finances-t0

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d4-club-finances-t0
          fetch-depth: 0

      - name: Synchronize landing records and source headers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # --- file-manifest: current head record, implementation status, maintained pointer, inventory.
          manifest_path = Path("docs/tracking/file-manifest.md")
          manifest = manifest_path.read_text()
          if "#40 Club Finances T0 + T1a implemented" not in manifest:
              first = "**Last Updated:** September 6, 2026 — **AP-01 art repository/meta contract implemented and mutation-proven; no production GameArt tree or asset landed.**"
              prior = "**Last Updated (prior):** September 6, 2026 — **AP-01 art repository/meta contract implemented and mutation-proven; no production GameArt tree or asset landed.**"
              entry = (
                  "**Last Updated:** September 6, 2026 — **#40 Club Finances T0 + T1a implemented; PR #363 external-review corrections and tracking close-out.**\n"
                  "New production assembly `src/club-finances/` (`TacticalDirector.ClubFinances`) delivers deterministic integer-only finance state, season settlement, ledger/query seams, and the standalone self-identifying `FNCE` persistence codec. The final T0/T1a dependency boundary is `DeterministicSim` + cross-cutting `ProjectConstants`; the unused `PlayerDatabase` edge is deferred to T2 with its first `Squad.ClubId` consumer. #40 §7 now names T1a (standalone codec) separately from T1b (#30 `SeasonSaveCodec` composition/version bump). External-review regression locks cover the exact asmdef boundary, no-RNG serialized shape, both budget clamps, decode ordering, and short/truncated framing. T1b/T2/T3 remain deferred. Branch was merged with current `main` before close-out; the Linux MatchEngine red is inherited from `main` and is not rebaselined by #40.\n"
              )
              manifest = replace_once(manifest, first, entry + prior, "manifest head")

          old40 = "| 40 | `docs/specs/club-finances-economy/` | APPROVED (Jul 23, 2026) — no assembly |"
          new40 = "| 40 | `docs/specs/club-finances-economy/` | APPROVED (Jul 23, 2026) — implemented at `src/club-finances/` (T0 + standalone T1a; T1b/T2/T3 deferred) |"
          if old40 in manifest:
              manifest = replace_once(manifest, old40, new40, "manifest #40 status")

          pointer = re.compile(r"(`docs/specs/code-standards/section-3\.md`[^\n]{0,180}?since advanced to \*\*)v1\.12(\*\*)")
          pointer_matches = list(pointer.finditer(manifest))
          if pointer_matches:
              manifest = pointer.sub(r"\g<1>v1.13\g<2>", manifest)

          inventory_marker = "### Club Finances (`src/club-finances/`)"
          if inventory_marker not in manifest:
              tracked = subprocess.check_output(
                  ["git", "ls-files", "src/club-finances"], text=True
              ).splitlines()
              if not tracked:
                  raise SystemExit("club-finances inventory: git ls-files returned no files")
              inventory = [
                  "",
                  inventory_marker,
                  "",
                  "#40 T0 + standalone T1a. T1b/T2/T3 remain deferred by #40 §7.",
                  "",
                  "| Path | Role |",
                  "|---|---|",
              ]
              for path in tracked:
                  role = "Unity metadata sidecar" if path.endswith(".meta") else "#40 T0/T1a source, assembly, or test surface"
                  inventory.append(f"| `{path}` | {role} |")
              inventory.append("")
              block = "\n".join(inventory)
              maintenance = re.search(r"\n##\s+Maintenance", manifest, re.I)
              if maintenance:
                  manifest = manifest[:maintenance.start()] + block + manifest[maintenance.start():]
              else:
                  manifest = manifest.rstrip() + "\n" + block + "\n"

          manifest_path.write_text(manifest)

          # --- open issues: preserve the September-3 count as history; do not falsify 019def1.
          open_path = Path("docs/tracking/open-issues.md")
          open_text = open_path.read_text()
          if "Historical September 3, 2026 measurement" not in open_text:
              old = "Re-derived today at `019def1`: **35 production assemblies**"
              new = "**Historical September 3, 2026 measurement:** re-derived at `019def1`: **35 production assemblies**"
              if old not in open_text:
                  raise SystemExit("open-issues historical 35-assembly anchor not found")
              open_text = open_text.replace(old, new, 1)
          open_path.write_text(open_text)

          # --- roadmap: mark D4 as partially landed and append a version row.
          roadmap_path = Path("docs/tracking/path-to-playable-roadmap.md")
          roadmap = roadmap_path.read_text()
          old_d4 = "| **D4** | **#40 minimal** — budget-from-league-finish at #30's (b') boundary point. | #40 §7 |"
          new_d4 = "| **D4** ◑ | **#40 minimal — T0 + standalone T1a LANDED September 6, 2026 (PR #363).** `src/club-finances/` now owns deterministic integer-only finance state, budget-from-finish settlement, ledger/query seams, and the self-identifying `FNCE` codec. External review split the already-landed codec into T1a and kept #30 composition as **T1b**, removed the dead `PlayerDatabase` edge until its T2 `Squad.ClubId` consumer, and added boundary/RNG/clamp/corrupt-save locks. **REMAINDER:** T1b compose into #30 + outer format bump; T2 bootstrap/(b') wiring + first #27 consumer; T3 deep economics/stochastic draw. | #40 §7 |"
          if old_d4 in roadmap:
              roadmap = roadmap.replace(old_d4, new_d4, 1)
          if "| v0.24 | September 6, 2026 | **D4 #40 T0 + T1a landing.**" not in roadmap:
              row = "| v0.24 | September 6, 2026 | **D4 #40 T0 + T1a landing.** Records the implemented finance core and standalone codec, the T1a/T1b phase correction, and the remaining T1b/T2/T3 work; no later D-item is pulled forward. |\n"
              marker = "|---------|------|--------|\n"
              roadmap = replace_once(roadmap, marker, marker + row, "roadmap version table")
          roadmap_path.write_text(roadmap)

          # --- top-level landing history.
          changelog_path = Path("docs/tracking/CHANGELOG.md")
          changelog = changelog_path.read_text()
          if "#40 Club Finances T0 + T1a landed on PR #363" not in changelog:
              newest = "> **Last Updated:** September 6, 2026 — **AP-01 art repository/meta contract implemented and mutation-proven; no production art landed.**"
              prior = "> **Last Updated (prior):** September 6, 2026 — **AP-01 art repository/meta contract implemented and mutation-proven; no production art landed.**"
              entry = (
                  "> **Last Updated:** September 6, 2026 — **#40 Club Finances T0 + T1a landed on PR #363; external-review correction cycle closed.**\n"
                  "> New `TacticalDirector.ClubFinances` provides the deterministic integer-only finance state, `SettleFinances` / prize calculation, cash-vs-wage-liability transaction handling, read-only finance view, and standalone magic-led `FNCE` save codec. The approved worked example remains 1,715,790 prize / 786,316 transfer budget / 307,368 wage budget.\n"
                  "> Claude's external review found that the branch had already crossed from T0 into persistence while the spec/PR still denied T1 work. #40 §7 therefore defines the real boundary as **T1a standalone codec** and **T1b #30 composition + outer format bump**. The unused `PlayerDatabase` asmdef edge is removed until T2's first real `Squad.ClubId` consumer. Added executable locks cover exact current references, absence of an RNG cursor/action ordinal, upper/lower budget clamps, decode ordering, and short/truncated framing. The `GameplayConfig.GetInt` Int32 tuning ceiling for long finance fields is documented rather than hidden.\n"
                  "> Branch was reconciled with current `main` before close-out. Spec-hygiene/tracking surfaces are synchronized in this landing. The Linux `MatchEngine.Tests` red is inherited from `main`; #40 neither touches the match tick nor rebaselines that owner-held band. **Deferred exactly:** T1b, T2 season/bootstrap wiring, T3 deep/stochastic economics.\n>\n"
              )
              changelog = replace_once(changelog, newest, entry + prior, "CHANGELOG head")
          changelog_path.write_text(changelog)

          # --- src landing history: source changed, compact src/CLAUDE itself stays pointer-only and unmodified.
          src_log_path = Path("docs/tracking/CHANGELOG-src.md")
          src_log = src_log_path.read_text()
          if "v2.128 — **#40 Club Finances T0 + T1a" not in src_log:
              newest = "> **Last Updated:** September 4, 2026 (v2.127 —"
              if newest not in src_log:
                  raise SystemExit("CHANGELOG-src newest anchor not found")
              src_log = src_log.replace(newest, "> **Last Updated (prior):** September 4, 2026 (v2.127 —", 1)
              header_anchor = "## Header chain\n\n"
              entry = (
                  "> **Last Updated:** September 6, 2026 (v2.128 — **#40 Club Finances T0 + T1a implemented and externally reviewed.** New `src/club-finances/` production/test assemblies provide deterministic integer-only finance state, settlement, ledger/query seams, and the standalone `FNCE` codec. Review corrections formalize T1a/T1b, remove the unused PlayerDatabase dependency until T2, and add boundary/RNG/clamp/corrupt-save locks. All #40 source headers use the automated-agent author placeholder. T1b/T2/T3 remain deferred; the inherited MatchEngine red is not rebaselined. Full account: `docs/tracking/CHANGELOG.md` and #40 §7.)\n>\n"
              src_log = replace_once(src_log, header_anchor, header_anchor + entry, "CHANGELOG-src header")
              old_row = "| v2.127 |"
              if old_row not in src_log:
                  raise SystemExit("CHANGELOG-src v2.127 version row not found")
              new_row = "| v2.128 | September 6, 2026 | #40 Club Finances T0 + T1a: new production/test assembly, standalone FNCE codec, external-review dependency/phase/test corrections; T1b/T2/T3 deferred. |\n"
              src_log = src_log.replace(old_row, new_row + old_row, 1)
          src_log_path.write_text(src_log)

          # --- source header attribution: automated agent is not the human owner. Add an append-only row for the correction.
          for path in sorted(Path("src/club-finances").rglob("*.cs")):
              text = path.read_text()
              if "Codex / Anton" not in text.split("namespace", 1)[0]:
                  continue
              original = text
              text = re.sub(r"(?m)^// Modified:\s+\d{4}-\d{2}-\d{2}\s*$", "// Modified: 2026-09-06", text, count=1)
              text = re.sub(r"(?m)^// Author:\s+Codex / Anton\s*$", "// Author:   —", text, count=1)
              history = text.rfind("#region VersionHistory")
              end = text.find("#endregion", history)
              if history < 0 or end < 0:
                  raise SystemExit(f"{path}: version history block missing")
              block = text[history:end]
              versions = [(int(a), int(b)) for a, b in re.findall(r"(?m)^//\s*(\d+)\.(\d+)\s+\|", block)]
              if not versions:
                  raise SystemExit(f"{path}: no parseable version rows")
              major, minor = versions[-1]
              row = f"// {major}.{minor + 1}     | 2026-09-06 | —             | Header author attribution corrected to automated-agent placeholder.\n"
              text = text[:end] + row + text[end:]
              if text == original:
                  raise SystemExit(f"{path}: expected header correction did not change content")
              path.write_text(text)

          # The temporary workflow must not become repository infrastructure.
          Path(".github/workflows/pr363-closeout.yml").unlink()
          PY

      - name: Run documentation/tooling checks
        shell: bash
        run: |
          python3 tools/doc-consistency-check.py --repo .
          python3 tools/assembly-tier-check.py --repo .
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          git diff --check

      - name: Commit synchronized close-out
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close out PR #363 review findings"
          git push origin HEAD:codex/d4-club-finances-t0
