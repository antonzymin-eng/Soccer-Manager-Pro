name: PR363 close-out

on:
  push:
    branches:
      - codex/d4-club-finances-t0

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d4-club-finances-t0
          fetch-depth: 0

      - name: Apply close-out synchronization
        run: |
          sed -i 's/old_row = "| v2.127 |"/old_row = "| 2.127 |"/' .github/scripts/pr363_closeout.py
          python3 .github/scripts/pr363_closeout.py

      - name: Verify documentation and tooling
        run: |
          python3 tools/doc-consistency-check.py --repo .
          python3 tools/assembly-tier-check.py --repo .
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          git diff --check

      - name: Commit and push close-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close out PR #363 review findings"
          git push origin HEAD:codex/d4-club-finances-t0
