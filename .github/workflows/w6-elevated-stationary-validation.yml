name: Validate W6 elevated-stationary fix

on:
  push:
    branches:
      - fix/w6-elevated-stationary-ball
    paths:
      - .github/workflows/w6-elevated-stationary-validation.yml

permissions:
  contents: read

jobs:
  ball-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/w6-elevated-stationary-ball
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Focused Ball Physics gate
        run: bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~BallControlStateTests|FullyQualifiedName~BallStateMachineTests'

  inposs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [armed, disarmed]
    steps:
      - name: Checkout fix head
        uses: actions/checkout@v4
        with:
          ref: fix/w6-elevated-stationary-ball
          path: repo
          fetch-depth: 1
      - name: Checkout paired evidence driver
        uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          path: driver
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply per-seed evidence transform
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          OUT="repo/artifacts/w6-fix-${MODE}"
          mkdir -p "${OUT}/trx"
          python3 driver/tools/w2_post_w6_inposs_apply.py repo "${MODE}"
          git -C repo diff -- src/match-engine/tests/MatchEngineInPossGateScenarios.cs > "${OUT}/measurement-only.patch"
          git -C repo rev-parse HEAD > "${OUT}/fix-head.txt"
      - name: Run strict two-seed InPoss evidence
        working-directory: repo
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -uo pipefail
          OUT="artifacts/w6-fix-${MODE}"
          LABEL="W2_POST_W6_${MODE^^}_INPOSS"
          set +e
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~sim_match_engine_inposs_gate' 2>&1 | tee "${OUT}/gate.txt"
          gate_rc=${PIPESTATUS[0]}
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj --no-build --no-restore --filter 'FullyQualifiedName~sim_match_engine_inposs_gate' --logger 'console;verbosity=detailed' --logger "trx;LogFileName=w6-fix-${MODE}.trx" --results-directory "${OUT}/trx" 2>&1 | tee "${OUT}/instrument-output.txt"
          test_rc=${PIPESTATUS[0]}
          set -e
          grep -F "${LABEL} seed=0x0F1E2D3C4B5A6978" "${OUT}/instrument-output.txt"
          grep -F "${LABEL} seed=0x1A2B3C4D5E6F7081" "${OUT}/instrument-output.txt"
          printf 'gate_rc=%s\ntest_rc=%s\n' "$gate_rc" "$test_rc" > "${OUT}/exit-status.txt"
          cd "${OUT}"
          sha256sum fix-head.txt measurement-only.patch gate.txt instrument-output.txt exit-status.txt "trx/w6-fix-${MODE}.trx" > SHA256SUMS
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-fix-${{ matrix.mode }}-${{ github.run_id }}
          path: repo/artifacts/w6-fix-${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce result
        if: always()
        working-directory: repo
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          source <(sed 's/^/export /' "artifacts/w6-fix-${MODE}/exit-status.txt")
          test "$gate_rc" -eq 0
          test "$test_rc" -eq 0
