name: Temporary AP-02 font amendment

'on':
  push:
    branches:
      - tmp/ap02-font-amendment

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ap02-font-amendment
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: art/ap-02-touchline-art-direction
          path: work
          fetch-depth: 0
      - name: Apply AP-02 font amendment
        run: python3 helper/tools/ap02-font-amendment-temp.py
      - name: Commit and push
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/art/art-direction-v1.md docs/design/ui-mockups/README.md docs/design/ui-mockups/assets/tokens.css "docs/design/ui-mockups/System XI - Design System.html"
          git commit -m "Propose Cyrillic-capable display font for AP-02"
          git push origin HEAD:art/ap-02-touchline-art-direction
