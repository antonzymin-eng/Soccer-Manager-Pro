name: W6 closure evidence
on:
  push:
    branches: [wiring/w6-controlled-ball]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify W6 controlled-ball regression locks
        shell: bash
        run: |
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~MatchEngineControlledBallW6Tests'
      - name: Remeasure owner-held close-chance scenario
        shell: bash
        run: |
          set +e
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'Name=sim_match_engine_close_chance' > /tmp/w6-close-chance.log 2>&1
          status=$?
          set -e
          echo "close_chance_exit=$status"
          echo '--- close-chance diagnostic tail ---'
          grep -B5 -A40 'Error Message:' /tmp/w6-close-chance.log || tail -n 200 /tmp/w6-close-chance.log
          exit 0
