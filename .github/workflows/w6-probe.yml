name: W6 keeper carry repair
on:
  push:
    branches: [wiring/w6-controlled-ball]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Land keeper-held goal-plane correction at W6 attachment seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/match-engine/MatchEngine.cs')
          text = path.read_text()

          header = '// Modified: 2026-09-15 (W6 review closure — Controlled goalkeeper carriers are constrained at their defended goal plane in the MatchEngine attachment funnel; no schema/RNG change)\n'
          if header not in text:
              created = '// Created:  2026-06-16\n'
              if text.count(created) != 1:
                  raise SystemExit('header anchor count != 1')
              text = text.replace(created, created + header, 1)

          old = '''            Vector2 holderPos = _agents[holder].Position;
            float z = _isGoalkeeper[holder]
                ? Mathf.Max(_ball.Position.z, MatchEngineConstants.BALL_REST_HEIGHT_M)
                : MatchEngineConstants.BALL_REST_HEIGHT_M;

            _ball.Position = new Vector3(holderPos.x, holderPos.y, z);
            _ball.Velocity = Vector3.zero;
            _ball.AngularVelocity = Vector3.zero;
            BallPhysicsCore.ValidatePhysicsState(ref _ball);
            _ball.LastValidPosition = _ball.Position;
            _ball.LastValidVelocity = Vector3.zero;
'''
          new = '''            AgentState carrier = _agents[holder];

            // W6 review closure: Agent Movement deliberately permits a small exterior safety buffer,
            // but a goalkeeper physically controlling the ball may not carry that attached ball through
            // the goal plane he defends. Enforce the composition invariant at the sole Controlled-ball
            // attachment funnel so every acquisition path is covered before Resolve adjudicates a goal.
            if (_isGoalkeeper[holder])
            {
                int teamId = _teamIds[holder];
                float ownGoalX = teamId == 0 ? 0.0f : MatchEngineConstants.PITCH_LENGTH_M;
                bool behindOwnGoalLine = teamId == 0
                    ? carrier.Position.x < ownGoalX
                    : carrier.Position.x > ownGoalX;

                if (behindOwnGoalLine)
                {
                    carrier.Position = new Vector2(ownGoalX, carrier.Position.y);

                    bool movingFurtherOut = teamId == 0
                        ? carrier.Velocity.x < 0.0f
                        : carrier.Velocity.x > 0.0f;
                    if (movingFurtherOut)
                    {
                        carrier.Velocity = new Vector2(0.0f, carrier.Velocity.y);
                    }

                    // Keep Agent Movement's recovery checkpoint coherent with this host-owned correction;
                    // otherwise a later safety recovery could restore the illegal pre-clamp position.
                    carrier.Speed = carrier.Velocity.magnitude;
                    carrier.LastValidPosition = carrier.Position;
                    carrier.LastValidVelocity = carrier.Velocity;
                    _agents[holder] = carrier;
                }
            }

            Vector2 holderPos = carrier.Position;
            float z = _isGoalkeeper[holder]
                ? Mathf.Max(_ball.Position.z, MatchEngineConstants.BALL_REST_HEIGHT_M)
                : MatchEngineConstants.BALL_REST_HEIGHT_M;

            _ball.Position = new Vector3(holderPos.x, holderPos.y, z);
            _ball.Velocity = Vector3.zero;
            _ball.AngularVelocity = Vector3.zero;
            BallPhysicsCore.ValidatePhysicsState(ref _ball);
            _ball.LastValidPosition = _ball.Position;
            _ball.LastValidVelocity = Vector3.zero;
'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('attachment seam anchor count != 1')
              text = text.replace(old, new, 1)
          elif 'AgentState carrier = _agents[holder];' not in text or 'bool behindOwnGoalLine = teamId == 0' not in text:
              raise SystemExit('attachment seam is neither original nor already repaired')

          version_anchor = '// | 1.78    | 2026-09-14 | —      | W6 review P2: tackle cooldown ages before the physical-carrier gate, so loose/restart |\n'
          version = (
              '// | 1.79    | 2026-09-15 | —      | W6 review closure: the Controlled attachment funnel constrains goalkeeper carriers |\n'
              '// |         |            |        | at their defended goal plane before ball attachment / Resolve; no schema/RNG change. |\n'
          )
          if '// | 1.79    | 2026-09-15' not in text:
              if text.count(version_anchor) != 1:
                  raise SystemExit('version anchor count != 1')
              text = text.replace(version_anchor, version + version_anchor, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/match-engine/MatchEngine.cs
          if ! git diff --quiet -- src/match-engine/MatchEngine.cs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/match-engine/MatchEngine.cs
            git commit -m 'fix(match-engine): constrain controlled keeper at own goal plane'
            git push origin HEAD:wiring/w6-controlled-ball
          fi
      - name: Verify exact keeper-claim scenario
        shell: bash
        run: |
          set +e
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'Name=sim_match_engine_keeper_claim' > /tmp/w6-keeper-claim.log 2>&1
          status=$?
          set -e
          echo '--- keeper-claim diagnostic tail ---'
          grep -B5 -A40 'Error Message:' /tmp/w6-keeper-claim.log || tail -n 200 /tmp/w6-keeper-claim.log
          exit "$status"
