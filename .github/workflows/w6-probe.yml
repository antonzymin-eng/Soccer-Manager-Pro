name: W6 keeper carry repair
on:
  push:
    branches: [wiring/w6-controlled-ball]
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply keeper-held goal-plane correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/goalkeeper-mechanics/GoalkeeperMechanics.cs')
          text = path.read_text()

          header = '// Modified: 2026-09-15 (W6 review closure: HandsOnBall keeper locomotion is constrained at the defended goal plane before Controlled attachment; no schema/RNG/GT change)\n'
          if header not in text:
              created = '// Created:  2026-05-28\n'
              if created not in text:
                  raise SystemExit('header anchor missing')
              text = text.replace(created, created + header, 1)

          state_anchor = '''                // ── Reset dive launch frame when no longer in dive states ─────────────
                GoalkeeperState newState = _states[gkIndex];
                if (newState != GoalkeeperState.Diving && newState != GoalkeeperState.Airborne)
'''
          state_replacement = '''                // ── Reset dive launch frame when no longer in dive states ─────────────
                GoalkeeperState newState = _states[gkIndex];

                // W6 review closure: generic Agent Movement intentionally permits a 5 m exterior
                // safety buffer, but a keeper physically holding the ball must not carry the attached
                // Controlled ball through the goal plane he defends. Apply this AFTER the physics
                // transition so the same frame that resolves Airborne/Smothered -> HandsOnBall is
                // corrected before MatchEngine re-attaches the ball and before Resolve adjudicates a goal.
                if (newState == GoalkeeperState.HandsOnBall)
                {
                    AgentState heldState = agentStates[agentId];
                    ConstrainHandsOnBallToOwnGoalPlane(ref heldState, gkIndex);
                    agentStates[agentId] = heldState;
                    agentState = heldState;
                }

                if (newState != GoalkeeperState.Diving && newState != GoalkeeperState.Airborne)
'''
          if 'ConstrainHandsOnBallToOwnGoalPlane(ref heldState, gkIndex);' not in text:
              if state_anchor not in text:
                  raise SystemExit('state-transition anchor missing')
              text = text.replace(state_anchor, state_replacement, 1)

          helper_anchor = '''        // Lateral dive axis is Y (touchline-to-touchline): the goal mouth spans Y, so the keeper
'''
          helper = '''        /// <summary>
        /// Constrains only a keeper whose resolved physics state is HandsOnBall to the goal plane he
        /// defends. The general Agent Movement exterior buffer remains unchanged; loose/kicked-ball
        /// goal adjudication remains unchanged. Keeper index is team id (KD-1): 0 defends x=0, 1 x=L.
        /// </summary>
        private static void ConstrainHandsOnBallToOwnGoalPlane(ref AgentState agentState, int gkIndex)
        {
            float ownGoalX = gkIndex == 0 ? 0.0f : GoalkeeperConstants.PitchLengthM;
            bool behindOwnGoalLine = gkIndex == 0
                ? agentState.Position.x < ownGoalX
                : agentState.Position.x > ownGoalX;

            if (!behindOwnGoalLine)
            {
                return;
            }

            agentState.Position = new Vector2(ownGoalX, agentState.Position.y);

            bool movingFurtherOut = gkIndex == 0
                ? agentState.Velocity.x < 0.0f
                : agentState.Velocity.x > 0.0f;
            if (movingFurtherOut)
            {
                agentState.Velocity = new Vector2(0.0f, agentState.Velocity.y);
            }

            agentState.Speed = agentState.Velocity.magnitude;
            agentState.LastValidPosition = agentState.Position;
            agentState.LastValidVelocity = agentState.Velocity;
        }

'''
          if 'private static void ConstrainHandsOnBallToOwnGoalPlane' not in text:
              if helper_anchor not in text:
                  raise SystemExit('helper anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          version_anchor = '// | 1.14 | 2026-09-12 | — | W4 review closure: caller contract now states OnThreatArmed anchors a      |\n'
          version = '''// | 1.15 | 2026-09-15 | — | W6 review closure: after each 60 Hz physics transition, HandsOnBall keepers |
// |      |            |   | are constrained at the defended goal plane before MatchEngine attaches the  |
// |      |            |   | Controlled ball. General movement buffer / goal adjudication unchanged; no   |
// |      |            |   | new state, tuning, schema or RNG surface.                                    |
'''
          if '// | 1.15 | 2026-09-15' not in text:
              if version_anchor not in text:
                  raise SystemExit('version-history anchor missing')
              text = text.replace(version_anchor, version + version_anchor, 1)

          path.write_text(text)
          PY
      - name: Verify exact keeper-claim scenario
        run: bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'Name=sim_match_engine_keeper_claim'
      - name: Commit verified repair and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/w6-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/goalkeeper-mechanics/GoalkeeperMechanics.cs
          git commit -m 'fix(w6): constrain held keeper at own goal plane'
          git push origin HEAD:wiring/w6-controlled-ball
