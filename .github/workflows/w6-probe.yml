name: W6 keeper carry repair
on:
  push:
    branches: [wiring/w6-controlled-ball]
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply keeper-held goal-plane correction in workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/goalkeeper-mechanics/GoalkeeperMechanics.cs')
          text = path.read_text()

          header = '// Modified: 2026-09-15 (W6 review closure: HandsOnBall keeper locomotion is constrained at the defended goal plane before Controlled attachment; no schema/RNG/GT change)\n'
          if header not in text:
              created = '// Created:  2026-05-28\n'
              if text.count(created) != 1:
                  raise SystemExit('header anchor count != 1')
              text = text.replace(created, created + header, 1)

          new_state_line = '                GoalkeeperState newState = _states[gkIndex];\n'
          insertion = (
              new_state_line +
              '\n'
              '                // W6 review closure: generic Agent Movement intentionally permits a 5 m exterior\n'
              '                // safety buffer, but a keeper physically holding the ball must not carry the attached\n'
              '                // Controlled ball through the goal plane he defends. Apply this AFTER the physics\n'
              '                // transition so the same frame that resolves Airborne/Smothered -> HandsOnBall is\n'
              '                // corrected before MatchEngine re-attaches the ball and before Resolve adjudicates a goal.\n'
              '                if (newState == GoalkeeperState.HandsOnBall)\n'
              '                {\n'
              '                    AgentState heldState = agentStates[agentId];\n'
              '                    ConstrainHandsOnBallToOwnGoalPlane(ref heldState, gkIndex);\n'
              '                    agentStates[agentId] = heldState;\n'
              '                    agentState = heldState;\n'
              '                }\n'
          )
          if 'ConstrainHandsOnBallToOwnGoalPlane(ref heldState, gkIndex);' not in text:
              if text.count(new_state_line) != 1:
                  raise SystemExit('newState anchor count != 1')
              text = text.replace(new_state_line, insertion, 1)

          helper_anchor = '        // Lateral dive axis is Y (touchline-to-touchline): the goal mouth spans Y, so the keeper\n'
          helper = (
              '        /// <summary>\n'
              '        /// Constrains only a keeper whose resolved physics state is HandsOnBall to the goal plane he\n'
              '        /// defends. The general Agent Movement exterior buffer remains unchanged; loose/kicked-ball\n'
              '        /// goal adjudication remains unchanged. Keeper index is team id (KD-1): 0 defends x=0, 1 x=L.\n'
              '        /// </summary>\n'
              '        private static void ConstrainHandsOnBallToOwnGoalPlane(ref AgentState agentState, int gkIndex)\n'
              '        {\n'
              '            float ownGoalX = gkIndex == 0 ? 0.0f : GoalkeeperConstants.PitchLengthM;\n'
              '            bool behindOwnGoalLine = gkIndex == 0\n'
              '                ? agentState.Position.x < ownGoalX\n'
              '                : agentState.Position.x > ownGoalX;\n\n'
              '            if (!behindOwnGoalLine)\n'
              '            {\n'
              '                return;\n'
              '            }\n\n'
              '            agentState.Position = new Vector2(ownGoalX, agentState.Position.y);\n\n'
              '            bool movingFurtherOut = gkIndex == 0\n'
              '                ? agentState.Velocity.x < 0.0f\n'
              '                : agentState.Velocity.x > 0.0f;\n'
              '            if (movingFurtherOut)\n'
              '            {\n'
              '                agentState.Velocity = new Vector2(0.0f, agentState.Velocity.y);\n'
              '            }\n\n'
              '            agentState.Speed = agentState.Velocity.magnitude;\n'
              '            agentState.LastValidPosition = agentState.Position;\n'
              '            agentState.LastValidVelocity = agentState.Velocity;\n'
              '        }\n\n'
          )
          if 'private static void ConstrainHandsOnBallToOwnGoalPlane' not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit('helper anchor count != 1')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          version_anchor = '// | 1.14 | 2026-09-12 | — | W4 review closure: caller contract now states OnThreatArmed anchors a      |\n'
          version = (
              '// | 1.15 | 2026-09-15 | — | W6 review closure: after each 60 Hz physics transition, HandsOnBall keepers |\n'
              '// |      |            |   | are constrained at the defended goal plane before MatchEngine attaches the  |\n'
              '// |      |            |   | Controlled ball. General movement buffer / goal adjudication unchanged; no   |\n'
              '// |      |            |   | new state, tuning, schema or RNG surface.                                    |\n'
          )
          if '// | 1.15 | 2026-09-15' not in text:
              if text.count(version_anchor) != 1:
                  raise SystemExit('version anchor count != 1')
              text = text.replace(version_anchor, version + version_anchor, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/goalkeeper-mechanics/GoalkeeperMechanics.cs
      - name: Verify exact keeper-claim scenario
        run: bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'Name=sim_match_engine_keeper_claim'
