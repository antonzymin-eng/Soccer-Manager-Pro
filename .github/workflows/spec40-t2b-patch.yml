name: Spec 40 T2b patch

on:
  push:
    branches:
      - openai/spec-40-finance-t2b-runtime

permissions:
  contents: write

jobs:
  apply-season-loop-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/spec-40-finance-t2b-runtime
          fetch-depth: 0
      - name: Apply guarded SeasonLoop patch
        run: python3 tools/spec40_t2b_patch.py
      - name: Validate SeasonLoop patch
        run: git diff --check -- src/season-save/SeasonLoop.cs
      - name: Commit SeasonLoop patch through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "openai/spec-40-finance-t2b-runtime"
          path = "src/season-save/SeasonLoop.cs"
          api = f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req) as response:
              current = json.load(response)

          content = open(path, "rb").read()
          payload = json.dumps({
              "message": "feat(finance): wire Spec 40 T2b into season loop",
              "content": base64.b64encode(content).decode("ascii"),
              "sha": current["sha"],
              "branch": branch,
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{path}",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          print(result["commit"]["sha"])
          PY
