name: W4 One-Shot Patch Trigger

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
          fetch-depth: 0
      - name: Execute staged patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/w4-apply-patch.yml').read_text()
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit applied patch"
          start = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'w4-staged-patch', 'exec'), {})
          PY
      - name: Commit consumer wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "feat: complete W4 keeper perception consumers"
          git push origin HEAD:codex/w4-keeper-perception-final
