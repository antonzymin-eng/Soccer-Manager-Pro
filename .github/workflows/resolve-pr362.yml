name: Resolve PR 362 merge

on:
  push:
    branches:
      - design/ux-foundation
    paths:
      - .github/workflows/resolve-pr362.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: design/ux-foundation
          fetch-depth: 0

      - name: Merge current main and resolve tracking collisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          expected=(
            "docs/agent-guides/project-reference.md"
            "docs/tracking/CHANGELOG.md"
            "docs/tracking/file-manifest.md"
            "docs/tracking/open-issues.md"
          )

          for f in "${conflicts[@]}"; do
            ok=0
            for e in "${expected[@]}"; do
              if [[ "$f" == "$e" ]]; then ok=1; break; fi
            done
            if [[ $ok -ne 1 ]]; then
              echo "Unexpected merge conflict: $f" >&2
              exit 1
            fi
          done

          resolve_union() {
            local f="$1"
            git show ":3:$f" > /tmp/theirs
            git show ":1:$f" > /tmp/base
            git show ":2:$f" > /tmp/ours
            git merge-file -p --union /tmp/theirs /tmp/base /tmp/ours > "$f"
            git add "$f"
          }

          for f in "${conflicts[@]}"; do
            resolve_union "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Prepend-chain invariant: exactly one bare Last Updated label.
          for path, pattern, replacement in [
              (Path("docs/tracking/CHANGELOG.md"), re.compile(r"^> \*\*Last Updated:\*\*"), "> **Last Updated (prior):**"),
              (Path("docs/tracking/file-manifest.md"), re.compile(r"^\*\*Last Updated:\*\*"), "**Last Updated (prior):**"),
          ]:
              lines = path.read_text().splitlines()
              seen = False
              out = []
              for line in lines:
                  if pattern.match(line):
                      if seen:
                          line = pattern.sub(replacement, line, count=1)
                      else:
                          seen = True
                  out.append(line)
              path.write_text("\n".join(out) + "\n")

          open_path = Path("docs/tracking/open-issues.md")
          archive_path = Path("docs/tracking/open-issues-resolved.md")
          active = sum(1 for line in open_path.read_text().splitlines() if line.startswith("- **"))
          archived = sum(1 for line in archive_path.read_text().splitlines() if line.startswith("- **"))

          ref = Path("docs/agent-guides/project-reference.md")
          lines = ref.read_text().splitlines()
          claim = re.compile(r"^\*\*(\d+) active\*\* / \*\*(\d+) archived\*\*\.")
          found = []
          for i, line in enumerate(lines):
              if claim.match(line):
                  found.append(i)
          if not found:
              raise SystemExit("project-reference active/archive claim not found")

          first = found[0]
          line = claim.sub(f"**{active} active** / **{archived} archived**.", lines[first], count=1)
          note = (
              f" *(September 8, 2026 — PR #362 was merged with current `main`; the UX and audio "
              f"live records now coexist. Counts re-derived on the merged tree: **{active} active / "
              f"{archived} archived**.)*"
          )
          if "PR #362 was merged with current `main`" not in line:
              line += note
          lines[first] = line
          for i in reversed(found[1:]):
              del lines[i]
          ref.write_text("\n".join(lines) + "\n")
          print(f"Merged active/archive counts: {active}/{archived}")
          PY

          git add docs/agent-guides/project-reference.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md docs/tracking/open-issues.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git diff --check
          python3 tools/doc-consistency-check.py
          python3 tools/recurring-defect-lint.py --repo .
          if [[ -f tools/check_drift.sh ]]; then
            bash tools/check_drift.sh
          elif [[ -f tools/agent-guides/check_drift.sh ]]; then
            bash tools/agent-guides/check_drift.sh
          fi

          # One-shot helper: remove itself from the resulting merge tree.
          git rm .github/workflows/resolve-pr362.yml
          git add -A
          git commit -m "Merge main into UX branch and resolve PR 362 check base"
          git push origin HEAD:design/ux-foundation
