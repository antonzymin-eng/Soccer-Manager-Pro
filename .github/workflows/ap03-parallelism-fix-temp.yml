name: Temporary AP-03 parallelism fix

'on':
  push:
    branches:
      - tmp/ap03-parallelism-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ap03-parallelism-fix
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: art/ap-03-technical-recipe-proof
          path: work
          fetch-depth: 0
      - name: Apply AP-03 sequencing correction
        run: python3 helper/tools/ap03-parallelism-fix-temp.py
      - name: Commit and push
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/art/art-technical-recipe-v1.md
          git commit -m "Keep AP-03 G2 independent from G1"
          git push origin HEAD:art/ap-03-technical-recipe-proof
