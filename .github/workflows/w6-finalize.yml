name: W6 Finalize

on:
  push:
    branches:
      - wiring/w6-controlled-ball
    paths:
      - .github/w6-finalize-marker

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
      - name: Apply W6 closeout edits
        run: |
          python3 .github/w6-finalize-fix.py
          python3 .github/w6-finalize.py
      - name: Remove temporary W6 tooling and commit
        shell: bash
        run: |
          git rm -f \
            .github/w6-controlled-ball-marker \
            .github/w6-controlled-ball-patch.py \
            .github/w6-controlled-ball-patch-fix.py \
            .github/workflows/w6-controlled-ball-patch.yml \
            .github/w6-controlled-ball-validation-marker \
            .github/workflows/w6-controlled-ball-validation.yml \
            .github/w6-controlled-ball-smoke-marker \
            .github/workflows/w6-controlled-ball-smoke.yml \
            .github/w6-finalize.py \
            .github/w6-finalize-fix.py \
            .github/workflows/w6-finalize.yml \
            .github/w6-finalize-marker
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close W6 controlled-ball wiring"
          git push origin HEAD:wiring/w6-controlled-ball
