name: Dispatch canonical W6 measurement

on:
  push:
    branches:
      - tmp/w6-measure-dispatch-20260914

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical W12 measurement on W6 head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/payload.json
          import json
          print(json.dumps({
              "ref": "wiring/w6-controlled-ball",
              "inputs": {
                  "instrument": "w12-gate-firing",
                  "reason": "Post-W6 canonical P-W6-2 measurement after W12 repair and PR #412 tackle-cooldown P2 closure"
              }
          }))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/measure.yml/dispatches" \
            --data-binary @/tmp/payload.json
