name: Temporary AP-01 tracking closeout

'on':
  push:
    branches:
      - tmp/ap01-tracking-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ap01-tracking-closeout
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: art/ap-01-repository-contract
          path: work
          fetch-depth: 0
      - name: Patch tracking
        run: python3 helper/tools/ap01-tracking-closeout-temp.py
      - name: Commit and push tracking closeout
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git commit -m "Close out AP-01 tracking"
          git push origin HEAD:art/ap-01-repository-contract
