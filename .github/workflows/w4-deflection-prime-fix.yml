name: W4 Deflection Fixture Prime

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-deflection-prime-marker

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
      - name: Prime the match clock before isolated Resolve
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/match-engine/tests/MatchEngineKeeperPerceptionW4Tests.cs')
          s = p.read_text()
          old = '''            var engine = new MatchEngine(MatchSeed ^ (ulong)(0x500 + keeperTeam));
            engine.EnableGkHeading();
            int keeper = FindKeeper(engine, keeperTeam);
'''
          new = '''            var engine = new MatchEngine(MatchSeed ^ (ulong)(0x500 + keeperTeam));
            engine.EnableGkHeading();
            // TestOnly_RunResolvePhase bypasses the normal tick-clock advance. Prime one ordinary
            // tick so frame 0 cannot alias any default ContactFrame sentinel in inactive shot results.
            // The staged collision below is applied only after this priming tick.
            engine.RunTick();
            int keeper = FindKeeper(engine, keeperTeam);
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one deflection fixture constructor block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/match-engine/tests/MatchEngineKeeperPerceptionW4Tests.cs
          git diff --cached --check
          git commit -m "test: prime W4 isolated Resolve fixture past frame zero"
          git push origin HEAD:codex/w4-keeper-perception-final
