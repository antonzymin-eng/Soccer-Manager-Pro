name: W8 possession helper equivalence

# One-shot proof driver. It changes only this workflow on the trigger branch and
# checks out the exact helper commit under test.
on:
  push:
    branches:
      - measure/w8-possession-helper-equivalence

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact helper candidate
        uses: actions/checkout@v4
        with:
          ref: 29c671f5c46358c16aab352f79f63db1943cbbb6

      - name: Verify measured code identity
        run: |
          test "$(git rev-parse HEAD)" = "29c671f5c46358c16aab352f79f63db1943cbbb6"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve W8 Stage A instrument
        env:
          INSTRUMENT: w8-stage-a
        run: |
          set -euo pipefail
          python3 tools/dotnet-ci/measurement_catalog.py validate --repo .
          python3 tools/dotnet-ci/measurement_catalog.py resolve \
            "$INSTRUMENT" --repo . --github-env "$GITHUB_ENV"

      - name: Build, guard writer inventory, and prove restore continuity
        run: |
          set -euo pipefail
          env -u "$MEASUREMENT_ENV" bash tools/dotnet-ci/run-gate.sh \
            --test-filter "$MEASUREMENT_FILTER"

          dotnet test "$MEASUREMENT_PROJECT" \
            --no-build --no-restore \
            --filter "FullyQualifiedName~PossessionChangeSeamTests|FullyQualifiedName~MatchEngineSnapshotRestoreTests" \
            --logger "console;verbosity=normal"

      - name: Run frozen six-seed instrument and compare exact digests
        run: |
          set -euo pipefail
          mkdir -p artifacts/measurements/trx
          OUT="artifacts/measurements/measurement.txt"
          MEASURE_OUT="artifacts/measurements/instrument-output.txt"
          RESULTS="artifacts/measurements/trx"
          RUNSETTINGS="artifacts/measurements/measurement.runsettings"
          cat > "$RUNSETTINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <TreatNoTestsAsError>true</TreatNoTestsAsError>
            </RunConfiguration>
          </RunSettings>
          XML
          {
            echo "# W8 possession helper exact-equivalence proof"
            echo "# measured source commit: $(git rev-parse HEAD)"
            echo "# workflow driver commit: $GITHUB_SHA"
            echo "# run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "# instrument: $MEASUREMENT_INSTRUMENT"
          } > "$OUT"

          env "$MEASUREMENT_ENV=1" dotnet test "$MEASUREMENT_PROJECT" \
            --no-build --no-restore --filter "$MEASUREMENT_FILTER" \
            --settings "$RUNSETTINGS" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=measurement.trx" \
            --results-directory "$RESULTS" 2>&1 | tee "$MEASURE_OUT" | tee -a "$OUT"

          python3 tools/dotnet-ci/measurement_catalog.py verify-run \
            "$MEASUREMENT_INSTRUMENT" --trx-dir "$RESULTS" --output "$MEASURE_OUT" | tee -a "$OUT"

          python3 - "$MEASURE_OUT" <<'PY' | tee -a "$OUT"
          import re
          import sys

          expected = {
              "0x0F1E2D3C4B5A6978": "6a0ef38092a424332483b0124d13429c9134c58eefdb421e7f4bbdee509cafc3",
              "0x00000000D1A6D05E": "c47c5d8fc993dfb0fd29164e33bc7770b4ee74857c1875c58f421f7ceec30d3e",
              "0x0000000000000001": "7f13a1adafac5b692c1757922f92d72eb12dc86137cfff7eb5ee415af358fe29",
              "0x00000000ABCDEF12": "0767c1fa25b77bd36168564944cae973b1a0c41899b9d84601203b57ad6dacb6",
              "0x0000000099887766": "802fa9a2d27319cd6c423730109604786c66b626f44e39f71ba9599574525008",
              "0x000000005A5A5A5A": "62d7ce6b7b0f1e9edd61271bdf6c899f3f1b2d5f8a4e9f1f0f2310fba5920088",
          }
          pattern = re.compile(r"seedEnd,(0x[0-9A-F]{16}),tick=324000,digest=([0-9a-f]{64})")
          seen = {}
          with open(sys.argv[1], encoding="utf-8") as handle:
              for line in handle:
                  match = pattern.search(line)
                  if match:
                      seed, digest = match.groups()
                      prior = seen.get(seed)
                      if prior is not None and prior != digest:
                          raise SystemExit(f"conflicting terminal digests for {seed}: {prior} vs {digest}")
                      seen[seed] = digest

          missing = sorted(set(expected) - set(seen))
          extra = sorted(set(seen) - set(expected))
          mismatched = {
              seed: (expected[seed], seen[seed])
              for seed in expected.keys() & seen.keys()
              if expected[seed] != seen[seed]
          }
          if missing or extra or mismatched:
              raise SystemExit(
                  f"frozen digest mismatch: missing={missing} extra={extra} mismatched={mismatched}"
              )
          print("FROZEN W8 DIGEST EQUALITY: PASS (6/6 exact)")
          PY

      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8-possession-helper-equivalence-${{ github.run_id }}
          path: artifacts/measurements/
          if-no-files-found: warn
          retention-days: 90
