name: W8 possession helper equivalence

# One-shot proof driver. It changes only this workflow on the trigger branch and
# checks out the exact helper commit under test.
on:
  push:
    branches:
      - measure/w8-possession-helper-equivalence

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact helper candidate
        uses: actions/checkout@v4
        with:
          ref: 29c671f5c46358c16aab352f79f63db1943cbbb6

      - name: Verify measured code identity
        run: |
          test "$(git rev-parse HEAD)" = "29c671f5c46358c16aab352f79f63db1943cbbb6"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve W8 Stage A instrument
        env:
          INSTRUMENT: w8-stage-a
        run: |
          set -euo pipefail
          python3 tools/dotnet-ci/measurement_catalog.py validate --repo .
          python3 tools/dotnet-ci/measurement_catalog.py resolve             "$INSTRUMENT" --repo . --github-env "$GITHUB_ENV"

      - name: Build gate and run frozen six-seed instrument
        run: |
          set -euo pipefail
          mkdir -p artifacts/measurements/trx
          OUT="artifacts/measurements/measurement.txt"
          MEASURE_OUT="artifacts/measurements/instrument-output.txt"
          RESULTS="artifacts/measurements/trx"
          RUNSETTINGS="artifacts/measurements/measurement.runsettings"
          cat > "$RUNSETTINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <TreatNoTestsAsError>true</TreatNoTestsAsError>
            </RunConfiguration>
          </RunSettings>
          XML
          {
            echo "# W8 possession helper exact-equivalence proof"
            echo "# measured source commit: $(git rev-parse HEAD)"
            echo "# workflow driver commit: $GITHUB_SHA"
            echo "# run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "# instrument: $MEASUREMENT_INSTRUMENT"
          } > "$OUT"
          env -u "$MEASUREMENT_ENV" bash tools/dotnet-ci/run-gate.sh             --test-filter "$MEASUREMENT_FILTER" 2>&1 | tee -a "$OUT"
          echo "=== Proved measurement ===" | tee -a "$OUT"
          env "$MEASUREMENT_ENV=1" dotnet test "$MEASUREMENT_PROJECT"             --no-build --no-restore --filter "$MEASUREMENT_FILTER"             --settings "$RUNSETTINGS"             --logger "console;verbosity=detailed"             --logger "trx;LogFileName=measurement.trx"             --results-directory "$RESULTS" 2>&1 | tee "$MEASURE_OUT" | tee -a "$OUT"
          python3 tools/dotnet-ci/measurement_catalog.py verify-run             "$MEASUREMENT_INSTRUMENT" --trx-dir "$RESULTS" --output "$MEASURE_OUT" | tee -a "$OUT"

      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8-possession-helper-equivalence-${{ github.run_id }}
          path: artifacts/measurements/
          if-no-files-found: warn
          retention-days: 90
