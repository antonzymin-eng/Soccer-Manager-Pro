name: W6 tackle cooldown P2 fix

on:
  push:
    branches:
      - wiring/w6-controlled-ball

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply narrow P2 patch
        run: python3 tools/w6_p2_apply.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Run W6 composed regression fixture
        run: bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~MatchEngineControlledBallW6Tests'
      - name: Commit tested P2 fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/match-engine/MatchEngine.cs src/match-engine/tests/MatchEngineControlledBallW6Tests.cs
          git commit -m 'fix(match-engine): keep tackle cooldown aging while ball is loose'
          git push origin HEAD:wiring/w6-controlled-ball
