name: Localization L1 final closeout launcher v4

on:
  push:
    branches:
      - localization/l1-core-contracts
    paths:
      - .github/workflows/localization-l1-final-closeout-launcher-v4.yml

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract patch pointers and execute closeout script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          wf = Path('.github/workflows/localization-l1-final-closeout.yml')
          lines = wf.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Merge current main, close L1, verify, and commit')
          run_idx = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          script_lines = []
          for line in lines[run_idx + 1:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip() == '':
                  script_lines.append('')
              else:
                  raise SystemExit(f'Unexpected YAML after closeout run block: {line!r}')
          script = '\n'.join(script_lines) + '\n'

          entry_text = '> `TacticalDirector.Localization` becomes the 37th production assembly, dependency-free and seated in Code Standards #20 Tier 9. L1 freezes `ILocalizer.Resolve(LocalizationKey)` / `Render(in LocalizedTextRequest)` plus immutable key, locale, template-id, named-slot, typed selector, and request values. Structural tests lock the declared empty asmdef reference list, L1 reverse-reference tripwire, authored public type shape, no sim/RNG/persistence state, exact `ulong` selection draw, defensive-copy immutability and deterministic identity/hash. Follow-up review restores frozen §2/§7 history, states that lower-case `LocaleId.Value` is an internal identity rather than BCP-47 canonical form, records the L3B tripwire narrowing rule, scopes reflection away from compiler/coverage generated types, and restores the source newline. `ERR-049-002` and `ERR-049-004` are RESOLVED in `spec-error-log.md` v2.57; `ERR-049-003` remains OPEN for L3B/T1 and `ERR-049-005` remains OPEN for L2. Audio D49 is narrowed accordingly: L1 exists, captions still require L2 rendering/catalogue plus an approved #49/#51 boundary. No save/snapshot schema, RNG stream/domain/draw site/order, `[GT]`, or simulation wiring changed. **GATE:** the pre-closeout implementation head `3cb999e` was 11/11 green including the Linux functional gate; that evidence is historical only, and current-head CI remains authoritative for merge.'
          replacement_lines = [
              'changelog = "docs/tracking/CHANGELOG.md"',
              'p = Path(changelog)',
              'current = p.read_text(encoding="utf-8")',
              'marker = "\\n---\\n\\n> **Last Updated:**"',
              'if current.count(marker) != 1:',
              '    raise SystemExit(f"{changelog}: expected one live-chain marker, found {current.count(marker)}")',
              'entry = "\\n---\\n\\n> **Last Updated:** September 12, 2026 — **Localization #49 L1 authoritative core landing / PR #397 close-out.**\\n>\\n' + entry_text.replace('"', '\\"') + '\\n\\n> **Last Updated (prior):**"',
              'p.write_text(current.replace(marker, entry, 1), encoding="utf-8")',
              '',
              'csrc = "docs/tracking/CHANGELOG-src.md"',
          ]
          replacement = '\n'.join(replacement_lines)
          pattern = re.compile(r'changelog = "docs/tracking/CHANGELOG\.md"\n.*?\n\ncsrc = "docs/tracking/CHANGELOG-src\.md"', re.S)
          script, n = pattern.subn(lambda _: replacement, script, count=1)
          if n != 1:
              raise SystemExit(f'closeout script: expected one changelog block, found {n}')

          anchor = '\n\nopen_issues = "docs/tracking/open-issues.md"'
          pointer_patch = '\n'.join([
              '',
              '# Disambiguate adjacent file versions and advance the two maintained historical pointers.',
              'replace_once(manifest, "`path-to-playable-roadmap.md`; audio implementation plan v1.7", "`path-to-playable-roadmap.md` v0.27; audio implementation plan v1.7")',
              'p = Path(manifest)',
              'current = p.read_text(encoding="utf-8")',
              'old_pointer = "since advanced to **v2.56**"',
              'if current.count(old_pointer) != 2:',
              '    raise SystemExit(f"{manifest}: expected two maintained v2.56 pointers, found {current.count(old_pointer)}")',
              'p.write_text(current.replace(old_pointer, "since advanced to **v2.57**"), encoding="utf-8")',
          ])
          if script.count(anchor) != 1:
              raise SystemExit('closeout script: open-issues anchor missing/duplicated')
          script = script.replace(anchor, pointer_patch + anchor, 1)

          old_rm = '  .github/workflows/localization-l1-final-closeout.yml'
          rm_lines = [
              old_rm + ' \\',
              '  .github/workflows/localization-l1-final-closeout-launcher.yml \\',
              '  .github/workflows/localization-l1-final-closeout-launcher-v2.yml \\',
              '  .github/workflows/localization-l1-final-closeout-launcher-v3.yml \\',
              '  .github/workflows/localization-l1-final-closeout-launcher-v4.yml',
          ]
          if script.count(old_rm) != 1:
              raise SystemExit('closeout script: final-workflow rm anchor missing/duplicated')
          script = script.replace(old_rm, '\n'.join(rm_lines), 1)
          Path('/tmp/localization-l1-closeout.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/localization-l1-closeout.sh
