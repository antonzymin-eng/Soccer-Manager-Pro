name: W4 Tracking Recovery

on:
  push:
    branches:
      - docs/w4-tracking-recovery
    paths:
      - .github/w4-tracking-recovery-marker

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/w4-tracking-recovery
          fetch-depth: 0

      - name: Restore W4 tracking state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{label}: expected one exact match, found {n}")
              return text.replace(old, new, 1)

          def replace_count(text, old, new, expected, label):
              n = text.count(old)
              if n != expected:
                  raise RuntimeError(f"{label}: expected {expected} exact matches, found {n}")
              return text.replace(old, new)

          def regex_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {n}")
              return out

          # ------------------------------------------------------------------
          # match-engine-wiring-backlog.md — restore the W4 landed state.
          # ------------------------------------------------------------------
          path = "docs/tracking/match-engine-wiring-backlog.md"
          text = read(path)
          text = replace_once(
              text,
              "### W4 — The keeper is never unsighted",
              "### W4 — The keeper is never unsighted — ✅ **WIRED September 11, 2026 (PR #403)**",
              "W4 heading")
          text = regex_once(
              text,
              r"3\. \*\*The two call sites must not drift\.\*\*.*?(?=\n4\. \*\*Friendly screens are absent upstream\.\*\*)",
              "3. **Raw threat geometry stays shared; visibility deliberately does not.** The W1 safety invariant is\n"
              "   narrower than v1.14 stated: both consumers must agree on whether the ball is a raw goal-bound\n"
              "   save threat, so `GkHeadingIntentSource.SaveArmed` remains the shared geometry and the rush veto.\n"
              "   Only the Decision Tree's `SAVE` availability adds keeper visibility through\n"
              "   `KeeperPerceptionGate.SaveAvailable`. Applying LOS to the rush exclusion would be a regression:\n"
              "   an unsighted keeper would become eligible to charge at a goal-bound ball. The final W4 design\n"
              "   therefore shares the raw predicate and intentionally splits only at the perception layer.\n",
              "W4 constraint 3",
              flags=re.S)
          text = regex_once(
              text,
              r"\*\*Consequence \(unchanged, now split into its two missing mechanisms\):\*\*.*?(?=\n### W5)",
              "**Resolved September 11, 2026.** PR #399 landed the pure all-body LOS primitive and the explicit\n"
              "applied-deflection signal. PR #403 consumes them: `RunMechanicsAI` sets DT `SaveAvailable` through\n"
              "`KeeperPerceptionGate.SaveAvailable` against the live current-frame body set; the independent W1\n"
              "rush veto remains raw `SaveArmed`; `CollisionSystem.UpdateCollisions` OR-reduces only actual\n"
              "`BallCollisionHandler` flight changes into a transient per-call result; and `RunResolvePhase`\n"
              "consumes that result immediately, evaluates the **post-deflection** flight, and calls the dedicated\n"
              "`GoalkeeperMechanics.OnThreatDeflected` only for the newly threatened keeper. That method overwrites\n"
              "the detection / required-reaction stamp without setting `_shotEventPending`, so a deflection is a\n"
              "changed threat rather than a fake new shot. No pending deflection latch, `CollisionEvent` ABI change,\n"
              "snapshot-schema bump, RNG stream, or draw-order change. Canonical Perception sent-off asymmetry remains\n"
              "separately tracked by #401. Regression locks: `CollisionDeflectionFeedbackTests`,\n"
              "`GoalkeeperConversionTests.OnThreatDeflected_OverwritesArmingStamp_WithoutShotPending`, and\n"
              "`MatchEngineKeeperPerceptionW4Tests` (screened DT SAVE + non-vacuous raw-rush-veto case).\n\n",
              "W4 resolved block",
              flags=re.S)
          text = regex_once(
              text,
              r"\| 4 \| \*\*W4\*\* keeper perception \|.*?\|\n",
              "| 4 | ~~**W4** keeper perception~~ ✅ **WIRED Sep 11, 2026** (PR #403) | Live all-body LOS now gates DT `SAVE` without contaminating the W1 raw-`SaveArmed` rush veto; real body deflections restart reaction timing in the same Resolve call through a dedicated non-shot seam. No new serialized state or event ABI. **Next in sequence: W12.** |\n",
              "W4 sequence row")
          version_anchor = "| 1.14 | 2026-09-10 | — |"
          if version_anchor not in text:
              raise RuntimeError("backlog: 1.14 version row not found")
          row = "| 1.15 | 2026-09-11 | — | **W4 WIRED (PR #403).** DT `SAVE` availability is now raw `SaveArmed` plus current-frame all-body physical LOS through `KeeperPerceptionGate`; the W1 rush exclusion intentionally remains raw `SaveArmed`, correcting v1.14 constraint 3 from a too-broad one-predicate rule to the actual shared-geometry invariant. Collision System surfaces only actually-applied AGENT_BALL flight changes as transient per-call feedback; Match Engine consumes it in the same Resolve phase, evaluates post-deflection threat geometry, and `GoalkeeperMechanics.OnThreatDeflected` overwrites reaction timing without setting the shot-event latch. Added composed screened-SAVE/raw-rush-veto, collision applied-vs-overlap, and GK reaction-reset locks. No new cross-tick state, `CollisionEvent` ABI, snapshot schema, RNG stream or draw order. #401 remains separate. Sequence row 4 is closed; W12 is next. |\n"
          text = text.replace(version_anchor, row + version_anchor, 1)
          write(path, text)

          # ------------------------------------------------------------------
          # CHANGELOG-src.md — restore W4 v2.134 and move the later Unity entry
          # to v2.135 so version history remains monotonic and unique.
          # ------------------------------------------------------------------
          path = "docs/tracking/CHANGELOG-src.md"
          text = read(path)
          text = replace_once(
              text,
              "September 12, 2026 (v2.134 — **Unity editor compile fixes",
              "September 12, 2026 (v2.135 — **Unity editor compile fixes",
              "CHANGELOG-src Unity header version")
          text = replace_once(text, "| 2.134 |", "| 2.135 |", "CHANGELOG-src Unity version row")
          p5b_anchor = "> **Last Updated (prior):** September 11, 2026 (v2.133 — **P5b repeated-match lifecycle prerequisite."
          w4_entry = (
              "> **Last Updated (prior):** September 11, 2026 (v2.134 — **W4 keeper perception consumer wiring complete (PR #403).** "
              "`MatchEngine.cs` v1.73 gates Decision Tree `SAVE` through live all-body `KeeperPerceptionGate` LOS while preserving raw `SaveArmed` as the W1 rush veto and threat geometry; `CollisionSystem.cs` v1.9 exposes a source-compatible transient `out bool ballDeflected` only when `BallCollisionHandler` actually changes flight; `GoalkeeperMechanics.cs` v1.13 adds `OnThreatDeflected`, overwriting reaction timing without setting the shot-event latch. New `CollisionDeflectionFeedbackTests.cs` and `MatchEngineKeeperPerceptionW4Tests.cs` (+ metas); `GoalkeeperConversionTests.cs` v1.3 gains the deflection-reset lock. No new assembly, `CollisionEvent` ABI, cross-tick latch, snapshot schema, save format, RNG stream/domain/draw site or draw-order change. Canonical Perception sent-off asymmetry remains #401. Final PR-head CI #1437 passed; the post-merge main run remains separately authoritative.)\n>\n"
          )
          text = replace_once(text, p5b_anchor, w4_entry + p5b_anchor, "CHANGELOG-src W4 chain entry")
          row_anchor = "| 2.133 |"
          w4_row = "| 2.134 | 2026-09-11 | W4 keeper perception consumers: LOS-gated DT SAVE, raw SaveArmed rush veto, same-Resolve applied-deflection reaction reset; collision/GK/composed regressions; no schema/RNG/event-ABI change. |\n"
          text = replace_once(text, row_anchor, w4_row + row_anchor, "CHANGELOG-src W4 version row")
          write(path, text)

          # ------------------------------------------------------------------
          # CHANGELOG.md — restore the historical W4 entry without disturbing
          # newer Sep 12/13 entries, then advance maintained backlog pointers.
          # ------------------------------------------------------------------
          path = "docs/tracking/CHANGELOG.md"
          text = read(path)
          ux_anchor = "> **Last Updated (prior):** September 11, 2026 — **UX F4 validation protocol packet lands (PR #394). Documentation only; no `src/` file, `.asmdef`, spec status or roadmap row touched. F4 is deliberately NOT closed.**"
          w4_entry = (
              "> **Last Updated (prior):** September 11, 2026 — **W4 keeper perception is wired on PR #403, completing the consumer half that PR #399 prepared.**\n>\n"
              "> Decision Tree `SAVE` now uses current-frame all-body physical LOS through `KeeperPerceptionGate.SaveAvailable`; raw `GkHeadingIntentSource.SaveArmed` deliberately remains the shared threat geometry and the independent W1 rush veto, so being screened never makes charging at a goal-bound ball legal. Collision System now returns one transient per-call fact only when `BallCollisionHandler` actually changes flight; Match Engine consumes it immediately in the same Resolve phase, evaluates the post-deflection trajectory, and restarts only the newly threatened keeper through `GoalkeeperMechanics.OnThreatDeflected`. That seam overwrites reaction timing without setting the shot-event latch. Added applied-vs-overlap collision, reaction-reset, screened-DT-SAVE, and non-vacuous raw-rush-veto regressions. No new serialized latch, snapshot schema, `CollisionEvent` ABI, save format, RNG stream/domain/draw site or draw order. Canonical Perception sent-off asymmetry remains separately tracked by #401. `match-engine-wiring-backlog.md` advances v1.14 → v1.15 and closes sequence item W4; W12 is next. Final PR-head CI #1437 passed; the post-merge main run remains separately authoritative.\n>\n"
          )
          text = replace_once(text, ux_anchor, w4_entry + ux_anchor, "CHANGELOG W4 entry")
          text = replace_count(text, "*(since v1.14)*", "*(since v1.15)*", 2, "CHANGELOG maintained pointers")
          write(path, text)

          # ------------------------------------------------------------------
          # file-manifest.md — restore the W4 landing record, correct the later
          # Unity CHANGELOG-src version pointer, and sync maintained W4 pointers.
          # ------------------------------------------------------------------
          path = "docs/tracking/file-manifest.md"
          text = read(path)
          text = replace_once(
              text,
              "`docs/tracking/CHANGELOG-src.md` (v2.134), and this file.",
              "`docs/tracking/CHANGELOG-src.md` (v2.135), and this file.",
              "manifest Unity CHANGELOG-src pointer")
          finance_anchor = "**Last Updated (prior):** September 11, 2026 — **#40 Club Finances T2b runtime wiring / `ERR-030-051` manifest sync.**"
          w4_entry = (
              "**Last Updated (prior):** September 11, 2026 — **W4 keeper perception consumer wiring / PR #403 close-out.**\n"
              "**NEW (4):** `src/collision-system/tests/CollisionDeflectionFeedbackTests.cs` (+ `.meta`) and `src/match-engine/tests/MatchEngineKeeperPerceptionW4Tests.cs` (+ `.meta`). **Modified production (3):** `src/collision-system/CollisionSystem.cs` v1.8 → v1.9, `src/goalkeeper-mechanics/GoalkeeperMechanics.cs` v1.12 → v1.13, `src/match-engine/MatchEngine.cs` v1.72 → v1.73. **Modified existing test (1):** `src/goalkeeper-mechanics/Tests/GoalkeeperConversionTests.cs` v1.2 → v1.3. **Modified tracking (5):** `docs/tracking/match-engine-wiring-backlog.md` v1.14 → v1.15, `docs/tracking/CHANGELOG-src.md` v2.133 → v2.134, `docs/tracking/CHANGELOG.md`, `docs/tracking/open-issues.md` (maintained backlog pointers v1.14 → v1.15), and this manifest. DT SAVE now consumes live all-body LOS; raw `SaveArmed` remains the keeper-rush veto; applied body deflections restart reaction timing in the same Resolve call through a dedicated non-shot seam. No new assembly/asmdef edge, cross-tick deflection latch, `CollisionEvent` ABI, snapshot schema, save format, RNG stream/domain/draw site/draw order, or `[GT]` change. Canonical Perception sent-off asymmetry remains #401. Final PR-head CI #1437 passed; post-merge main CI is tracked independently.\n\n"
          )
          text = replace_once(text, finance_anchor, w4_entry + finance_anchor, "manifest W4 entry")
          text = replace_once(
              text,
              "since advanced to **v1.14**, whose L11 row",
              "since advanced to **v1.15**, whose L11 row",
              "manifest maintained version pointer")
          text = replace_once(
              text,
              "**AUDIT** (**v1.14, Sep 10, 2026**)",
              "**AUDIT / EXECUTION TRACKER** (**v1.15, Sep 11, 2026**)",
              "manifest backlog inventory version")
          text = replace_once(
              text,
              "and proposes the wire-order → calibrate-once sequence |",
              "and proposes the wire-order → calibrate-once sequence. **Current v1.15 status:** W1, W2 and W4 are wired; W12 is next in the recorded sequence. |",
              "manifest backlog current status")
          write(path, text)

          # ------------------------------------------------------------------
          # open-issues.md — restore the maintained backlog-version pointers.
          # ------------------------------------------------------------------
          path = "docs/tracking/open-issues.md"
          text = read(path)
          text = replace_count(text, "now v1.14", "now v1.15", 3, "open-issues backlog pointers")
          write(path, text)

          # Strong local assertions before committing.
          assert read("docs/tracking/match-engine-wiring-backlog.md").count("W4 — The keeper is never unsighted — ✅ **WIRED") == 1
          assert read("docs/tracking/CHANGELOG-src.md").count("v2.134 — **W4 keeper perception") == 1
          assert read("docs/tracking/CHANGELOG-src.md").count("v2.135 — **Unity editor compile fixes") == 1
          assert read("docs/tracking/CHANGELOG.md").count("W4 keeper perception is wired on PR #403") == 1
          assert read("docs/tracking/file-manifest.md").count("W4 keeper perception consumer wiring / PR #403 close-out") == 1
          PY

          python3 tools/doc-consistency-check.py --repo .
          git diff --check

      - name: Commit recovered tracking state and remove one-shot machinery
        shell: bash
        run: |
          rm -f .github/workflows/w4-tracking-recovery.yml .github/w4-tracking-recovery-marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/w4-tracking-recovery.yml \
            .github/w4-tracking-recovery-marker \
            docs/tracking/CHANGELOG.md \
            docs/tracking/CHANGELOG-src.md \
            docs/tracking/file-manifest.md \
            docs/tracking/match-engine-wiring-backlog.md \
            docs/tracking/open-issues.md
          git diff --cached --check
          git commit -m "docs: restore W4 tracking close-out"
          git push origin HEAD:docs/w4-tracking-recovery
