name: PR398 documentation conflict resolver

on:
  push:
    branches: [wiring/w5-w7-press-kickoff]
    paths:
      - '.github/workflows/pr398-doc-conflict-resolver.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w5-w7-press-kickoff
          fetch-depth: 0
      - name: Merge main and resolve tracking conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git merge --no-commit --no-ff origin/main || true

          expected=$(cat <<'EOF' | sort
          docs/tracking/CHANGELOG-src.md
          docs/tracking/CHANGELOG.md
          docs/tracking/file-manifest.md
          docs/tracking/open-issues.md
          docs/tracking/spec-error-log.md
          EOF
          )
          actual=$(git diff --name-only --diff-filter=U | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected conflict set"
            echo "Expected:"
            echo "$expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi

          # Start each conflicted tracking surface from current main, then reapply
          # PR398's semantic close-out in append-only form.
          for f in \
            docs/tracking/CHANGELOG-src.md \
            docs/tracking/CHANGELOG.md \
            docs/tracking/file-manifest.md \
            docs/tracking/open-issues.md \
            docs/tracking/spec-error-log.md; do
            git checkout --theirs -- "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Error log: advance from whatever main currently owns, preserve its
          # newest update as prior, then add ERR-013-011 and its index row.
          ep = Path('docs/tracking/spec-error-log.md')
          e = ep.read_text()
          vm = re.search(r'^\*\*Version:\*\*\s+(\d+)\.(\d+)\s*$', e, re.M)
          if not vm:
              raise SystemExit('spec-error-log: Version line not found')
          major, minor = map(int, vm.groups())
          old_err = f'{major}.{minor}'
          new_err = f'{major}.{minor + 1}'
          e = e[:vm.start()] + f'**Version:** {new_err}' + e[vm.end():]

          um = re.search(r'^\*\*Updated:\*\*.*$', e, re.M)
          if not um:
              raise SystemExit('spec-error-log: Updated line not found')
          prior = um.group(0).replace('**Updated:**', '**Updated (prior):**', 1)
          update = (
              f'**Updated:** September 12, 2026 (v{new_err} — **`ERR-013-011` filed and RESOLVED after second PR #398 review.** '
              'The first remediation compared the 60 Hz EventBus-stamped pass tick directly to the 10 Hz tactical heartbeat and dead-wired BACKWARD_PASS; '
              'review also exposed that a one-window event pulse cannot satisfy the generic two-heartbeat debounce without bounded event semantics. '
              '#13 §§3/4/5 now define `[N-AI_PHASE_STRIDE,N)` acceptance at AI physics tick `N`, keep the event wholly world-frame, and latch a qualifying discrete pass only until its already-started dwell reaches threshold. '
              'Positive EventBus→next-stride→commit coverage proves the accepting arm; stale-window locks prove the rejection arm. v22 bytes are unchanged because the new timing fields are ephemeral PressingSnapshot inputs. No RNG or draw-order change. Prior update below.)'
          )
          e = e[:um.start()] + update + '\n' + prior + e[um.end():]

          if 'ERR-013-011 |' not in e:
              hdr = '|----|-------|----------|---------------|--------|'
              row = ('| ERR-013-011 | #13 had no executable definition of a 60 Hz pass-event "this tick" inside its 10 Hz tactical loop; '
                     'W5 first over-retained the event, then the first remediation compared unlike clocks and killed the trigger. Generic two-heartbeat debounce also made a one-window event pulse unable to commit. '
                     '| High | `docs/specs/pressing-ai/section-3.md`; `section-4.md`; `section-5.md`; `src/pressing-ai/PressingSnapshot.cs`; `TriggerEvaluator.cs`; `src/match-engine/MatchEngine.cs`; tests '
                     '| ✅ RESOLVED 2026-09-12, same PR — accept only `[N-AI_PHASE_STRIDE,N)`, carry 60 Hz bounds separately from 10 Hz `TickIndex`, retain world-frame storage, and latch a qualifying pass only through its already-started two-heartbeat dwell. Positive EventBus acceptance/commit plus stale-window rejection lock both arms. |')
              if hdr not in e:
                  raise SystemExit('spec-error-log: index header not found')
              e = e.replace(hdr, hdr + '\n' + row, 1)
          ep.write_text(e)

          # 2) CHANGELOG-src: main owns the current latest row. PR398 becomes the
          # next sequential version and is prepended without editing main history.
          cp = Path('docs/tracking/CHANGELOG-src.md')
          c = cp.read_text()
          hm = re.search(r'^> \*\*Last Updated:\*\*.*?\(v(\d+)\.(\d+)\s+—', c, re.M)
          if not hm:
              raise SystemExit('CHANGELOG-src: current header/version not found')
          cmaj, cmin = map(int, hm.groups())
          new_src = f'{cmaj}.{cmin + 1}'
          old_head = hm.group(0)
          # Replace only the label on the existing newest line, leaving all text intact.
          line_end = c.find('\n', hm.start())
          existing_line = c[hm.start():line_end]
          prior_line = existing_line.replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          w5_line = (
              f'> **Last Updated:** September 12, 2026 (v{new_src} — **W5 + W7 wiring, two-round review-corrected (`ERR-013-011`).** '
              'W5 keeps CONTACT events world-frame in the opposing ring, carries the 60 Hz `[N-AI_PHASE_STRIDE,N)` bounds separately from the 10 Hz heartbeat, and latches a qualifying discrete pass only through its two-heartbeat dwell. '
              'Positive EventBus acceptance/commit coverage closes the dead-trigger gap. Snapshot schema remains **21 → 22** for latest-ring persistence; timing carriers are ephemeral and add no v22 bytes. '
              'W7 `ApplyKickoff` remains after manager configuration and before tick 1, with AI-reference and neutral-baseline digest locks. No assembly/dependency or RNG/draw-order change. `src/CLAUDE.md` remains unchanged under the compact-history convention.)'
          )
          c = c[:hm.start()] + w5_line + '\n>\n' + prior_line + c[line_end:]
          vh = c.find('## VERSION HISTORY')
          if vh < 0:
              raise SystemExit('CHANGELOG-src: VERSION HISTORY not found')
          sep = c.find('|---|---|---|---|', vh)
          if sep < 0:
              raise SystemExit('CHANGELOG-src: table separator not found')
          ins = c.find('\n', sep) + 1
          row = (f'| {new_src} | September 12, 2026 | — | W5/W7 wiring + ERR-013-011: 60 Hz `[N-AI_PHASE_STRIDE,N)` pass window, bounded discrete-event dwell, world-frame ring state, positive EventBus acceptance lock, W7 ApplyKickoff, snapshot schema 22. |\n')
          c = c[:ins] + row + c[ins:]
          cp.write_text(c)

          # 3) Root tracking changelog: prepend PR398 and demote main's newest label.
          rp = Path('docs/tracking/CHANGELOG.md')
          r = rp.read_text()
          rm = re.search(r'^> \*\*Last Updated:\*\*.*$', r, re.M)
          if not rm:
              raise SystemExit('CHANGELOG: current Last Updated not found')
          prior = rm.group(0).replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          w5 = ('> **Last Updated:** September 12, 2026 — **W5 + W7 implementation and two-round W5 remediation (`ERR-013-011`).** '
                'PR #398 wires #13 BACKWARD_PASS input and #26 kickoff selection. Final #13 contract accepts only `[N-AI_PHASE_STRIDE,N)` at AI physics tick `N`, latches a qualifying pass only through its already-started two-heartbeat dwell, and keeps the retained event wholly world-frame with evaluator-side target normalization. '
                'Positive EventBus→next-stride→commit coverage proves acceptance. W7 remains after manager configuration and before tick 1, with AI-reference and neutral-baseline digest locks. '
                'Snapshot schema remains **21 → 22** for latest-ring persistence; timing carriers are ephemeral, so v22 bytes do not change. No RNG/draw-order change. Backlog W3–W10 falls **8 → 6**; KD-W1 remains active. '
                '**GATE:** current-head PR CI is authoritative and must be green before merge; Unity-runner jobs remain environment-gated when no license is configured.')
          r = r[:rm.start()] + w5 + '\n>\n' + prior + r[rm.end():]
          rp.write_text(r)

          # 4) Manifest: same append-only treatment, with live error-log version numbers.
          mp = Path('docs/tracking/file-manifest.md')
          m = mp.read_text()
          mm = re.search(r'^\*\*Last Updated:\*\*.*$', m, re.M)
          if not mm:
              raise SystemExit('file-manifest: current Last Updated not found')
          prior = mm.group(0).replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          w5m = (f'**Last Updated:** September 12, 2026 — **PR #398 W5 + W7 wiring, two-round W5 review correction (`ERR-013-011`).** '
                 'Modified production: `src/match-engine/MatchEngine.cs`, `MatchEngineConstants.cs`, `src/pressing-ai/PressingSnapshot.cs`, `TriggerEvaluator.cs`, `src/match-client-core/MatchSession.cs`. '
                 'Modified tests: `MatchEngineEventsTests.cs`, snapshot schema/restore tests, `PressingAITests.cs`, `MatchSessionTests.cs`. Normative correction: #13 `section-3.md` **v0.4 → v0.5**, `section-4.md` **v0.3 → v0.4**, `section-5.md` **v0.2 → v0.3**. '
                 f'Tracking: backlog **v1.14 → v1.15**, error log **v{old_err} → v{new_err}**, both changelogs, open issues, this manifest. W5 accepts only the completed 60 Hz `[N-AI_PHASE_STRIDE,N)` interval at AI tick `N`, completes a qualifying discrete event through the required two-heartbeat dwell, and retains homogeneous world-frame ring state. '
                 'Snapshot schema remains **21 → 22**; timing carriers are ephemeral and add no v22 bytes. No new assembly, RNG stream/domain/draw site/order or save format. README, `src/CLAUDE.md`, `SPEC_INDEX.md`, project-reference counts and roadmap stay unchanged. **GATE:** current-head PR CI owns the verdict; merge is prohibited until green.')
          m = m[:mm.start()] + w5m + '\n\n' + prior + m[mm.end():]
          # Keep the manifest's historical "since advanced to" pointer current.
          m = re.sub(
              r'(`docs/tracking/spec-error-log\.md` \*\*v2\.42 → v2\.43\*\*, since advanced to \*\*v)\d+\.\d+(\*\*)',
              lambda x: x.group(1) + new_err + x.group(2),
              m,
          )
          mp.write_text(m)

          # 5) Open issues: preserve main's current giant audit record, but update the
          # active backlog headline and append PR398's closure note exactly once.
          op = Path('docs/tracking/open-issues.md')
          o = op.read_text()
          start = o.find('- **Match-engine wiring backlog —')
          end = o.find('\n\n- **Conversion at contact', start)
          if start < 0 or end < 0:
              raise SystemExit('open-issues: match-engine backlog bullet boundaries not found')
          bullet = o[start:end]
          bullet = bullet.replace(
              '8 built subsystems (W3–W10) still have no production caller',
              '6 built subsystems (W3, W4, W6, W8–W10) still have no production caller',
              1,
          )
          if 'UPDATE September 12, 2026 — W5 + W7 WIRED on PR #398' not in bullet:
              bullet += (' **UPDATE September 12, 2026 — W5 + W7 WIRED on PR #398 after two W5 review corrections.** '
                         'W5 consumes #5 CONTACT `PassAttemptEvent`s through the opposing ring. `ERR-013-011` separates the 60 Hz EventBus clock from the 10 Hz tactical heartbeat: at AI physics tick `N`, only `[N-AI_PHASE_STRIDE,N)` may start BACKWARD_PASS dwell, and the discrete event latches only until the required two-heartbeat dwell commits. '
                         'World-frame storage and evaluator-side normalization remain. Positive EventBus→next-stride→commit coverage proves W5 is live. W7 calls #26 `ApplyKickoff` after manager configuration and before tick 1, with AI and neutral digest locks. '
                         'The active backlog therefore falls from eight to six Class-A items in W3–W10: **W3, W4, W6, W8, W9, W10**. KD-W1 remains active because those items and W2\'s disabled challenge still prevent complete-engine calibration.')
          o = o[:start] + bullet + o[end:]
          op.write_text(o)

          print(f'spec-error-log {old_err} -> {new_err}')
          print(f'CHANGELOG-src -> v{new_src}')
          PY

          git add docs/tracking/CHANGELOG-src.md \
                  docs/tracking/CHANGELOG.md \
                  docs/tracking/file-manifest.md \
                  docs/tracking/open-issues.md \
                  docs/tracking/spec-error-log.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python3 tools/doc-consistency-check.py --repo .
          bash .claude/skills/landing-close-out/scripts/check_drift.sh

          # Remove this one-shot resolver from the final branch tree.
          git rm .github/workflows/pr398-doc-conflict-resolver.yml
          git commit -m "docs: reconcile PR 398 tracking with main"
          git push origin HEAD:wiring/w5-w7-press-kickoff
