name: Audio G0 acceptance sync

on:
  push:
    branches:
      - audio/plan-readiness-v2

permissions:
  contents: write

concurrency:
  group: audio-g0-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize accepted audio G0 documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/plan-readiness-v2
          fetch-depth: 0

      - name: Apply acceptance synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # 1) Audio implementation plan: owner acceptance closes G0; no implementation
          # starts until this planning PR itself lands.
          p = "docs/planning/audio-implementation-plan.md"
          t = read(p)
          t = replace_once(t,
              "**Status:** READY FOR G0 OWNER ACCEPTANCE  ",
              "**Status:** G0 ACCEPTED — P1/P2 AUTHORIZED AFTER THIS PLANNING PR LANDS",
              "plan status")
          t = replace_once(t,
              "**Last Updated:** September 6, 2026  ",
              "**Last Updated:** September 7, 2026",
              "plan updated date")
          t = replace_once(t,
              "**Version:** 1.4  ",
              "**Version:** 1.5",
              "plan version")
          t = replace_once(t,
              "**Implementation gate:** G0 OPEN pending owner acceptance and canonical tracking completion; no substantial audio implementation or bulk asset production is authorized by this document alone.  ",
              "**Implementation gate:** G0 CLOSED by owner acceptance on September 7, 2026; P1/P2 may begin after this planning PR lands. No bulk audio production is authorized before G3.",
              "plan implementation gate")
          t = replace_once(t,
              "The canonical `docs/tracking/spec-error-log.md` row remains a G0 merge blocker and must be added after re-verifying that `ERR-051-001` is still free at the merge head.",
              "The canonical `docs/tracking/spec-error-log.md` row is present at v2.51. `ERR-051-001` remains **RECORDED — OPEN** and must still be re-verified against merge-head `main` immediately before merge, per the `ERR-030-025` collision precedent.",
              "plan ERR tracking state")
          t = replace_once(t,
              "1. Accept this plan and the audio parallel roadmap amendment.",
              "1. **Accepted by the owner on September 7, 2026:** this plan and the audio parallel roadmap amendment.",
              "plan P0 acceptance")
          t = replace_once(t,
              "2. Keep `ERR-051-001` recorded in #51 §7 and add the canonical ERR/log/tracking rows before merging G0, but do **not** patch normative §2/§4 until T0 code exists.",
              "2. Keep `ERR-051-001` recorded in #51 §7 and the canonical ERR/log/tracking surfaces, but do **not** patch normative §2/§4 until T0 code exists.",
              "plan P0 ERR action")
          t = replace_once(t,
              "- **C6 misread:** contract sequencing is corrected; #51 §7 records ERR-051-001 now, while the canonical ERR/tracking rows remain G0 merge blockers and normative contract repair waits for T0 code/test.",
              "- **C6 misread:** contract sequencing is corrected; #51 §7 and the canonical ERR/tracking surfaces record ERR-051-001 now, while normative contract repair waits for T0 code/test.",
              "plan final critique C6")
          t = replace_once(t,
              "No substantial implementation should begin until G0 is accepted and the canonical G0 tracking rows are complete. After acceptance, P1 and P2 are safe parallel first slices; P4 remains blocked until D48 is genuinely green.",
              "G0 was accepted by the owner on September 7, 2026 and the canonical G0 tracking rows are complete. After this planning PR lands, P1 and P2 are safe parallel first slices; P4 remains blocked until D48 is genuinely green.",
              "plan final readiness")
          if "| 1.5 | 2026-09-07 |" in t:
              raise SystemExit("plan v1.5 history row already present")
          t = t.rstrip() + "\n| 1.5 | 2026-09-07 | Owner accepted G0 and the narrow roadmap amendment; canonical close-out acknowledged as complete; P1/P2 authorized after the planning PR lands; ERR-051-001 remains recorded for T0 discharge; G3/D48 and caption/D49 gates unchanged. |\n"
          write(p, t)

          # 2) Roadmap amendment: accepted, not merely pending.
          p = "docs/planning/path-to-playable-audio-parallel-amendment.md"
          t = read(p)
          t = replace_once(t,
              "> **Last Updated:** September 6, 2026",
              "> **Last Updated:** September 7, 2026",
              "amendment updated date")
          t = replace_once(t,
              "> **Version:** 0.4",
              "> **Version:** 0.5",
              "amendment version")
          t = replace_once(t,
              "> **Status:** ROADMAP AMENDMENT — pending owner acceptance with the audio G0 plan",
              "> **Status:** ROADMAP AMENDMENT — ACCEPTED by owner September 7, 2026",
              "amendment status")
          t = replace_once(t,
              "After acceptance of `docs/planning/audio-implementation-plan.md` G0, the following may proceed concurrently with the primary roadmap:",
              "Following the owner's September 7, 2026 acceptance of `docs/planning/audio-implementation-plan.md` G0, the following may proceed concurrently with the primary roadmap after this planning landing reaches `main`:",
              "amendment authorization sentence")
          if "| 0.5 | 2026-09-07 |" in t:
              raise SystemExit("amendment v0.5 history row already present")
          t = t.rstrip() + "\n| 0.5 | 2026-09-07 | Owner accepted the narrow audio-parallel roadmap amendment and G0. #51 T0/T1 plus pipeline substrate are authorized after the planning landing reaches main; T2/G3 remains blocked on D48, caption rendering on D49, and bulk production remains behind G3. |\n"
          write(p, t)

          # 3) Live open issue: preserve the filed body, annotate the owner decision,
          # and keep the issue active because ERR-051-001/D48/D49 remain open.
          p = "docs/tracking/open-issues.md"
          t = read(p)
          t = replace_once(t,
              "Audio & Sound Design (#51) — G0 planning accepted-pending; `ERR-051-001` RECORDED, NOT FIXED; T2/G3 hard-blocked on #48 T0.",
              "Audio & Sound Design (#51) — G0 ACCEPTED September 7, 2026; `ERR-051-001` RECORDED, NOT FIXED; T2/G3 hard-blocked on #48 T0.",
              "open-issues title")
          t = replace_once(t,
              "`docs/planning/audio-implementation-plan.md` v1.4 and `docs/planning/path-to-playable-audio-parallel-amendment.md` v0.4 govern the audio workstream.",
              "`docs/planning/audio-implementation-plan.md` v1.5 and `docs/planning/path-to-playable-audio-parallel-amendment.md` v0.5 govern the audio workstream.",
              "open-issues governing versions")
          t = replace_once(t,
              "**Three things are genuinely open.**",
              "**Two implementation/dependency things are genuinely open.**",
              "open-issues remainder count")
          t = replace_once(t,
              "**(c) G0 itself is OPEN pending owner acceptance.**",
              "**(c) SUPERSEDED September 7, 2026: G0 was accepted by the owner; this is no longer an open remainder.**",
              "open-issues superseded G0")
          marker = "**Deliberately not done:** no bulk audio production before G3, and no middleware adoption without G3 host evidence (native Unity is the default through Early Access)."
          decision = (marker + " **✅ OWNER DECISION, September 7, 2026: G0 ACCEPTED.** "
                      "The owner accepts the narrow roadmap amendment: #51 T0/T1 and the pipeline substrate may proceed after PR #368 lands, outside the PM-2 critical path; `ERR-051-001` remains recorded for T0 code+revert-failing-test discharge; bulk production remains blocked until G3; T2/G3 remains blocked on D48 and caption rendering on D49. The active/archive counts stay 22/53 because those implementation/dependency remainders remain live.")
          t = replace_once(t, marker, decision, "open-issues owner decision")
          write(p, t)

          # 4) Expanded project-reference index: state change only; counts do not move.
          p = "docs/agent-guides/project-reference.md"
          t = read(p)
          t = replace_once(t,
              "**22 active** / **53 archived**. ",
              "**22 active** / **53 archived**. *(September 7, 2026 — audio G0 accepted by owner; counts unchanged because `ERR-051-001`, D48 and D49 remain live. The governing audio plan/amendment are now v1.5/v0.5.)* ",
              "project-reference count note")
          t = replace_once(t,
              "Audio & Sound Design (#51) — G0 planning accepted-pending; `ERR-051-001` RECORDED, NOT FIXED; T2/G3 hard-blocked on #48 T0.",
              "Audio & Sound Design (#51) — G0 ACCEPTED September 7, 2026; `ERR-051-001` RECORDED, NOT FIXED; T2/G3 hard-blocked on #48 T0.",
              "project-reference audio bullet")
          write(p, t)

          # 5) File manifest: append a new newest record; preserve the September 6
          # landing record verbatim except for its required Last Updated -> prior label.
          p = "docs/tracking/file-manifest.md"
          t = read(p)
          old = "**Last Updated:** September 6, 2026, later — **Audio G0 planning landed with its tracking close-out; `ERR-051-001` RECORDED, not repaired; no audio code or asset exists.**"
          new = "\n".join([
              "**Last Updated:** September 7, 2026 — **Audio G0 owner acceptance synchronized; still no audio code or runtime asset.**",
              "Modified: `docs/planning/audio-implementation-plan.md` **v1.4 → v1.5** and `docs/planning/path-to-playable-audio-parallel-amendment.md` **v0.4 → v0.5** record the owner's September 7 G0 acceptance; `docs/tracking/open-issues.md` carries the dated owner-decision block while remaining active for `ERR-051-001`/D48/D49; `docs/agent-guides/project-reference.md` keeps **22 active / 53 archived** and synchronizes its audio bullet; `docs/tracking/CHANGELOG.md` records this acceptance; this manifest records the close-out. G0 acceptance authorizes P1/P2 only after PR #368 lands; it does not repair `ERR-051-001`, does not unblock T2/G3 without D48, does not unblock captions without D49, and does not authorize bulk production before G3. No `.cs`, `.asmdef`, asset, simulation/save schema, RNG stream/domain/draw site/draw order, `SPEC_INDEX.md` row, or spec status changed.",
              "**Last Updated (prior):** September 6, 2026, later — **Audio G0 planning landed with its tracking close-out; `ERR-051-001` RECORDED, not repaired; no audio code or asset exists.**",
          ])
          t = replace_once(t, old, new, "file-manifest newest header")
          write(p, t)

          # 6) CHANGELOG: append newest acceptance record and relabel the September 6
          # planning landing as prior; do not rewrite historical content.
          p = "docs/tracking/CHANGELOG.md"
          t = read(p)
          old = "> **Last Updated:** September 6, 2026, later — **Audio G0 planning landed; `ERR-051-001` RECORDED, deliberately NOT repaired; still zero audio code and zero audio assets.**"
          new = "\n".join([
              "> **Last Updated:** September 7, 2026 — **Audio G0 accepted by owner and all maintained acceptance surfaces synchronized; still zero audio code and zero audio assets.**",
              "> Owner acceptance closes G0 only. `docs/planning/audio-implementation-plan.md` advances **v1.4 → v1.5** and the narrow `docs/planning/path-to-playable-audio-parallel-amendment.md` advances **v0.4 → v0.5**. `open-issues.md` records the dated owner decision without archiving the audio issue; `project-reference.md` remains **22 active / 53 archived** because `ERR-051-001`, D48 and D49 are still live. P1/P2 are authorized after PR #368 lands; T2/G3 remains blocked on real #48 T0, caption rendering on D49, and bulk production on G3.",
              "> `ERR-051-001` remains **RECORDED — OPEN**. The owner acceptance does not harden #51 §2/§4 ahead of code: the concrete `AssetRef`/`CueParams` shapes, collision re-scan, multi-variant regression proof and normative repair still land atomically with #51 T0 under Path-to-Playable C6.",
              "> **Determinism/runtime declaration:** documentation-only acceptance synchronization; no `.cs`, `.asmdef`, asset, snapshot/serialization schema, RNG stream/domain/draw site/draw order, runtime behavior, assembly graph, `SPEC_INDEX.md` row, or spec status changed. The dotnet gate is not represented as evidence for this doc-only close-out.",
              "> **Verification:** this acceptance commit is created only after `doc-consistency-check.py`, `recurring-defect-lint.py`, `check_drift.sh`, and `git diff --check` all pass on the synchronized tree.",
              ">",
              "> **Last Updated (prior):** September 6, 2026, later — **Audio G0 planning landed; `ERR-051-001` RECORDED, deliberately NOT repaired; still zero audio code and zero audio assets.**",
          ])
          t = replace_once(t, old, new, "CHANGELOG newest header")
          write(p, t)
          PY

      - name: Verify synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/doc-consistency-check.py --repo .
          python3 tools/recurring-defect-lint.py --repo .
          bash .claude/skills/landing-close-out/scripts/check_drift.sh
          git diff --check

      - name: Commit synchronized acceptance and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/audio-g0-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No synchronization changes to commit"; exit 1; }
          git commit -m "Record owner acceptance of audio G0"
          git push origin HEAD:audio/plan-readiness-v2
