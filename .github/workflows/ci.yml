name: CI

on:
  push:
    branches: [main, art/art-pipeline-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  art-tracking-closeout:
    name: Art tracking close-out
    if: github.event_name == 'push' && github.ref == 'refs/heads/art/art-pipeline-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/art-pipeline-foundation
          fetch-depth: 0
      - name: Patch append-only tracking ledgers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('docs/tracking/file-manifest.md')
          text = manifest.read_text(encoding='utf-8')
          title = '# File Manifest (Post-Migration Baseline)\n\n'
          assert text.startswith(title)
          assert text.count('**Last Updated:**') == 1
          text = text.replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          entry = (
              '**Last Updated:** September 5, 2026 — **Art-pipeline planning PR #360 grounded and tracking close-out completed; documentation only; G0 remains CLOSED pending owner acceptance.**\n'
              'New: `docs/planning/art-pipeline-foundation.md` **v0.5**. Modified: `docs/tracking/CHANGELOG.md` and this manifest. The plan now inherits the July 25 `touchline` visual-direction decision and APPROVED UI / Client Framework #38, grounds integration in the actual client trees, keeps the missing management UGUI consumer explicit, makes `.art.json` the sole initial production/provenance record, and moves `Assets/GameArt/` `.meta` checker/generator scope extension plus a firing proof to the **first AP-01 action before any tracked GameArt path exists**. The Design References row is corrected from the stale “neither chosen yet” prose to `touchline` chosen / `stadium` rejected; this was plain prose, not a maintained version citation or machine-derivable cardinality, so `doc-consistency-check.py` could not detect the drift. The new planning document is added to Planning Documents. PR #360 pre-closeout CI run #832 failed only the documented owner-held `sim_match_engine_close_chance` band in `MatchEngine.Tests` (472 passed / 1 failed / 11 skipped); Markdown link and every other completed check passed. No `src/`, `.cs`, `.asmdef`, runtime schema, RNG stream/domain/draw site/draw order, workflow contract, `SPEC_INDEX.md` row, or spec status changed.\n'
          )
          text = text.replace(title, title + entry, 1)
          stale = '| `docs/design/ui-mockups/System XI - Design System.html` | Design-system page: color, type, spacing, components, data-viz, match-day HUD; two visual directions (`stadium` / `touchline`, neither chosen yet) |'
          fresh = '| `docs/design/ui-mockups/System XI - Design System.html` | Design-system page: color, type, spacing, components, data-viz, match-day HUD; the July 25 comparison is retained, with `touchline` chosen and `stadium` rejected per the companion README |'
          assert stale in text
          text = text.replace(stale, fresh, 1)
          planning_header = '## Planning Documents\n\n| File |\n|------|\n'
          assert planning_header in text
          assert '`docs/planning/art-pipeline-foundation.md`' not in text
          text = text.replace(planning_header, planning_header + '| `docs/planning/art-pipeline-foundation.md` |\n', 1)
          manifest.write_text(text, encoding='utf-8')

          changelog = Path('docs/tracking/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          assert text.count('> **Last Updated:**') == 1
          text = text.replace('> **Last Updated:**', '> **Last Updated (prior):**', 1)
          divider = '---\n\n'
          assert divider in text
          entry = '''> **Last Updated:** September 5, 2026 — **Art-pipeline planning PR #360 grounded and closed out for owner acceptance; documentation only; G0 remains CLOSED.**
> **The plan now fits the project it governs.** New `docs/planning/art-pipeline-foundation.md` **v0.5** inherits the July 25 `touchline` choice in `docs/design/ui-mockups/README.md` instead of reopening visual direction, treats APPROVED UI / Client Framework #38 as the architectural authority, and names the actual client surfaces (`src/ui-framework/`, `src/match-client-core/`, `src/match-client-unity/`, `src/match-client-web/`, `src/client-app/`). The first draft's premature `Assets/GameArt/` / `art-source/` companion files were removed from the effective diff rather than legitimized ahead of G0. `.art.json` is the one initial production/provenance format, routine `_v001`-style revision copies are prohibited, typography work is narrowed to the existing candidates plus redistribution/offline-shipping/script/fallback validation, and Stage-1 professional visual quality is grounded in `master-development-plan.md`.
> **The follow-up review closed the remaining enforcement gap before it could repeat the first draft's `.meta` mistake.** Both `tools/unity-ci/check-meta-integrity.sh` and `tools/unity-ci/generate-missing-metas.sh` currently enumerate only `src/`. v0.5 therefore makes widening those tracked-path universes to include `Assets/GameArt/` the **first AP-01 action**, requires a mutation/firing proof before any real GameArt path is created, and leaves AP-06 for evidence-driven hardening rather than first-line integrity. The integrated-asset identity rule also drops the `where practical` hedge; necessary move/rename exceptions are explicit under §6.4 and require GUID/reference verification.
> **Tracking drift corrected in the same landing.** `docs/tracking/file-manifest.md` now inventories the new planning document and corrects its UI design-reference row from `stadium` / `touchline`, “neither chosen yet” to the actual July 25 disposition: **`touchline` chosen, `stadium` rejected**. That stale sentence survived because it is plain descriptive prose, not a maintained version citation or a machine-derivable count/cardinality; `doc-consistency-check.py` structurally had no oracle for it.
> **CI classification, not a runtime repair.** PR #360 pre-closeout CI run **#832** completed with the Linux shim gate red only in `TacticalDirector.MatchEngine.Tests.dll`: **472 passed / 1 failed / 11 skipped**; the failure is `sim_match_engine_close_chance`, explicitly owner-held RED on `main` by the steward contract and existing tracking record. `SeasonSave.Tests` passed its executed tests, Markdown link passed, and every other completed job was green. This PR changes no `.cs`, `.asmdef`, or dotnet-gate file, so there is no art-planning runtime fix or rebaseline to make here.
> **Determinism/runtime declaration:** no snapshot/serialization schema change; no new RNG stream, domain tag, draw site, or draw-order change; no runtime behavior, assembly graph, workflow contract, required status, `SPEC_INDEX.md` row, or spec status changed. **G0 remains CLOSED until the owner explicitly accepts the plan.** Merging the planning record does not itself authorize AP-01 or asset production.
>
'''
          text = text.replace(divider, divider + entry, 1)
          changelog.write_text(text, encoding='utf-8')
          PY
      - name: Commit close-out
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/file-manifest.md docs/tracking/CHANGELOG.md
          git diff --cached --check
          git commit -m "Close out art pipeline planning tracking"
          git push origin HEAD:art/art-pipeline-foundation

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # Scope: top-level READMEs and CI metadata only. docs/specs and src/
          # are long-form prose / living documents maintained at their own
          # discipline and would dominate the signal here. Re-add if/when those
          # trees are normalized.
          globs: |
            *.md
            .github/**/*.md
            !**/node_modules/**

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}" .github/

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'

  spec-hygiene:
    name: Spec hygiene checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for this job only. Two governance fixtures resolve
          # revisions named in review-ledger.json --
          # test_every_round_digest_recomputes_from_the_tree_it_names and
          # test_status_timestamps_equal_first_publication_commit_time. At the
          # default depth 1 they SKIP, correctly and loudly (A2-R5-001 made that
          # all-or-nothing), which meant the provenance chain the A2 record rests
          # on was only ever verified on someone's local clone and never in CI.
          # A green badge is not evidence of a check that never ran.
          fetch-depth: 0
      - name: Stale spec numbers (Decision Tree must be #8, not #7)
        run: |
          set -e
          # Filter audit / history / renumbering-mapping context where the line
          # documents the historical bug rather than re-introducing it:
          #   - `audit-report.md` files are by design retrospective findings.
          #   - Lines containing renumbering arrows (`→ #8`, `#7 → #8`).
          #   - Audit-verification table phrases (`Zero hits`, `should be #8`,
          #     `Evidence:`, `instances)`, `references "Decision Tree Spec #7"`).
          #   - Renumbering-context keywords (post-audit, corrected, former numbering).
          hits=$(grep -RInE "Decision[ -]Tree[^A-Za-z0-9]*#7([^0-9]|$)" docs/specs src 2>/dev/null \
                 | grep -vE "audit-report\.md:" \
                 | grep -viE "(post-audit|audit fix|→[ ]*#?8|#7[ ]*→[ ]*#?8|corrected|former numbering|old[- ]?to[- ]?correct|renumber|should be #8|zero hits|evidence:|instances\)|references \"decision tree)" \
                 | grep -vE "\*\*#8\*\*" || true)
          if [ -n "$hits" ]; then
            echo "::error::Stale 'Decision Tree #7' reference found — canonical is #8."
            echo "$hits"
            exit 1
          fi
      - name: Inverted fatigue convention
        run: |
          set -e
          # CLAUDE.md says 0 = rested, 1 = fatigued. Flag the inverted phrasing.
          # Digit-boundary prefix `(^|[^.0-9])` prevents the trailing `0` of `1.0`
          # being read as a standalone `0` (e.g. `1.0 = fatigued` is correct, not inverted).
          # Audit / history meta-references (`corrected`, `inverted`, `inversion`) are
          # excluded so retrospective bug write-ups don't trip the live check.
          hits=$(grep -RInE "(^|[^.0-9])1(\.0)?[ ]*=[ ]*(fully[ ]+)?rested|(^|[^.0-9])0(\.0)?[ ]*=[ ]*(fully[ ]+)?fatigued" docs/specs src 2>/dev/null \
                 | grep -viE "(corrected|inverted|inversion|fatigue inversion)" || true)
          if [ -n "$hits" ]; then
            echo "::error::Inverted fatigue convention detected (must be 0=rested, 1=fatigued)."
            echo "$hits"
            exit 1
          fi
      - name: Wrong coordinate origin
        run: |
          set -e
          # Filter audit / history meta-references. Lines documenting that the bug
          # was found and fixed should not re-fail the check.
          hits=$(grep -RInE "origin.*pitch[ -]?center|pitch[ -]?center.*origin" docs/specs src 2>/dev/null \
                 | grep -viE "(corrected|conflicting|flagged|consistency note|cross-reference warning|implementers reading|was flagged|not pitch[ -]?cent|tracked as a blocking issue|audit-report)" || true)
          if [ -n "$hits" ]; then
            echo "::error::Coordinate origin must be corner (0,0,0), not pitch center."
            echo "$hits"
            exit 1
          fi
      - name: Assembly tier order (§3.5.2 table vs production .asmdef graph)
        # Enforces the Spec #20 §3.5.2 placement rule mechanically: every
        # production src/<folder>/<name>.asmdef must be seated in the tier
        # table (same commit), no upward references (FR-CS-046), FR-CS-046b
        # both directions, graph acyclic (FR-CS-046a), and the out-of-band
        # Infrastructure row pinned BY NAME to the pair FR-CS-046b binds.
        # Pure stdlib Python — no dependencies, runs in under a second.
        if: always()
        run: python3 tools/assembly-tier-check.py --repo .
      - name: Tooling unit tests
        # Discover all stdlib tool regressions so new governance test files cannot
        # silently land outside CI as A2 expands.
        if: always()
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Cross-document consistency (stale version citations and cardinalities)
        # Catches the defect class four adversarial-review rounds surfaced more than
        # any other and that no other gate sees: a value corrected in the document
        # that owns it while restatements elsewhere keep publishing the retracted one.
        # Two checks, both oracle-free: a version citation of another document must
        # match that document's own newest version-history row (or carry the repo's
        # `vOLD, now vNEW` / `*(since vNEW)*` annotation), and a hard-coded cardinality
        # must equal what it counts — with cross-file AGREEMENT standing in where no
        # ground truth exists. Pure stdlib Python.
        if: always()
        run: python3 tools/doc-consistency-check.py --repo .
      - name: Constants must carry source tag in spec text
        run: |
          set -e
          # Heuristic: in spec files, lines defining a constant value should carry one of the tags.
          # Allow files to opt out via `<!-- ci:skip-constant-tag-check -->`.
          missing=0
          while IFS= read -r f; do
            if grep -q "ci:skip-constant-tag-check" "$f"; then continue; fi
            # Find lines like `FOO_BAR = 1.23` or table rows with a numeric value, missing any tag.
            if grep -nE "^[ |]*\`?[A-Z][A-Z0-9_]{3,}\`?[ |]*[=|][^=].*[0-9]" "$f" \
              | grep -vE "\[(GT|EST|FIXED|DERIVED|CROSS|CROSS-PENDING|CITATION-PENDING|TBD-NORMATIVE)\]" \
              | grep -vE "^[^:]+:[0-9]+:\s*\|?\s*$"; then
              echo "::warning file=$f::Constant-like line lacks [GT]/[EST]/[FIXED]/[DERIVED]/[CROSS] tag"
              missing=$((missing+1))
            fi
          done < <(find docs/specs -name '*.md')
          # Non-blocking for now — surface as warnings only.
          echo "Constant-tag warnings: $missing"

  file-manifest-check:
    name: File manifest sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest exists
        run: test -f docs/tracking/file-manifest.md
      - name: SPEC_INDEX exists
        run: test -f docs/specs/SPEC_INDEX.md

  csharp-format:
    name: C# format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet format (whitespace only — Unity asmdef projects)
        run: |
          set -e
          # No top-level .sln/.csproj — Unity generates them. Run a syntax sanity check by
          # compiling .cs files with the Roslyn CLI is out of scope here. Instead, enforce
          # basic style on .cs files using `dotnet format` with a synthetic project.
          shopt -s globstar nullglob
          cs_files=(src/**/*.cs)
          if [ ${#cs_files[@]} -eq 0 ]; then
            echo "No .cs files found — skipping."
            exit 0
          fi
          # Create a transient project that includes all .cs files, then run format --verify-no-changes.
          tmpdir=$(mktemp -d)
          cat > "$tmpdir/Format.csproj" <<'PROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <NoWarn>CS0246;CS0234;CS0103;CS1061;CS0535;CS0117;CS0029;CS1503;CS1729;CS7036;CS0019;CS0021;CS0023;CS0030;CS0031;CS0034;CS0035;CS0037;CS0050;CS0051;CS0052;CS0053;CS0054;CS0066;CS0067;CS0070;CS0071;CS0078;CS0079;CS0080;CS0081;CS0082;CS0083;CS0084;CS0085;CS0086;CS0100;CS0101;CS0102;CS0104;CS0105;CS0106;CS0107;CS0108;CS0109;CS0110;CS0111;CS0112;CS0113;CS0114;CS0115;CS0116;CS0118;CS0119;CS0120;CS0121;CS0122;CS0123;CS0126;CS0127;CS0128;CS0132;CS0133;CS0134;CS0135;CS0136;CS0138;CS0139;CS0140;CS0143;CS0144;CS0146;CS0148;CS0150;CS0151;CS0152;CS0153;CS0154;CS0155;CS0156;CS0157;CS0158;CS0159;CS0160;CS0161;CS0162;CS0163;CS0164;CS0165;CS0166;CS0167;CS0168;CS0169;CS0170;CS0171;CS0172;CS0173;CS0174;CS0175;CS0176;CS0177;CS0178;CS0179;CS0180;CS0181;CS0182;CS0183;CS0184;CS0185;CS0186;CS0187;CS0188;CS0189;CS0190;CS0191;CS0192;CS0193;CS0194;CS0195;CS0196;CS0197;CS0198;CS0199;CS0200</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="../**/*.cs" />
            </ItemGroup>
          </Project>
          PROJ
          # Symlink the repo's src/ into tmpdir parent so the glob resolves.
          ln -s "$GITHUB_WORKSPACE" "$tmpdir/repo"
          # Run whitespace-only format check (does not enforce style rules a Unity codebase may not adopt).
          cd "$tmpdir"
          dotnet format whitespace Format.csproj --verify-no-changes --no-restore || {
            echo "::warning::dotnet format reports whitespace issues. Run 'dotnet format whitespace' locally."
            exit 0  # non-blocking until repo opts in
          }

  dotnet-compile-test:
    name: Compile + test (Linux shim gate, non-certifying)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Builds the ENTIRE src/ tree (production: netstandard2.1 = Unity 2022.3's
      # BCL surface; tests: net8.0 + NUnit3 adapter) against the UnityEngine shim
      # in tools/dotnet-ci/, then runs every NUnit suite. Catches the
      # never-compiled defect class (CS1022/CS0111/CS0117 — see
      # tools/dotnet-ci/README.md for the seven instances found on first run)
      # and executes the suites that were previously only runnable in-editor.
      # NON-CERTIFYING: determinism certification remains the pinned
      # Windows 11 / Unity 2022.3.62f1 / Mono tuple in
      # docs/tracking/certification-platform.md. Known pre-existing test
      # failures are quarantined (tracked, shrinking-only) in
      # tools/dotnet-ci/known-failures.txt + docs/tracking/dotnet-ci-quarantine.md;
      # any NEW failure or any compile error fails this gate.
      - name: Run gate (generate projects, build, test)
        run: bash tools/dotnet-ci/run-gate.sh

  unity-meta-integrity:
    name: Unity .meta integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every tracked file/folder under src/ must have a committed .meta, no
      # orphan metas, no duplicate GUIDs. A missing .cs.meta makes Unity assign
      # a fresh random GUID on checkout, silently breaking every reference to it.
      - name: Check meta integrity
        run: bash tools/unity-ci/check-meta-integrity.sh

  unity-asset-hygiene:
    name: Unity asset hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .gitattributes present (LFS + YAML merge routing)
        run: test -f .gitattributes
      # Large binaries must be routed to Git LFS by .gitattributes.
      - name: Binary / LFS guard
        run: bash tools/unity-ci/check-binaries.sh

  # Gate the Unity Test Runner on the license secret being configured, so the
  # job runs EditMode + PlayMode inside real Unity 6 once secrets exist and is
  # cleanly SKIPPED (not failed) until then. Set repo secrets UNITY_LICENSE,
  # UNITY_EMAIL, UNITY_PASSWORD to activate.
  unity-license-check:
    name: Unity license configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE not set — Unity Test Runner skipped. Configure secrets to enable EditMode/PlayMode tests."
          fi

  unity-tests:
    name: Unity tests (${{ matrix.testMode }})
    needs: unity-license-check
    if: needs.unity-license-check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results-${{ matrix.testMode }}
          path: artifacts