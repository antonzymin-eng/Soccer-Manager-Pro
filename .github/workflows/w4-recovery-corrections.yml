name: W4 Recovery Corrections

on:
  push:
    branches:
      - docs/w4-tracking-recovery
    paths:
      - .github/w4-recovery-corrections-trigger

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/w4-tracking-recovery
          fetch-depth: 0

      - name: Correct W4 tracking chronology
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          # CHANGELOG-src: append W4 as the new v2.135 entry; restore the landed
          # September 12 Unity v2.134 entry unchanged in version and chronology.
          path = 'docs/tracking/CHANGELOG-src.md'
          text = read(path)
          lines = text.splitlines(keepends=True)
          w4_idx = next(i for i, line in enumerate(lines) if '**W4 keeper perception consumer wiring complete (PR #403).**' in line)
          w4_line = lines.pop(w4_idx)
          if w4_idx < len(lines) and lines[w4_idx].strip() == '>':
              lines.pop(w4_idx)
          text = ''.join(lines)
          text = replace_once(
              text,
              '> **Last Updated:** September 12, 2026 (v2.135 — **Unity editor compile fixes; Unity governs the build.**',
              '> **Last Updated (prior):** September 12, 2026 (v2.134 — **Unity editor compile fixes; Unity governs the build.**',
              'restore Unity header version')
          w4_line = w4_line.replace('> **Last Updated (prior):** September 11, 2026 (v2.134 —', '> **Last Updated:** September 13, 2026 (v2.135 —', 1)
          anchor = '## Header chain\n\n'
          text = replace_once(text, anchor, anchor + w4_line + '>\n', 'prepend W4 source changelog')

          lines = text.splitlines(keepends=True)
          w4_row_idx = next(i for i, line in enumerate(lines) if line.startswith('| 2.134 | 2026-09-11 | W4 keeper perception consumers:'))
          old_w4_row = lines.pop(w4_row_idx)
          unity_row_idx = next(i for i, line in enumerate(lines) if line.startswith('| 2.135 | September 12, 2026 | — | Unity editor compile fixes'))
          lines[unity_row_idx] = lines[unity_row_idx].replace('| 2.135 |', '| 2.134 |', 1)
          new_w4_row = old_w4_row.replace('| 2.134 | 2026-09-11 | W4 keeper perception consumers:', '| 2.135 | September 13, 2026 | — | W4 keeper perception consumers:', 1)
          lines.insert(unity_row_idx, new_w4_row)
          write(path, ''.join(lines))

          # Project changelog: move W4 to the head of the append-only chain and
          # date it to the actual #403 merge date.
          path = 'docs/tracking/CHANGELOG.md'
          text = read(path)
          lines = text.splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if '**W4 keeper perception is wired on PR #403' in line)
          end = start + 1
          while end < len(lines) and not (lines[end].startswith('> **Last Updated') and end > start):
              end += 1
          w4_block = lines[start:end]
          del lines[start:end]
          text = ''.join(lines)
          text = replace_once(text, '> **Last Updated:**', '> **Last Updated (prior):**', 'demote prior project changelog head')
          w4_block[0] = w4_block[0].replace('> **Last Updated (prior):** September 11, 2026', '> **Last Updated:** September 13, 2026', 1)
          block = ''.join(w4_block)
          sep = '---\n\n'
          text = replace_once(text, sep, sep + block, 'prepend W4 project changelog')
          write(path, text)

          # File manifest: same append-only treatment; restore the Unity entry's
          # existing v2.134 pointer rather than renumbering historical state.
          path = 'docs/tracking/file-manifest.md'
          text = read(path)
          lines = text.splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if '**W4 keeper perception consumer wiring / PR #403 close-out.**' in line)
          end = start + 1
          while end < len(lines) and not lines[end].startswith('**Last Updated'):
              end += 1
          w4_block = lines[start:end]
          del lines[start:end]
          text = ''.join(lines)
          if '**Last Updated:**' not in text:
              raise SystemExit('manifest: current head label not found')
          text = text.replace('**Last Updated:**', '**Last Updated (prior):**', 1)
          w4_block[0] = w4_block[0].replace('**Last Updated (prior):** September 11, 2026', '**Last Updated:** September 13, 2026', 1)
          text = replace_once(
              text,
              '- tracking: `docs/tracking/CHANGELOG.md`, `docs/tracking/CHANGELOG-src.md` (v2.135), and this file.',
              '- tracking: `docs/tracking/CHANGELOG.md`, `docs/tracking/CHANGELOG-src.md` (v2.134), and this file.',
              'restore Unity manifest pointer')
          title = '# File Manifest (Post-Migration Baseline)\n\n'
          text = replace_once(text, title, title + ''.join(w4_block), 'prepend W4 manifest record')
          write(path, text)

          # Wiring backlog: the status/version date records when #403 actually landed.
          path = 'docs/tracking/match-engine-wiring-backlog.md'
          text = read(path)
          text = replace_once(text, 'WIRED September 11, 2026 (PR #403)', 'WIRED September 13, 2026 (PR #403)', 'W4 heading date')
          text = replace_once(text, 'WIRED Sep 11, 2026** (PR #403)', 'WIRED Sep 13, 2026** (PR #403)', 'W4 sequence-row date')
          text = replace_once(text, '| 1.15 | 2026-09-11 | — | **W4 WIRED (PR #403).**', '| 1.15 | 2026-09-13 | — | **W4 WIRED (PR #403).**', 'W4 version-row date')
          write(path, text)

          # Manifest inventory pointer for the backlog date.
          path = 'docs/tracking/file-manifest.md'
          text = read(path)
          text = text.replace('**v1.15, Sep 11, 2026**', '**v1.15, Sep 13, 2026**')
          write(path, text)
          PY

      - name: Verify documentation
        shell: bash
        run: |
          python3 tools/doc-consistency-check.py --repo .
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('docs/tracking/CHANGELOG-src.md').read_text()
          assert s.count('| 2.135 | September 13, 2026 | — | W4 keeper perception consumers:') == 1
          assert s.count('| 2.134 | September 12, 2026 | — | Unity editor compile fixes') == 1
          assert s.index('September 13, 2026 (v2.135 — **W4 keeper') < s.index('September 12, 2026 (v2.134 — **Unity editor')
          PY

      - name: Commit corrections and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/w4-recovery-corrections.yml .github/w4-recovery-corrections-trigger
          git add docs/tracking/CHANGELOG-src.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md docs/tracking/match-engine-wiring-backlog.md
          git diff --cached --check
          git commit -m "docs: correct W4 recovery chronology"
          git push origin HEAD:docs/w4-tracking-recovery
