name: W4 Local Cleanup

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-unused-local-marker

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
      - name: Use the explicit raw predicate in the visible gate
        shell: bash
        run: python3 -c "from pathlib import Path; p=Path('src/match-engine/MatchEngine.cs'); s=p.read_text(); old='bool saveVisible = KeeperPerceptionGate.SaveAvailable('; new='bool saveVisible = armed && KeeperPerceptionGate.SaveAvailable('; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/match-engine/MatchEngine.cs
          git diff --cached --check
          git commit -m "fix: retain explicit raw W4 save predicate"
          git push origin HEAD:codex/w4-keeper-perception-final
