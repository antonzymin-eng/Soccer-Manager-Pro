name: Art plan v0.6 refinement helper

'on':
  push:
    branches:
      - art/art-pipeline-foundation

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/art-pipeline-foundation
          fetch-depth: 0
      - name: Apply document refinements
        run: python3 tools/art-plan-v06-temp.py
      - name: Commit refinement and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/art-plan-v06-temp.yml tools/art-plan-v06-temp.py
          git add -A docs/planning/art-pipeline-foundation.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md .github/workflows tools/art-plan-v06-temp.py
          git diff --cached --check
          git commit -m "Refine AP-01 meta execution contract"
          git push origin HEAD:art/art-pipeline-foundation
