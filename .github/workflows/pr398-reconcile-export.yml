name: PR 398 reconciliation export

on:
  push:
    branches:
      - wiring/w5-w7-press-kickoff
    paths:
      - '.github/pr398-reconcile-trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch updated main and bundle repository
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          mkdir -p artifacts
          git bundle create artifacts/pr398-reconcile.bundle --all
          git rev-parse HEAD > artifacts/pr398-head.txt
          git rev-parse refs/remotes/origin/main > artifacts/main-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr398-reconcile-export-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
