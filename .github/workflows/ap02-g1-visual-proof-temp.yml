name: Temporary AP-02 G1 visual-proof refinement

'on':
  push:
    branches:
      - tmp/ap02-g1-visual-proof

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ap02-g1-visual-proof
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: art/ap-02-touchline-art-direction
          path: work
          fetch-depth: 0
      - name: Apply G1 visual evidence requirement
        run: python3 helper/tools/ap02-g1-visual-proof-temp.py
      - name: Commit and push
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/art/art-direction-v1.md
          git commit -m "Require visual regression evidence for AP-02 G1"
          git push origin HEAD:art/ap-02-touchline-art-direction
