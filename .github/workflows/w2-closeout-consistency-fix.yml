name: Repair W2 closeout document consistency

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w2-closeout-consistency-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          fetch-depth: 0

      - name: Repair canonical version row and maintained pointers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backlog = Path('docs/tracking/match-engine-wiring-backlog.md')
          text = backlog.read_text(encoding='utf-8')
          marker = '| 1.19 | 2026-09-15 | — |'
          if '| 1.20 | 2026-09-16 | — |' not in text:
              if marker not in text:
                  raise SystemExit('v1.19 version-history anchor not found')
              row = ('| 1.20 | 2026-09-16 | — | **Post-W6 paired-control closeout.** '
                     'Same-head/same-seed run `35096793576` validates armed `0.983/0.983`, `0.985/0.985` with clean exits against a disarmed negative control `0.530/0.530`, `0.979/0.979` with expected non-zero exits; exact artifacts and hashes are archived under `docs/tracking/evidence/w2/`. Production W2 remains disabled pending the separate activation change; ten tackle-outcome `[GT]`s remain uncalibrated; T-DA-DET-005 remains inactive. |\n')
              text = text.replace(marker, row + marker, 1)
              backlog.write_text(text, encoding='utf-8')

          target = 'match-engine-wiring-backlog.md'
          paths = [
              Path('docs/tracking/open-issues.md'),
              Path('docs/tracking/CHANGELOG.md'),
              Path('docs/tracking/file-manifest.md'),
          ]
          replacements = (
              ('now v1.18', 'now v1.20'),
              ('now **v1.18**', 'now **v1.20**'),
              ('since advanced to **v1.18**', 'since advanced to **v1.20**'),
              ('since advanced to v1.18', 'since advanced to v1.20'),
              ('*(since v1.18)*', '*(since v1.20)*'),
              ('*(since **v1.18**)*', '*(since **v1.20**)*'),
              ('(since v1.18)', '(since v1.20)'),
              ('(since **v1.18**)', '(since **v1.20**)'),
          )
          for path in paths:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              for line in lines:
                  if target in line:
                      for old, new in replacements:
                          line = line.replace(old, new)
                      if 'AUDIT / EXECUTION TRACKER' in line:
                          line = line.replace('**v1.18, Sep 15, 2026**', '**v1.20, Sep 16, 2026**')
                  out.append(line)
              path.write_text(''.join(out), encoding='utf-8')
          PY

      - name: Verify documentation consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/doc-consistency-check.py --repo .
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/match-engine-wiring-backlog.md docs/tracking/open-issues.md docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git diff --cached --quiet && exit 0
          git commit -m "Repair W2 closeout version pointers"
          git push origin HEAD:wiring/w2-post-w6-closeout
