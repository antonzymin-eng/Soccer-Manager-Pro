name: Localization L1 closeout inspect

on:
  push:
    branches:
      - localization/l1-core-contracts
    paths:
      - .github/workflows/localization-l1-closeout-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current main closeout surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo '=== SPEC ERROR HEADER ==='
          head -n 45 docs/tracking/spec-error-log.md
          echo '=== ERR-049 INDEX/BODY ==='
          grep -n -A 24 -B 8 'ERR-049-002' docs/tracking/spec-error-log.md | head -n 220 || true
          echo '=== ERR-049-003 ==='
          grep -n -A 24 -B 8 'ERR-049-003' docs/tracking/spec-error-log.md | head -n 220 || true
          echo '=== ERR-049-004 ==='
          grep -n -A 24 -B 8 'ERR-049-004' docs/tracking/spec-error-log.md | head -n 220 || true
          echo '=== ERR-049-005 ==='
          grep -n -A 24 -B 8 'ERR-049-005' docs/tracking/spec-error-log.md | head -n 220 || true
          echo '=== SPEC ERROR HISTORY TAIL ==='
          tail -n 35 docs/tracking/spec-error-log.md
          echo '=== CHANGELOG SRC VERSION HISTORY HEADER ==='
          grep -n -A 14 -B 3 '^## VERSION HISTORY\|^## Version History\|^| Version | Date' docs/tracking/CHANGELOG-src.md | head -n 80 || true
          echo '=== OPEN ISSUE AUDIO ==='
          grep -n -A 2 -B 1 '^\- \*\*Audio & Sound Design' docs/tracking/open-issues.md || true
          echo '=== OPEN ISSUE LOCALIZATION ==='
          grep -n -A 12 -B 4 -i '^\- \*\*Localization\|localization #49' docs/tracking/open-issues.md | head -n 140 || true
          echo '=== PROJECT REFERENCE OPEN INDEX ==='
          grep -n -A 40 -B 4 'OPEN ISSUES\|Open issues' docs/agent-guides/project-reference.md | head -n 160 || true
