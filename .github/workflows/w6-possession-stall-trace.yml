name: W6 possession stall trace

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w6-possession-stall-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout trace driver
        uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          path: driver
          fetch-depth: 1

      - name: Checkout exact post-W6 production head
        uses: actions/checkout@v4
        with:
          ref: e4335f7ff059deb483b1aaa534f2190fd3762008
          path: repo
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply measurement-only stall trace
        shell: bash
        run: |
          set -euo pipefail
          OUT="repo/artifacts/w6-possession-stall-trace"
          mkdir -p "${OUT}/trx"
          python3 driver/tools/w2_inposs_stall_trace_apply.py repo
          git -C repo diff -- src/match-engine/tests/MatchEngineInPossGateScenarios.cs > "${OUT}/measurement-only.patch"
          cat > "${OUT}/provenance.txt" <<EOF
          Production head: e4335f7ff059deb483b1aaa534f2190fd3762008
          Mode: shipping-disarmed; TackleContactRadiusM remains 0.
          Seed: 0x0F1E2D3C4B5A6978.
          Sampling: every 6 physics ticks = 0.1 s across the whole pitch.
          Long no-possession-signal threshold: 300 samples = 30.0 s.
          Signal: PossessingAgentId >= 0 OR pass-in-flight receiver >= 0.
          Trace adds observation only; no production behavior is changed.
          EOF

      - name: Capture state trace
        working-directory: repo
        shell: bash
        run: |
          set -uo pipefail
          OUT="artifacts/w6-possession-stall-trace"
          set +e
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~sim_match_engine_inposs_gate' 2>&1 | tee "${OUT}/gate.txt"
          gate_rc=${PIPESTATUS[0]}
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj --no-build --no-restore --filter 'FullyQualifiedName~sim_match_engine_inposs_gate' --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=w6-possession-stall-trace.trx' --results-directory "${OUT}/trx" 2>&1 | tee "${OUT}/instrument-output.txt"
          test_rc=${PIPESTATUS[0]}
          set -e
          grep -E 'W6_STALL_TRACE(_SUMMARY)? ' "${OUT}/instrument-output.txt"
          printf 'gate_rc=%s\ntest_rc=%s\n' "$gate_rc" "$test_rc" > "${OUT}/exit-status.txt"
          cd "${OUT}"
          sha256sum provenance.txt measurement-only.patch gate.txt instrument-output.txt exit-status.txt trx/w6-possession-stall-trace.trx > SHA256SUMS

      - name: Upload trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-possession-stall-trace-${{ github.run_id }}
          path: repo/artifacts/w6-possession-stall-trace/
          if-no-files-found: error
          retention-days: 90
