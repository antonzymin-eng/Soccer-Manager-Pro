name: Temporary D5 closeout sync

on:
  push:
    branches: [codex/d5-transfers-t0]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d5-transfers-t0
          fetch-depth: 0
      - name: Apply D5 closeout records
        run: python3 tools/_temporary_d5_closeout.py
      - name: Commit closeout records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agent-guides/project-reference.md docs/tracking/data-contract-index.md docs/tracking/CHANGELOG.md docs/tracking/CHANGELOG-src.md
          git diff --cached --check
          git commit -m 'Record #31 T0 landing'
          git push origin HEAD:codex/d5-transfers-t0
