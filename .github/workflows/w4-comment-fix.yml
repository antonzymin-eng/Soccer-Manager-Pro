name: W4 Invariant Comment Fix

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-comment-fix-marker

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
      - name: Correct stale W1/W4 predicate comment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/match-engine/MatchEngine.cs')
          s = p.read_text()
          old = '''                // pipeline. Same pure predicate the DT-emitted SAVE gate uses, so the two cannot drift.
                bool saveArmed = GkHeadingIntentSource.SaveArmed(
'''
          new = '''                // pipeline. W4 preserves this RAW SaveArmed geometry as the shared threat
                // predicate, but deliberately adds live LOS only to DT SAVE availability; applying LOS
                // here would let an unsighted keeper rush at a goal-bound ball.
                bool saveArmed = GkHeadingIntentSource.SaveArmed(
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale predicate comment, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/match-engine/MatchEngine.cs
          git diff --cached --check
          git commit -m "docs(match-engine): align W1 comment with W4 invariant"
          git push origin HEAD:codex/w4-keeper-perception-final
