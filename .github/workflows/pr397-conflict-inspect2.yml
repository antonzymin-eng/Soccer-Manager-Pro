name: PR397 current ledger conflict inspection

on:
  push:
    branches:
      - localization/l1-core-contracts
    paths:
      - .github/workflows/pr397-conflict-inspect2.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          echo "merge_rc=$rc"
          conflicts="$(git diff --name-only --diff-filter=U)"
          printf 'CONFLICTS\n%s\n' "$conflicts"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "===== $path ====="
            python3 - "$path" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          lines = p.read_text(encoding='utf-8').splitlines()
          for i, line in enumerate(lines):
              if not line.startswith('<<<<<<< '):
                  continue
              j = i
              while j < len(lines) and not lines[j].startswith('>>>>>>> '):
                  j += 1
              print(f'--- conflict lines {i+1}-{j+1} ---')
              for k in range(max(0, i-2), min(len(lines), j+3)):
                  print(f'{k+1:06d}: {lines[k]}')
          PY
          done <<< "$conflicts"
          test "$rc" -ne 0
