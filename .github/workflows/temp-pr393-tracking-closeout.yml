name: Temporary PR393 tracking close-out

on:
  push:
    branches: [ui/p5b-lifecycle-owner]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/p5b-lifecycle-owner
          fetch-depth: 0

      - name: Patch tracking records
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p, s): Path(p).write_text(s, encoding='utf-8')

          def add_version_row(text, heading_pattern, version, date, note):
              h = re.search(heading_pattern, text, re.I | re.M)
              if not h:
                  raise SystemExit(f'version heading missing: {heading_pattern}')
              tail = text[h.end():]
              m = re.search(r'(?m)^\|\s*Version\s*\|.*$', tail)
              if not m:
                  raise SystemExit('version-table header missing')
              header_start = h.end() + m.start()
              header_end = h.end() + m.end()
              header = text[header_start:header_end]
              cols = [c.strip().lower() for c in header.strip().strip('|').split('|')]
              vals = []
              for c in cols:
                  if c == 'version': vals.append(version)
                  elif c == 'date': vals.append(date)
                  elif c == 'author': vals.append('—')
                  elif c in ('notes', 'note', 'change', 'changes', 'description'): vals.append(note)
                  else: vals.append(note if not vals else '')
              row = '| ' + ' | '.join(vals) + ' |'
              nl = text.find('\n', header_end)
              if nl < 0: nl = header_end
              next_end = text.find('\n', nl + 1)
              if next_end < 0: next_end = len(text)
              next_line = text[nl + 1:next_end]
              delimiter = bool(re.fullmatch(r'\s*\|[\s:|\-]+\|\s*', next_line))
              insert_at = next_end if delimiter else header_end
              return text[:insert_at] + '\n' + row + text[insert_at:]

          # Durable owner decision in the existing UI/client open issue (no active-count change).
          p = 'docs/tracking/open-issues.md'; s = load(p)
          sentinel = 'MatchSessionLifecycle` is the ONE bounded unconsumed prerequisite'
          if sentinel not in s:
              marker = '- **Approval tags —'
              i = s.find(marker)
              if i < 0: raise SystemExit('open-issues UI-entry tail anchor missing')
              rec = (
                  '**UPDATE September 11, 2026 — OWNER-APPROVED bounded P5b prerequisite.** '
                  '`MatchSessionLifecycle` is the ONE bounded unconsumed prerequisite permitted before UX Gate I authorizes the Unity shell binding. '
                  'The concrete consumer is already named by closed PR #361: the Unity `Attach(MatchSession)` / shell binding that replaces `MatchClientBehaviour`\'s internal demo-session ownership. '
                  '**Constraint:** no second unconsumed lifecycle/UI prerequisite may land before `MatchSessionLifecycle` is consumed by that authorized binding. '
                  'This is a live remainder, not a precedent for consumer-less surfaces: keep this record active until the binding consumes the type, then archive it through the normal resolved-issue path. '
                  'The project owner approved this exact bounded exception on September 11, 2026 after review of PR #393.\n\n'
              )
              s = s[:i] + rec + s[i:]
          old = '`interactive-unity-client-design.md` §5-P5a resolution / v0.17, now v0.21'
          new = '`interactive-unity-client-design.md` §5-P5a resolution / v0.17, now v0.22'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('open-issues design-version citation anchor missing')
          save(p, s)

          # Canonical file inventory.
          p = 'docs/tracking/file-manifest.md'; s = load(p)
          if 'PR #393 P5b lifecycle prerequisite' not in s:
              title = '# File Manifest (Post-Migration Baseline)\n\n'
              if not s.startswith(title): raise SystemExit('manifest title anchor changed')
              rest = s[len(title):]
              if not rest.startswith('**Last Updated:**'): raise SystemExit('manifest newest entry missing')
              rest = rest.replace('**Last Updated:**', '**Last Updated (prior):**', 1)
              head = (
                  '**Last Updated:** September 11, 2026 — **PR #393 P5b lifecycle prerequisite: host-free repeated-match session ownership lands as one owner-approved bounded, deliberately unconsumed prerequisite.**\n\n'
                  '**NEW (4):** `src/match-client-core/MatchSessionLifecycle.cs` + `.meta`, and `src/match-client-core/tests/MatchSessionLifecycleTests.cs` + `.meta`. '
                  '**Modified tracking:** `docs/tracking/interactive-unity-client-design.md`, `docs/tracking/open-issues.md`, `docs/tracking/path-to-playable-roadmap.md`, `docs/tracking/CHANGELOG-src.md`, and this manifest. '
                  'The lifecycle remains unconsumed until the UX-Gate-I-authorized Unity `Attach(MatchSession)` / shell binding; owner decision: no second unconsumed lifecycle/UI prerequisite may land before it is consumed. '
                  'No new assembly/dependency and no simulation, RNG, schema, save-format or navigation-graph change. Gate result is not predicted here; current-head CI is authoritative.\n\n'
              )
              s = title + head + rest
              if '| `MatchSessionLifecycle.cs` |' not in s:
                  m = re.search(r'(?m)^\| `MatchSession\.cs` \|.*\n', s)
                  if not m: raise SystemExit('MatchSession manifest row missing')
                  row = '| `MatchSessionLifecycle.cs` | **P5b prerequisite (Sep 11, 2026)** — host-free serial owner above single-match `MatchSession`; fresh not-started replacement, predecessor Stop-before-publish, explicit clear, chosen non-revocation of stale never-started raw references. Owner-approved as exactly one bounded unconsumed prerequisite until the Gate-I-authorized Unity binding consumes it. |\n'
                  s = s[:m.end()] + row + s[m.end():]
              if '| `tests/MatchSessionLifecycleTests.cs` |' not in s:
                  m = re.search(r'(?m)^\| `tests/MatchSessionTests\.cs` \|.*\n', s)
                  if not m:
                      sec = s.find('### `src/match-client-core/`')
                      end = s.find('\n### `src/', sec + 1)
                      mm = re.search(r'(?m)^\| `tests/.*\n', s[sec:end if end > 0 else len(s)])
                      if not mm: raise SystemExit('match-client-core test-row anchor missing')
                      pos = sec + mm.start()
                  else:
                      pos = m.end()
                  row = '| `tests/MatchSessionLifecycleTests.cs` | **P5b prerequisite** — eight host-free lifecycle locks: empty/current state, null refusal, fresh repeat-match composition, chosen stale-never-started-reference boundary, running predecessor shutdown and idempotent teardown. |\n'
                  s = s[:pos] + row + s[pos:]
              save(p, s)

          # Source history authority for src/.
          p = 'docs/tracking/CHANGELOG-src.md'; s = load(p)
          if 'v2.133 — **P5b repeated-match lifecycle prerequisite' not in s:
              marker = '## Header chain\n\n'; i = s.find(marker)
              if i < 0: raise SystemExit('CHANGELOG-src header chain missing')
              pos = i + len(marker)
              if not s.startswith('> **Last Updated:**', pos): raise SystemExit('CHANGELOG-src newest entry missing')
              s = s[:pos] + s[pos:].replace('> **Last Updated:**', '> **Last Updated (prior):**', 1)
              entry = (
                  '> **Last Updated:** September 11, 2026 (v2.133 — **P5b repeated-match lifecycle prerequisite.** '
                  'New `src/match-client-core/MatchSessionLifecycle.cs` + meta and `tests/MatchSessionLifecycleTests.cs` + meta; eight locks. '
                  'Owner decision: exactly one bounded deliberately-unconsumed prerequisite; no second unconsumed lifecycle/UI prerequisite may land before the Gate-I-authorized Unity `Attach(MatchSession)` / shell binding consumes it. '
                  'No new assembly/dependency, RNG, schema, save-format, simulation or navigation-graph change. Current-head CI owns the gate verdict.)\n>\n'
              )
              s = s[:pos] + entry + s[pos:]
              s = add_version_row(s, r'^##\s+VERSION HISTORY\s*$', '2.133', 'September 11, 2026', 'P5b host-free repeated-match `MatchSessionLifecycle` prerequisite + eight locks; owner-approved as the one bounded unconsumed prerequisite until the Gate-I-authorized Unity binding consumes it.')
              save(p, s)

          # P5b owning design record.
          p = 'docs/tracking/interactive-unity-client-design.md'; s = load(p)
          if 'P5b prerequisite landed September 11, 2026' not in s:
              anchor = '#### P5b — Unity UGUI binding (host, cert-verified)\n'; i = s.find(anchor)
              if i < 0: raise SystemExit('P5b section anchor missing')
              pos = i + len(anchor)
              note = (
                  '\n**P5b prerequisite landed September 11, 2026 — deliberately unconsumed, owner-bounded.** '
                  '`MatchSessionLifecycle` now exists in gate-compiled `match-client-core` as the serial owner above single-match `MatchSession`: it constructs a fresh not-yet-started replacement, stops a running predecessor before publishing the replacement, and provides explicit teardown. '
                  'It is intentionally not consumed yet because its concrete consumer is the Gate-I-authorized Unity `Attach(MatchSession)` / shell binding identified by PR #361. '
                  'Owner decision: exactly this one consumer-less prerequisite is allowed; **no second unconsumed lifecycle/UI prerequisite may land before this one is consumed**. '
                  'The never-started predecessor boundary is chosen rather than accidental: `Stop()` is a no-op before paced playback starts, so lifecycle selection does not revoke a caller-held stale raw reference; the eventual Unity binding must atomically replace its held session and never continue using the predecessor. '
                  'Eight host-free tests lock the lifecycle surface. This does not make P5b complete and does not authorize the UGUI binding ahead of UX Gate I.\n'
              )
              s = s[:pos] + note + s[pos:]
              s = add_version_row(s, r'^##\s+Version History\s*$', '0.22', '2026-09-11', '**P5b prerequisite:** `MatchSessionLifecycle` + eight host-free tests landed. Owner approves exactly one bounded deliberately-unconsumed prerequisite; no second unconsumed lifecycle/UI prerequisite may land before the Gate-I-authorized `Attach(MatchSession)` / shell binding consumes it. Chosen stale-never-started-reference boundary and Stop/direct-drive limits recorded; P5b remains open.')
              save(p, s)

          # Current-state roadmap citation follows the design supplement version bump.
          p = 'docs/tracking/path-to-playable-roadmap.md'; s = load(p)
          old = '`interactive-unity-client-design.md` §5-P5a / v0.17–v0.18, now v0.21'
          new = '`interactive-unity-client-design.md` §5-P5a / v0.17–v0.18, now v0.22'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('roadmap design-version citation anchor missing')
          save(p, s)
          PY

          python3 tools/recurring-defect-lint.py --repo .
          python3 tools/doc-consistency-check.py --repo .

      - name: Commit close-out and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-pr393-tracking-closeout.yml
          git add docs/tracking/open-issues.md docs/tracking/file-manifest.md docs/tracking/CHANGELOG-src.md docs/tracking/interactive-unity-client-design.md docs/tracking/path-to-playable-roadmap.md
          git commit -m "docs(ui): close P5b lifecycle tracking"
          git push origin HEAD:ui/p5b-lifecycle-owner
