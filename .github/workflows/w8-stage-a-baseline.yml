name: W8 Stage A pinned baseline

# One-shot measurement driver. The source checkout is pinned to the merged A commit;
# the triggering branch changes only this workflow and never substitutes gameplay code.
on:
  push:
    branches:
      - measure/w8-stage-a-baseline

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        instrument: [w8-stage-a, foul-rate]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen merged Stage A
        uses: actions/checkout@v4
        with:
          ref: b06595fbd409396c3ebad445cecd2b215b8e9e2a

      - name: Verify measured code identity
        run: |
          test "$(git rev-parse HEAD)" = "b06595fbd409396c3ebad445cecd2b215b8e9e2a"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve canonical instrument
        env:
          INSTRUMENT: ${{ matrix.instrument }}
        run: |
          set -euo pipefail
          python3 tools/dotnet-ci/measurement_catalog.py validate --repo .
          python3 tools/dotnet-ci/measurement_catalog.py resolve \
            "$INSTRUMENT" --repo . --github-env "$GITHUB_ENV"

      - name: Run gate and proved full-match measurement
        run: |
          set -euo pipefail
          mkdir -p artifacts/measurements/trx
          OUT="artifacts/measurements/measurement.txt"
          MEASURE_OUT="artifacts/measurements/instrument-output.txt"
          RESULTS="artifacts/measurements/trx"
          RUNSETTINGS="artifacts/measurements/measurement.runsettings"
          cat > "$RUNSETTINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <TreatNoTestsAsError>true</TreatNoTestsAsError>
            </RunConfiguration>
          </RunSettings>
          XML
          {
            echo "# W8 Stage A frozen baseline"
            echo "# measured source commit: $(git rev-parse HEAD)"
            echo "# workflow driver commit: $GITHUB_SHA"
            echo "# run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "# instrument: $MEASUREMENT_INSTRUMENT"
            echo "# env: $MEASUREMENT_ENV"
            echo "# filter: $MEASUREMENT_FILTER"
            echo "# project: $MEASUREMENT_PROJECT"
            echo "# reason: preregistered W8 Stage A six-seed baseline"
          } > "$OUT"
          env -u "$MEASUREMENT_ENV" bash tools/dotnet-ci/run-gate.sh \
            --test-filter "$MEASUREMENT_FILTER" 2>&1 | tee -a "$OUT"
          echo "=== Proved measurement ===" | tee -a "$OUT"
          env "$MEASUREMENT_ENV=1" dotnet test "$MEASUREMENT_PROJECT" \
            --no-build --no-restore --filter "$MEASUREMENT_FILTER" \
            --settings "$RUNSETTINGS" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=measurement.trx" \
            --results-directory "$RESULTS" 2>&1 | tee "$MEASURE_OUT" | tee -a "$OUT"
          python3 tools/dotnet-ci/measurement_catalog.py verify-run \
            "$MEASUREMENT_INSTRUMENT" --trx-dir "$RESULTS" --output "$MEASURE_OUT" | tee -a "$OUT"

      - name: Preserve measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8-stage-a-${{ matrix.instrument }}-${{ github.run_id }}
          path: artifacts/measurements/
          if-no-files-found: warn
          retention-days: 90
