name: W2 post-W6 tracking closeout patch

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w2-closeout-doc-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          fetch-depth: 0

      - name: Apply authoritative tracking corrections
        run: python3 tools/w2_closeout_patch.py

      - name: Commit tracking closeout and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/w2-closeout-doc-patch.yml tools/w2_closeout_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/tracking/match-engine-wiring-backlog.md docs/tracking/tackle-wiring-design.md docs/tracking/CHANGELOG.md docs/tracking/w12-preregistration-reconciliation.md
          git commit -m "docs(w2): record post-W6 blocker clearance"
          git push origin HEAD:wiring/w2-post-w6-closeout
