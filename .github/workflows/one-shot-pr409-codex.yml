name: one-shot-pr409-codex

on:
  push:
    branches:
      - docs/w4-tracking-recovery

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/w4-tracking-recovery
          fetch-depth: 0
      - name: Apply Codex tracking correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/tracking/open-issues.md')
          text = path.read_text()

          old_head = 'Match-engine wiring backlog — W1, C1 and W2 BUILT-BUT-DISABLED; 8 built subsystems (W3–W10) still have no production caller, and the `[GT]` freeze (KD-W1) that follows'
          new_head = 'Match-engine wiring backlog — W1, C1 and W2 BUILT-BUT-DISABLED; 7 remaining backlog items (W3, W5–W10) still need production wiring/integration, and the `[GT]` freeze (KD-W1) that follows'
          if text.count(old_head) != 1:
              raise SystemExit(f'expected exactly one headline match, found {text.count(old_head)}')
          text = text.replace(old_head, new_head, 1)

          old_next = '**Next in sequence: W4** (keeper perception), **then W12** (the gate-firing instrument).'
          new_next = '**✅ W4 LANDED September 13, 2026 (PR #403).** Keeper perception is now wired; the close-out is recorded in `match-engine-wiring-backlog.md` v1.15. **Next in sequence: W12** (the gate-firing instrument).'
          if text.count(old_next) != 1:
              raise SystemExit(f'expected exactly one next-step match, found {text.count(old_next)}')
          text = text.replace(old_next, new_next, 1)

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-pr409-codex.yml
          python3 tools/doc-consistency-check.py --repo .
          git diff --check
      - name: Commit correction and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracking/open-issues.md .github/workflows/one-shot-pr409-codex.yml
          git commit -m 'docs(tracking): close W4 open-issues drift'
          git push origin HEAD:docs/w4-tracking-recovery
