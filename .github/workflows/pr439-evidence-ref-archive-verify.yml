name: PR439 evidence-ref archive verification

on:
  push:
    branches:
      - ops/pr439-evidence-archive-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PR439 evidence archive against live refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch live PR439 evidence refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin             '+refs/heads/evidence/pr439-*:refs/remotes/origin/evidence/pr439-*'

      - name: Verify archive and live ref history
        run: |
          python3 tools/dotnet-ci/check_pr439_evidence_refs.py             --repo .             --mode all             --main-ref refs/remotes/origin/main
