name: W6 possession stall ablation

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w6-possession-stall-ablation.yml

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant:
          - current
          - gk-no-kick-release
          - gk-legacy
          - outfield-legacy
          - all-legacy

    steps:
      - name: Checkout measurement drivers
        uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          path: driver
          fetch-depth: 1

      - name: Checkout exact post-W6 production head
        uses: actions/checkout@v4
        with:
          ref: e4335f7ff059deb483b1aaa534f2190fd3762008
          path: repo
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply observation transform and ablation
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          OUT="repo/artifacts/w6-ablation-${VARIANT}"
          mkdir -p "${OUT}/trx"
          python3 driver/tools/w2_post_w6_inposs_apply.py repo disarmed
          python3 driver/tools/w6_stall_ablation_apply.py repo "${VARIANT}"
          git -C repo diff -- src/match-engine/MatchEngine.cs src/match-engine/tests/MatchEngineInPossGateScenarios.cs > "${OUT}/measurement-only.patch"
          cat > "${OUT}/provenance.txt" <<EOF
          Production head: e4335f7ff059deb483b1aaa534f2190fd3762008
          Variant: ${VARIANT}
          Shipping W2 remains disarmed; no tackle arm is injected.
          Corpus: failing seed 0x0F1E2D3C4B5A6978 only.
          Possession bound remains strict > 0.70; non-vacuity floor lowered only for one-seed probe.
          All source changes are measurement-only ablations in the Actions workspace.
          EOF

      - name: Run failing-seed scenario
        working-directory: repo
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -uo pipefail
          OUT="artifacts/w6-ablation-${VARIANT}"
          set +e
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~sim_match_engine_inposs_gate' 2>&1 | tee "${OUT}/gate.txt"
          gate_rc=${PIPESTATUS[0]}
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj --no-build --no-restore --filter 'FullyQualifiedName~sim_match_engine_inposs_gate' --logger 'console;verbosity=detailed' --logger "trx;LogFileName=w6-ablation-${VARIANT}.trx" --results-directory "${OUT}/trx" 2>&1 | tee "${OUT}/instrument-output.txt"
          test_rc=${PIPESTATUS[0]}
          set -e
          grep -F 'W2_POST_W6_DISARMED_INPOSS seed=0x0F1E2D3C4B5A6978' "${OUT}/instrument-output.txt"
          printf 'gate_rc=%s\ntest_rc=%s\n' "$gate_rc" "$test_rc" > "${OUT}/exit-status.txt"
          cd "${OUT}"
          sha256sum provenance.txt measurement-only.patch gate.txt instrument-output.txt exit-status.txt "trx/w6-ablation-${VARIANT}.trx" > SHA256SUMS

      - name: Upload ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-ablation-${{ matrix.variant }}-${{ github.run_id }}
          path: repo/artifacts/w6-ablation-${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 90
