name: W6 armed InPoss evidence

on:
  push:
    branches:
      - tmp/w6-measure-dispatch-20260914

permissions:
  contents: read

jobs:
  armed-inposs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout measurement driver
        uses: actions/checkout@v4
        with:
          ref: tmp/w6-measure-dispatch-20260914
          path: driver
          fetch-depth: 1

      - name: Checkout exact W6 production head
        uses: actions/checkout@v4
        with:
          ref: 3ccfbe9cfc978c83d3f482859204a1060ade7c89
          path: repo
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Arm governed W2 evidence harness only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts/w6-armed-inposs/trx
          python3 driver/tools/w6_armed_inposs_apply.py repo
          git -C repo diff -- src/match-engine/tests/MatchEngineInPossGateScenarios.cs > repo/artifacts/w6-armed-inposs/measurement-only.patch
          cat > repo/artifacts/w6-armed-inposs/provenance.txt <<'EOF'
          W6 production head: 3ccfbe9cfc978c83d3f482859204a1060ade7c89
          Shipping TackleContactRadiusM remains 0 in the W6 branch.
          Measurement-only arm: TestOnly_ArmTackleChallenge(LooseBallPickupRadiusM = 1.0 m).
          Governed seeds: 0x0F1E2D3C4B5A6978, 0x1A2B3C4D5E6F7081.
          Governed bound: every seed, both mirrored views, > 0.70.
          EOF

      - name: Run governed InPoss scenario
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~sim_match_engine_inposs_gate' 2>&1 | tee artifacts/w6-armed-inposs/gate.txt
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj --no-build --no-restore --filter 'FullyQualifiedName~sim_match_engine_inposs_gate' --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=w6-armed-inposs.trx' --results-directory artifacts/w6-armed-inposs/trx 2>&1 | tee artifacts/w6-armed-inposs/instrument-output.txt
          grep -F 'W6_ARMED_INPOSS seed=0x0F1E2D3C4B5A6978' artifacts/w6-armed-inposs/instrument-output.txt
          grep -F 'W6_ARMED_INPOSS seed=0x1A2B3C4D5E6F7081' artifacts/w6-armed-inposs/instrument-output.txt
          cd artifacts/w6-armed-inposs
          sha256sum provenance.txt measurement-only.patch gate.txt instrument-output.txt trx/w6-armed-inposs.trx > SHA256SUMS

      - name: Upload armed W2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-armed-inposs-${{ github.run_id }}
          path: repo/artifacts/w6-armed-inposs/
          if-no-files-found: warn
          retention-days: 90
