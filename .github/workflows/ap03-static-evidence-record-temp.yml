name: Temporary AP-03 static evidence recorder

'on':
  push:
    branches:
      - tmp/ap03-static-evidence-record

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ap03-static-evidence-record
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: art/ap-03-technical-recipe-proof
          path: work
      - name: Record static proof evidence
        run: python3 helper/tools/ap03-static-evidence-record-temp.py
      - name: Commit and push
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/art/art-technical-recipe-v1.md
          git commit -m "Record AP-03 static proof evidence"
          git push origin HEAD:art/ap-03-technical-recipe-proof
