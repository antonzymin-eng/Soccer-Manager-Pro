name: PR439 one-shot superseded archive cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr439-superseded-archive-cleanup.yml'

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

jobs:
  delete-superseded-archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require independent certified post-delete topology
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/evidence/pr439-*:refs/remotes/origin/evidence/pr439-*'
          git switch --detach refs/remotes/origin/main
          python3 tools/dotnet-ci/check_pr439_evidence_refs.py \
            --repo . --mode all --main-ref refs/remotes/origin/main \
            --live-state post-delete --require-authorized --verify-actions-api

      - name: 'Remove only the closed PR #446 archive at its recorded head'
        run: |
          set -euo pipefail
          expected=d8f61356ba5b45debe04371343a5e2715d493ede
          ref=refs/heads/archive/pr439-evidence-20260923
          actual="$(git ls-remote origin "$ref")"
          test "$actual" = "$expected$(printf '\t')$ref"
          git -c core.hooksPath=/dev/null push --dry-run --atomic \
            --force-with-lease="$ref:$expected" origin ":$ref"
          git -c core.hooksPath=/dev/null push --atomic \
            --force-with-lease="$ref:$expected" origin ":$ref"
          test -z "$(git ls-remote origin "$ref")"
          echo 'Closed PR #446 archive branch removed at its recorded head.'
