name: W2 consistency repair

on:
  push:
    branches:
      - wiring/w2-production-activation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-production-activation
          fetch-depth: 0
      - name: Advance live backlog-version pointers
        shell: bash
        run: |
          python3 .github/w2_consistency_repair.py
          python3 tools/doc-consistency-check.py --repo .
          rm -f .github/w2_consistency_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: advance W2 backlog pointers to v1.21"
          git push origin HEAD:wiring/w2-production-activation
