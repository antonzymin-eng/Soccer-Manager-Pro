name: W4 One-Shot Runner

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-run-marker

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
          fetch-depth: 0
      - name: Apply W4 patch
        run: python3 .github/w4_apply.py
      - name: Commit W4 consumer wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "feat: complete W4 keeper perception consumers"
          git push origin HEAD:codex/w4-keeper-perception-final
