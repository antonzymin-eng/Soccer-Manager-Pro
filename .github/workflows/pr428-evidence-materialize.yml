name: PR428 evidence materialize

on:
  push:
    branches:
      - fix/gate-owner-held-lifecycle

permissions:
  contents: write

jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Download pinned PR420 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/pr420-source.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10578621101/zip"

      - name: Materialize durable evidence
        run: |
          set -euo pipefail
          evidence='docs/tracking/evidence/pr420-owner-held-isolation'
          python3 tools/dotnet-ci/pr420-evidence.py bootstrap \
            --source /tmp/pr420-source.zip \
            --output-dir "$evidence"
          python3 tools/dotnet-ci/pr420-evidence.py verify --output-dir "$evidence"
          rm -f "$evidence/pr-functional-executed-tests-10578621101.zip"
          sed -i '\|docs/tracking/evidence/pr420-owner-held-isolation/pr-functional-executed-tests-10578621101.zip filter=lfs diff=lfs merge=lfs -text|d' .gitattributes
          grep -qxF '*.xz -text' .gitattributes || printf '\n*.xz       -text\n' >> .gitattributes

      - name: Commit materialized payload
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes tools/dotnet-ci/pr420-evidence.py docs/tracking/evidence/pr420-owner-held-isolation
          git commit -m 'test: materialize durable PR420 evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
