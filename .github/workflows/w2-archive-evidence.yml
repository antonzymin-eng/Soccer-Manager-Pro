name: Archive W2 paired evidence

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w2-archive-evidence.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          fetch-depth: 1

      - name: Download exact paired artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/tracking/evidence/w2
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10447545007/zip" \
            -o docs/tracking/evidence/w2/w2-post-w6-armed-35096793576.zip
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10446444977/zip" \
            -o docs/tracking/evidence/w2/w2-post-w6-disarmed-35096793576.zip

      - name: Verify artifact digests and write manifest
        shell: bash
        run: |
          set -euo pipefail
          cd docs/tracking/evidence/w2
          echo "5772b980bb2378e4163c7063d0b7c6efde7b5b7704a66e9b0966aa42fc4dcb00  w2-post-w6-armed-35096793576.zip" | sha256sum -c -
          echo "3b6dcd103aed546b03d4c524848fd4909c1b7fe3d16140559d0785fd02c5e9e9  w2-post-w6-disarmed-35096793576.zip" | sha256sum -c -
          sha256sum w2-post-w6-armed-35096793576.zip w2-post-w6-disarmed-35096793576.zip > artifact-SHA256SUMS

      - name: Commit immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/evidence/w2/
          git diff --cached --quiet && exit 0
          git commit -m "Archive W2 post-W6 paired evidence"
          git push origin HEAD:wiring/w2-post-w6-closeout
