name: Ball Physics v2.10 Rolling characterization

on:
  push:
    branches:
      - evidence/v210-rolling-characterization

permissions:
  contents: read

concurrency:
  group: v210-rolling-characterization-${{ github.sha }}
  cancel-in-progress: false

jobs:
  characterize:
    name: ${{ matrix.mode }} — ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - mode: 'v210'
            seed: '0x0F1E2D3C4B5A6978'
            label: '0F1E2D3C4B5A6978'
          - mode: 'v210'
            seed: '0x00000000D1A6D05E'
            label: '00000000D1A6D05E'
          - mode: 'v210'
            seed: '0x5EED000000000003'
            label: '5EED000000000003'
          - mode: 'v210'
            seed: '0x5EED000000000004'
            label: '5EED000000000004'
          - mode: 'v210'
            seed: '0x00000000D1A6D05F'
            label: '00000000D1A6D05F'
          - mode: 'v210'
            seed: '0x1A2B3C4D5E6F7081'
            label: '1A2B3C4D5E6F7081'
          - mode: 'narrow'
            seed: '0x0F1E2D3C4B5A6978'
            label: '0F1E2D3C4B5A6978'
          - mode: 'narrow'
            seed: '0x00000000D1A6D05E'
            label: '00000000D1A6D05E'
          - mode: 'narrow'
            seed: '0x5EED000000000003'
            label: '5EED000000000003'
          - mode: 'narrow'
            seed: '0x5EED000000000004'
            label: '5EED000000000004'
          - mode: 'narrow'
            seed: '0x00000000D1A6D05F'
            label: '00000000D1A6D05F'
          - mode: 'narrow'
            seed: '0x1A2B3C4D5E6F7081'
            label: '1A2B3C4D5E6F7081'
    env:
      TD_V210_ROLLING_CHARACTERIZATION: '1'
      TD_V210_MODE: ${{ matrix.mode }}
      TD_V210_SEED: ${{ matrix.seed }}
      MODE: ${{ matrix.mode }}
      SEED_LABEL: ${{ matrix.label }}
      BASE_SHA: 33cf81443e2c5ab43d7a1befcb22e6c0cfea7289
    steps:
      - name: Checkout frozen evidence head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply narrow counterfactual
        if: matrix.mode == 'narrow'
        run: |
          set -euo pipefail
          python3 .github/evidence/apply-v210-narrow-rolling-counterfactual.py
          mapfile -t changed < <(git diff --name-only)
          printf 'counterfactual changed paths:\n%s\n' "${changed[*]}"
          if [ "${#changed[@]}" -ne 2 ] ||
             [[ ! " ${changed[*]} " =~ " src/ball-physics/BallPhysicsCore.cs " ]] ||
             [[ ! " ${changed[*]} " =~ " src/ball-physics/BallStateMachine.cs " ]]; then
            echo "ERROR: narrow counterfactual modified an unexpected path set" >&2
            exit 2
          fi
          git diff --check

      - name: Record provenance
        run: |
          set -euo pipefail
          ROOT="artifacts/v210-rolling/$MODE/$SEED_LABEL"
          mkdir -p "$ROOT"
          {
            echo "base_sha=$BASE_SHA"
            echo "evidence_head_sha=$GITHUB_SHA"
            echo "mode=$MODE"
            echo "seed=$TD_V210_SEED"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "preserved_counterfactual_source=bb501a2128f9efbef5e98bffadb0d98214493e78"
          } > "$ROOT/provenance.txt"
          if [ "$MODE" = narrow ]; then
            git diff -- src/ball-physics/BallPhysicsCore.cs src/ball-physics/BallStateMachine.cs               > "$ROOT/narrow-counterfactual.patch"
          else
            : > "$ROOT/narrow-counterfactual.patch"
          fi

      - name: Generate projects and restore
        run: |
          set -euo pipefail
          python3 tools/dotnet-ci/generate_projects.py
          dotnet restore tools/dotnet-ci/TacticalDirector.gen.sln

      - name: Run characterization
        run: |
          set -euo pipefail
          ROOT="artifacts/v210-rolling/$MODE/$SEED_LABEL"
          mkdir -p "$ROOT/trx"
          OUT="$ROOT/output.txt"
          STATUS="$ROOT/exit-status.txt"
          RUNSETTINGS="$ROOT/evidence.runsettings"

          cat > "$RUNSETTINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <TreatNoTestsAsError>true</TreatNoTestsAsError>
            </RunConfiguration>
          </RunSettings>
          XML

          set +e
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj             --no-restore             --filter "FullyQualifiedName~V210RollingCharacterizationTests"             --settings "$RUNSETTINGS"             --logger "console;verbosity=detailed"             --logger "trx;LogFileName=v210-rolling-characterization.trx"             --results-directory "$ROOT/trx" 2>&1 | tee "$OUT"
          test_status="${PIPESTATUS[0]}"
          set -e
          echo "dotnet_test_exit=$test_status" > "$STATUS"

          python3 - "$OUT" "$ROOT/$MODE-$SEED_LABEL.tsv" "$MODE" "$TD_V210_SEED" <<'PY'
          import sys
          from pathlib import Path

          out = Path(sys.argv[1]).read_text(encoding="utf-8")
          target_mode = sys.argv[3]
          target_seed = sys.argv[4]
          rows = []
          for raw in out.splitlines():
              line = raw.strip()
              if line.startswith("V210_ROLLING_RESULT\t"):
                  rows.append(line)
          unique = list(dict.fromkeys(rows))
          if len(unique) != 1:
              raise SystemExit(f"ERROR: expected one unique result row, observed {rows!r}")
          parts = unique[0].split("\t")
          if len(parts) != 47:
              raise SystemExit(f"ERROR: expected 47 result columns including prefix, observed {len(parts)}")
          if parts[1] != target_mode or parts[2] != target_seed:
              raise SystemExit(
                  f"ERROR: result identity mismatch: expected {(target_mode, target_seed)!r}, "
                  f"observed {(parts[1], parts[2])!r}"
              )
          Path(sys.argv[2]).write_text("\t".join(parts[1:]) + "\n", encoding="utf-8")
          PY

          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

      - name: Hash per-arm evidence
        if: always()
        run: |
          set -euo pipefail
          ROOT="artifacts/v210-rolling/$MODE/$SEED_LABEL"
          cd "$ROOT"
          find . -type f ! -name SHA256SUMS -print0             | sort -z             | xargs -0 sha256sum > SHA256SUMS

      - name: Upload per-arm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v210-rolling-${{ matrix.mode }}-${{ matrix.label }}-${{ github.run_id }}
          path: artifacts/v210-rolling/${{ matrix.mode }}/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate v2.10 Rolling characterization
    if: always()
    needs: characterize
    runs-on: ubuntu-latest
    steps:
      - name: Download all arm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v210-rolling-*-${{ github.run_id }}
          path: artifacts/v210-rolling-aggregate/input
          merge-multiple: true

      - name: Verify exact corpus and aggregate
        run: |
          set -euo pipefail
          mkdir -p artifacts/v210-rolling-aggregate/final
          python3 - <<'PY'
          from pathlib import Path

          seeds = [
              "0x0F1E2D3C4B5A6978",
              "0x00000000D1A6D05E",
              "0x5EED000000000003",
              "0x5EED000000000004",
              "0x00000000D1A6D05F",
              "0x1A2B3C4D5E6F7081",
          ]
          expected = [(mode, seed) for mode in ("v210", "narrow") for seed in seeds]
          root = Path("artifacts/v210-rolling-aggregate/input")
          rows = {}
          for path in root.glob("*.tsv"):
              parts = path.read_text(encoding="utf-8").strip().split("\t")
              if len(parts) != 46:
                  raise SystemExit(f"ERROR: malformed row {path}: {len(parts)} columns")
              key = (parts[0], parts[1])
              if key in rows:
                  raise SystemExit(f"ERROR: duplicate result identity {key!r}")
              rows[key] = parts
          if set(rows) != set(expected) or len(rows) != len(expected):
              raise SystemExit(
                  f"ERROR: result corpus mismatch; expected={expected!r} observed={sorted(rows)!r}"
              )

          header = [
              "mode","seed","erEpisodes","erTicks","erMovingEpisodes","erSlowEpisodes",
              "erMovingTicks","erSlowTicks","erPostAirborne","erPostRolling","erPostOther",
              "rollingPhysicsEntries","rollingHeightCrosses","movingRollingHeightCrosses",
              "movingCrossPostAirborne","movingCrossPostRolling","movingCrossPostOther",
              "erMeanZ","erMeanSpeed","erMaxZ","erMaxSpeed","distanceProxyM","meanZ","maxZ",
              "meanSpeed","maxSpeed","stateStationary","stateRolling","stateAirborne",
              "stateBouncing","stateControlled","stateOut","finalThirdTicks","possessedTicks",
              "possessionChanges","homeGoals","awayGoals","actionPass","actionShoot",
              "actionDribble","actionHold","actionMove","actionPress","actionIntercept",
              "actionSave","trajectoryHash"
          ]
          final = Path("artifacts/v210-rolling-aggregate/final/all-results.tsv")
          final.write_text(
              "\t".join(header) + "\n"
              + "".join("\t".join(rows[key]) + "\n" for key in expected),
              encoding="utf-8",
          )

          delta_header = [
              "seed","trajectoryHashEqual","v210ErEpisodes","v210MovingEpisodes",
              "v210MovingTicks","deltaDistanceProxyM","deltaMeanZ","deltaMeanSpeed",
              "deltaPossessionChanges","deltaGoals","deltaPass","deltaShoot","deltaDribble",
              "deltaHold","deltaMove","deltaPress","deltaIntercept","deltaSave"
          ]
          delta_lines = []
          for seed in seeds:
              a = rows[("v210", seed)]
              b = rows[("narrow", seed)]
              # Numeric indices in row without prefix: see header above.
              f = lambda row, idx: float(row[idx])
              i = lambda row, idx: int(row[idx])
              action_start = 37
              deltas = [i(b, action_start+k) - i(a, action_start+k) for k in range(8)]
              delta_lines.append([
                  seed,
                  str(a[45] == b[45]).lower(),
                  a[2],
                  a[4],
                  a[6],
                  f"{f(b,21)-f(a,21):.6f}",
                  f"{f(b,22)-f(a,22):.6f}",
                  f"{f(b,24)-f(a,24):.6f}",
                  str(i(b,34)-i(a,34)),
                  str((i(b,35)+i(b,36))-(i(a,35)+i(a,36))),
                  *map(str,deltas),
              ])
          Path("artifacts/v210-rolling-aggregate/final/deltas.tsv").write_text(
              "\t".join(delta_header) + "\n"
              + "".join("\t".join(line) + "\n" for line in delta_lines),
              encoding="utf-8",
          )
          PY

      - name: Record aggregate provenance and hashes
        run: |
          set -euo pipefail
          ROOT=artifacts/v210-rolling-aggregate/final
          {
            echo "base_sha=33cf81443e2c5ab43d7a1befcb22e6c0cfea7289"
            echo "evidence_head_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "counterfactual_source=bb501a2128f9efbef5e98bffadb0d98214493e78"
          } > "$ROOT/provenance.txt"
          cd "$ROOT"
          find . -type f ! -name SHA256SUMS -print0             | sort -z             | xargs -0 sha256sum > SHA256SUMS

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v210-rolling-aggregate-${{ github.run_id }}
          path: artifacts/v210-rolling-aggregate/final/
          if-no-files-found: error
          retention-days: 90
