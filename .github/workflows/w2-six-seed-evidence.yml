name: W2 six-seed activation revalidation

on:
  push:
    branches:
      - evidence/w2-six-seed-revalidation

permissions:
  contents: read

concurrency:
  group: w2-six-seed-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: ${{ matrix.mode }} — ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - mode: 'production'
            seed: '0x0F1E2D3C4B5A6978'
            label: '0F1E2D3C4B5A6978'
            floor: '12664'
          - mode: 'production'
            seed: '0x00000000D1A6D05E'
            label: '00000000D1A6D05E'
            floor: '15127'
          - mode: 'production'
            seed: '0x5EED000000000003'
            label: '5EED000000000003'
            floor: '12536'
          - mode: 'production'
            seed: '0x5EED000000000004'
            label: '5EED000000000004'
            floor: '12440'
          - mode: 'production'
            seed: '0x00000000D1A6D05F'
            label: '00000000D1A6D05F'
            floor: '14529'
          - mode: 'production'
            seed: '0x1A2B3C4D5E6F7081'
            label: '1A2B3C4D5E6F7081'
            floor: '13138'
          - mode: 'disarmed'
            seed: '0x0F1E2D3C4B5A6978'
            label: '0F1E2D3C4B5A6978'
            floor: '12664'
          - mode: 'disarmed'
            seed: '0x00000000D1A6D05E'
            label: '00000000D1A6D05E'
            floor: '15127'
          - mode: 'disarmed'
            seed: '0x5EED000000000003'
            label: '5EED000000000003'
            floor: '12536'
          - mode: 'disarmed'
            seed: '0x5EED000000000004'
            label: '5EED000000000004'
            floor: '12440'
          - mode: 'disarmed'
            seed: '0x00000000D1A6D05F'
            label: '00000000D1A6D05F'
            floor: '14529'
          - mode: 'disarmed'
            seed: '0x1A2B3C4D5E6F7081'
            label: '1A2B3C4D5E6F7081'
            floor: '13138'
    env:
      TD_W2_SIX_SEED_MODE: ${{ matrix.mode }}
      TD_W2_SIX_SEED_HEX: ${{ matrix.seed }}
      TD_W2_SIX_SEED_FLOOR: ${{ matrix.floor }}
      EVIDENCE_MODE: ${{ matrix.mode }}
      SEED_LABEL: ${{ matrix.label }}
      PRODUCTION_BASE_SHA: e8207f4c6f4d9d301872da869e3796163b8b26ad
      BASELINE_RUN_ID: '35389373818'
      BASELINE_HEAD_SHA: a1f105c9baf2205877fc6f9852331576daa97b6e
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Record provenance
        run: |
          set -euo pipefail
          ROOT="artifacts/w2-six-seed/$EVIDENCE_MODE/$SEED_LABEL"
          mkdir -p "$ROOT"
          {
            echo "production_base_sha=$PRODUCTION_BASE_SHA"
            echo "evidence_head_sha=$GITHUB_SHA"
            echo "baseline_run_id=$BASELINE_RUN_ID"
            echo "baseline_head_sha=$BASELINE_HEAD_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "mode=$EVIDENCE_MODE"
            echo "seed=$TD_W2_SIX_SEED_HEX"
            echo "floor=$TD_W2_SIX_SEED_FLOOR"
            echo "changed_paths_from_production_base:"
            git diff --name-only "$PRODUCTION_BASE_SHA...HEAD"
          } > "$ROOT/$EVIDENCE_MODE-$SEED_LABEL-provenance.txt"

      - name: Generate projects and restore
        run: |
          set -euo pipefail
          python3 tools/dotnet-ci/generate_projects.py
          dotnet restore tools/dotnet-ci/TacticalDirector.gen.sln

      - name: Run selected W2 evidence arm
        run: |
          set -euo pipefail
          ROOT="artifacts/w2-six-seed/$EVIDENCE_MODE/$SEED_LABEL"
          mkdir -p "$ROOT/trx"
          OUT="$ROOT/result-output.txt"
          STATUS="$ROOT/$EVIDENCE_MODE-$SEED_LABEL-exit-status.txt"
          RUNSETTINGS="$ROOT/evidence.runsettings"

          cat > "$RUNSETTINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <TreatNoTestsAsError>true</TreatNoTestsAsError>
            </RunConfiguration>
          </RunSettings>
          XML

          set +e
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj \
            --no-restore \
            --filter "FullyQualifiedName~W2SixSeedEvidenceTests" \
            --settings "$RUNSETTINGS" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=w2-six-seed-result.trx" \
            --results-directory "$ROOT/trx" 2>&1 | tee "$OUT"
          test_status="${PIPESTATUS[0]}"
          set -e
          echo "dotnet_test_exit=$test_status" > "$STATUS"

          set +e
          python3 - "$OUT" "$ROOT/$EVIDENCE_MODE-$SEED_LABEL.tsv" \
            "$EVIDENCE_MODE" "$TD_W2_SIX_SEED_HEX" "$TD_W2_SIX_SEED_FLOOR" "$test_status" <<'PY'
          import re
          import sys
          from pathlib import Path

          output_path = Path(sys.argv[1])
          tsv_path = Path(sys.argv[2])
          expected_mode = sys.argv[3]
          expected_seed = sys.argv[4]
          expected_floor = int(sys.argv[5])
          test_exit = int(sys.argv[6])
          text = output_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"^\s*W2_SIX_SEED_RESULT"
              r" mode=(production|disarmed)"
              r" seed=(0x[0-9A-F]{16})"
              r" samples=([0-9]+)"
              r" floor=([0-9]+)"
              r" homeShare=([0-9]+\.[0-9]{6})"
              r" awayShare=([0-9]+\.[0-9]{6})"
              r" classification=(PASS|INSUFFICIENT|LOCALIZE)"
              r" won=([0-9]+) loose=([0-9]+) foul=([0-9]+) missed=([0-9]+)\s*$",
              re.MULTILINE,
          )
          rows = pattern.findall(text)
          unique_rows = list(dict.fromkeys(rows))
          if len(unique_rows) != 1:
              raise SystemExit(
                  "ERROR: expected one unique W2 result row; "
                  f"mode={expected_mode} seed={expected_seed} observed={rows!r}"
              )

          row = unique_rows[0]
          mode, seed = row[0], row[1]
          samples, floor = int(row[2]), int(row[3])
          home_share, away_share = float(row[4]), float(row[5])
          classification = row[6]
          won, loose, foul, missed = map(int, row[7:11])

          if mode != expected_mode or seed != expected_seed or floor != expected_floor:
              raise SystemExit(
                  "ERROR: W2 result identity/floor mismatch: "
                  f"expected={(expected_mode, expected_seed, expected_floor)!r} "
                  f"observed={(mode, seed, floor)!r}"
              )
          if samples <= 0 or not (0.0 <= home_share <= 1.0) or not (0.0 <= away_share <= 1.0):
              raise SystemExit(f"ERROR: malformed W2 result values: {row!r}")

          tsv_path.write_text(
              "\t".join([
                  mode,
                  seed,
                  str(samples),
                  str(floor),
                  f"{home_share:.6f}",
                  f"{away_share:.6f}",
                  classification,
                  str(won),
                  str(loose),
                  str(foul),
                  str(missed),
                  str(test_exit),
              ]) + "\n",
              encoding="utf-8",
          )
          PY
          parser_status=$?
          set -e
          if [ "$parser_status" -ne 0 ]; then
            exit "$parser_status"
          fi
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

      - name: Hash retained arm evidence
        if: always()
        run: |
          set -euo pipefail
          ROOT="artifacts/w2-six-seed/$EVIDENCE_MODE/$SEED_LABEL"
          cd "$ROOT"
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Upload selected W2 evidence arm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-six-seed-result-${{ matrix.mode }}-${{ matrix.label }}-${{ github.run_id }}
          path: artifacts/w2-six-seed/${{ matrix.mode }}/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate six-seed W2 result
    if: always()
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: w2-six-seed-result-*-${{ github.run_id }}
          path: artifacts/w2-six-seed-aggregate/input
          merge-multiple: true

      - name: Verify exact result corpus and summarize
        run: |
          set -euo pipefail
          mkdir -p artifacts/w2-six-seed-aggregate/final
          python3 - <<'PY'
          from pathlib import Path

          seeds = [
              ("0x0F1E2D3C4B5A6978", 12664),
              ("0x00000000D1A6D05E", 15127),
              ("0x5EED000000000003", 12536),
              ("0x5EED000000000004", 12440),
              ("0x00000000D1A6D05F", 14529),
              ("0x1A2B3C4D5E6F7081", 13138),
          ]
          expected = [(mode, seed) for mode in ("production", "disarmed") for seed, _ in seeds]
          expected_floors = dict(seeds)
          root = Path("artifacts/w2-six-seed-aggregate/input")
          rows = {}

          for path in sorted(root.glob("*.tsv")):
              parts = path.read_text(encoding="utf-8").strip().split("\t")
              if len(parts) != 12:
                  raise SystemExit(f"ERROR: malformed W2 result TSV {path}: {parts!r}")
              mode, seed = parts[0], parts[1]
              key = (mode, seed)
              if key in rows:
                  raise SystemExit(f"ERROR: duplicate W2 result {key!r}")
              samples, floor = int(parts[2]), int(parts[3])
              home_share, away_share = float(parts[4]), float(parts[5])
              classification = parts[6]
              won, loose, foul, missed, test_exit = map(int, parts[7:12])
              rows[key] = (
                  samples,
                  floor,
                  home_share,
                  away_share,
                  classification,
                  won,
                  loose,
                  foul,
                  missed,
                  test_exit,
              )

          if set(rows) != set(expected) or len(rows) != len(expected):
              raise SystemExit(
                  f"ERROR: result corpus mismatch; expected={expected!r} observed={sorted(rows)!r}"
              )

          for mode, seed in expected:
              row = rows[(mode, seed)]
              if row[1] != expected_floors[seed]:
                  raise SystemExit(
                      f"ERROR: frozen floor drift for {(mode, seed)!r}: {row[1]}"
                  )

          final = Path("artifacts/w2-six-seed-aggregate/final/w2-six-seed-results.tsv")
          final.write_text(
              "mode\tseed\tsamples\tfloor\thomeShare\tawayShare\tclassification"
              "\twon\tloose\tfoul\tmissed\ttestExit\n"
              + "".join(
                  "\t".join([
                      mode,
                      seed,
                      str(rows[(mode, seed)][0]),
                      str(rows[(mode, seed)][1]),
                      f"{rows[(mode, seed)][2]:.6f}",
                      f"{rows[(mode, seed)][3]:.6f}",
                      rows[(mode, seed)][4],
                      str(rows[(mode, seed)][5]),
                      str(rows[(mode, seed)][6]),
                      str(rows[(mode, seed)][7]),
                      str(rows[(mode, seed)][8]),
                      str(rows[(mode, seed)][9]),
                  ]) + "\n"
                  for mode, seed in expected
              ),
              encoding="utf-8",
          )

          production = [rows[("production", seed)] for seed, _ in seeds]
          disarmed = [rows[("disarmed", seed)] for seed, _ in seeds]
          production_all_pass = all(
              row[4] == "PASS" and row[9] == 0 for row in production
          )
          localization_required = any(
              row[4] != "PASS" for row in production
          )
          disarmed_control_integrity = all(
              row[5] + row[6] + row[7] + row[8] == 0 and row[9] == 0
              for row in disarmed
          )

          summary = Path("artifacts/w2-six-seed-aggregate/final/summary.txt")
          summary.write_text(
              f"production_all_pass={str(production_all_pass).lower()}\n"
              f"localization_required={str(localization_required).lower()}\n"
              f"disarmed_control_integrity={str(disarmed_control_integrity).lower()}\n",
              encoding="utf-8",
          )
          PY

      - name: Record aggregate provenance and hashes
        run: |
          set -euo pipefail
          ROOT=artifacts/w2-six-seed-aggregate/final
          {
            echo "production_base_sha=e8207f4c6f4d9d301872da869e3796163b8b26ad"
            echo "baseline_run_id=35389373818"
            echo "baseline_head_sha=a1f105c9baf2205877fc6f9852331576daa97b6e"
            echo "result_head_sha=$GITHUB_SHA"
            echo "result_run_id=$GITHUB_RUN_ID"
            echo "result_run_attempt=$GITHUB_RUN_ATTEMPT"
          } > "$ROOT/provenance.txt"
          cd "$ROOT"
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Upload governing aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: w2-six-seed-result-aggregate-${{ github.run_id }}
          path: artifacts/w2-six-seed-aggregate/final/
          if-no-files-found: error
          retention-days: 90
