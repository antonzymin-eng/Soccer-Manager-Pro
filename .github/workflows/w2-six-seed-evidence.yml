name: W2 six-seed baseline evidence

on:
  push:
    branches:
      - evidence/w2-six-seed-revalidation

permissions:
  contents: read

concurrency:
  # Evidence commits are immutable measurement definitions. Do not let a superseded
  # earlier capture serialize or cancel the corrected exact-head run.
  group: w2-six-seed-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Capture six-seed corrected-baseline denominators
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TD_W2_SIX_SEED_MODE: baseline
      PRODUCTION_BASE_SHA: e8207f4c6f4d9d301872da869e3796163b8b26ad
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Record provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts/w2-six-seed
          {
            echo "production_base_sha=$PRODUCTION_BASE_SHA"
            echo "evidence_head_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "mode=$TD_W2_SIX_SEED_MODE"
            echo "changed_paths_from_production_base:"
            git diff --name-only "$PRODUCTION_BASE_SHA...HEAD"
          } > artifacts/w2-six-seed/provenance.txt

      - name: Generate projects and restore
        run: |
          set -euo pipefail
          python3 tools/dotnet-ci/generate_projects.py
          dotnet restore tools/dotnet-ci/TacticalDirector.gen.sln

      - name: Run six-seed baseline capture
        run: |
          set -euo pipefail
          mkdir -p artifacts/w2-six-seed/trx
          OUT=artifacts/w2-six-seed/baseline-output.txt
          STATUS=artifacts/w2-six-seed/exit-status.txt
          RUNSETTINGS=artifacts/w2-six-seed/evidence.runsettings

          cat > "$RUNSETTINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <TreatNoTestsAsError>true</TreatNoTestsAsError>
            </RunConfiguration>
          </RunSettings>
          XML

          set +e
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj             --no-restore             --filter "FullyQualifiedName~W2SixSeedEvidenceTests"             --settings "$RUNSETTINGS"             --logger "console;verbosity=detailed"             --logger "trx;LogFileName=w2-six-seed-baseline.trx"             --results-directory artifacts/w2-six-seed/trx 2>&1 | tee "$OUT"
          test_status="${PIPESTATUS[0]}"
          set -e
          echo "dotnet_test_exit=$test_status" > "$STATUS"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

          python3 - "$OUT" artifacts/w2-six-seed/baseline-counts.tsv <<'PY'
          import re
          import sys
          from pathlib import Path

          expected = [
              "0x0F1E2D3C4B5A6978",
              "0x00000000D1A6D05E",
              "0x5EED000000000003",
              "0x5EED000000000004",
              "0x00000000D1A6D05F",
              "0x1A2B3C4D5E6F7081",
          ]
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          pattern = re.compile(
              r"^\s*W2_SIX_SEED_BASELINE seed=(0x[0-9A-F]{16}) samples=([0-9]+)\s*$",
              re.MULTILINE,
          )
          rows = pattern.findall(text)
          names = [name for name, _ in rows]
          if names != expected:
              raise SystemExit(
                  "ERROR: baseline capture seed sequence mismatch; "
                  f"expected={expected!r} observed={names!r}"
              )
          counts = [int(value) for _, value in rows]
          if any(value <= 0 for value in counts):
              raise SystemExit(f"ERROR: baseline capture contains non-positive sample count: {counts!r}")
          Path(sys.argv[2]).write_text(
              "seed\tsamples\n"
              + "".join(f"{name}\t{value}\n" for name, value in zip(names, counts)),
              encoding="utf-8",
          )
          PY

      - name: Hash retained evidence
        if: always()
        run: |
          set -euo pipefail
          cd artifacts/w2-six-seed
          find . -type f ! -name SHA256SUMS -print0             | sort -z             | xargs -0 sha256sum > SHA256SUMS

      - name: Upload six-seed baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-six-seed-baseline-${{ github.run_id }}
          path: artifacts/w2-six-seed/
          if-no-files-found: error
          retention-days: 90
