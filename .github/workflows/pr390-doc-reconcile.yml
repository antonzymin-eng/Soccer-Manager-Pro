name: PR 390 document reconciliation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.number == 390 && github.event.pull_request.head.ref == 'tooling/match-measurement-lane' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile append-only tracking chains
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          OLD_PR390 = 'b6abaa418d8274602a8dd33b1ed9752879745e94'
          MAIN_389 = '988230936a4968aad9ba914057a4d5a4ab1dd56b'

          def show(commit, path):
              return subprocess.check_output(['git', 'show', f'{commit}:{path}'], text=True)

          def reconcile(path, prefix, anchor, bare, prior, must_old, must_main):
              old = show(OLD_PR390, path)
              main = show(MAIN_389, path)
              if not old.startswith(prefix) or not main.startswith(prefix):
                  raise SystemExit(f'{path}: header prefix drifted')
              old_anchor = old.find(anchor)
              main_anchor = main.find(anchor)
              if old_anchor < 0 or main_anchor < 0:
                  raise SystemExit(f'{path}: PR #382 anchor not found')
              main_entry = main[len(prefix):main_anchor]
              if bare not in main_entry:
                  raise SystemExit(f'{path}: PR #389 bare Last Updated label not found')
              main_entry = main_entry.replace(bare, prior, 1)
              merged = old[:old_anchor] + main_entry + old[old_anchor:]
              if merged.count(bare) != 1:
                  raise SystemExit(f'{path}: expected exactly one bare Last Updated label')
              if must_old not in merged or must_main not in merged:
                  raise SystemExit(f'{path}: one landing record was lost')
              if '*(since v1.13)*' in merged or '*(since advanced to **v1.13**)*' in merged:
                  raise SystemExit(f'{path}: stale maintained v1.13 pointer remains')
              Path(path).write_text(merged, encoding='utf-8')

          reconcile(
              'docs/tracking/CHANGELOG.md',
              '# CLAUDE.md — Change Log\n\n> **Created:** July 31, 2026\n> **Purpose:** The `**Last Updated:**` entry chain formerly carried in the header of\n> `CLAUDE.md`. Newest first; each entry records what landed, what was measured, and\n> what was deliberately not done.\n> Split out of `CLAUDE.md` on July 31, 2026. Content is **verbatim** — entries were moved, never edited, reordered, or deduplicated.\n\n**Appending a new entry:** add it at the top of the chain below and re-label the\nprevious newest entry `**Last Updated (prior):**`. The chain is the record — do not\nbreak it, and do not edit historical entries.\n\n---\n\n',
              '> **Last Updated (prior):** September 9, 2026 — **The localization execution plan reaches',
              '> **Last Updated:**',
              '> **Last Updated (prior):**',
              'A wrong sentence in the wiring backlog is corrected',
              'Localization T0 scaffold governance repair (PR #389)',
          )

          reconcile(
              'docs/tracking/file-manifest.md',
              '# File Manifest (Post-Migration Baseline)\n\n',
              '**Last Updated (prior):** September 9, 2026 — **The localization implementation plan reaches',
              '**Last Updated:**',
              '**Last Updated (prior):**',
              'A wrong wiring-backlog claim is corrected',
              'Localization T0 scaffold governance repair (PR #389)',
          )
          PY

          python3 tools/doc-consistency-check.py --repo .
          git diff --check -- docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md

      - name: Commit reconciled documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md
          git diff --cached --quiet && exit 0
          git commit -m 'Reconcile PR 390 tracking chains with PR 389'
          git push origin HEAD:tooling/match-measurement-lane
