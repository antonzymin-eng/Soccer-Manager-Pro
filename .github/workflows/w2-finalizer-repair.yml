name: W2 finalizer repair

on:
  push:
    branches:
      - wiring/w2-production-activation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w2-production-activation
      - name: Remove redundant Discipline header rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/w2-activation-closeout-v4.yml')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          start = next(i for i, line in enumerate(lines) if "p = 'src/discipline/DisciplineConstants.cs'" in line)
          end = next(i for i in range(start + 1, len(lines)) if 'add_before_last_endregion(p,' in lines[i])
          lines[start:end] = ["          p = 'src/discipline/DisciplineConstants.cs'\n"]
          p.write_text(''.join(lines), encoding='utf-8')
          PY
          rm -f .github/workflows/w2-finalizer-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: repair W2 activation finalizer"
          git push origin HEAD:wiring/w2-production-activation
