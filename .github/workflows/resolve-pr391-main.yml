name: Temporary PR391 main conflict resolver

on:
  push:
    branches:
      - claude/spec-40-finance-t1b-ucb6np

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/spec-40-finance-t1b-ucb6np
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect exact main conflict regions
        shell: bash
        env:
          EXPECTED_MAIN: e34af3fbbb7332f66d95f9a4cda11e49be3971bc
        run: |
          set -euo pipefail
          git fetch origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          git merge --no-commit --no-ff origin/main || true
          for f in docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md docs/tracking/open-issues.md; do
            echo "===== $f ====="
            grep -n -B 4 -A 12 -E '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' "$f" || true
          done
          exit 5
