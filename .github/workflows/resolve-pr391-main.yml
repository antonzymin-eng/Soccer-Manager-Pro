name: Temporary PR391 main conflict resolver

on:
  push:
    branches:
      - claude/spec-40-finance-t1b-ucb6np

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/spec-40-finance-t1b-ucb6np
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and resolve known tracking conflicts
        shell: bash
        env:
          EXPECTED_MAIN: e34af3fbbb7332f66d95f9a4cda11e49be3971bc
          BRANCH: claude/spec-40-finance-t1b-ucb6np
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          ACTUAL_MAIN="$(git rev-parse origin/main)"
          if [ "$ACTUAL_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "main moved: expected $EXPECTED_MAIN, found $ACTUAL_MAIN" >&2
            exit 2
          fi

          OUR_HEAD="$(git rev-parse HEAD)"
          BASE="$(git merge-base "$OUR_HEAD" origin/main)"
          echo "ours=$OUR_HEAD base=$BASE main=$ACTUAL_MAIN"

          mkdir -p /tmp/pr391-resolve

          git show "$OUR_HEAD:docs/tracking/open-issues.md" > /tmp/pr391-resolve/open.ours
          git show "$BASE:docs/tracking/open-issues.md" > /tmp/pr391-resolve/open.base
          git show "origin/main:docs/tracking/open-issues.md" > /tmp/pr391-resolve/open.theirs
          if ! git merge-file -p --diff3 \
              /tmp/pr391-resolve/open.ours \
              /tmp/pr391-resolve/open.base \
              /tmp/pr391-resolve/open.theirs \
              > /tmp/pr391-resolve/open.merged; then
            echo "open-issues.md did not merge cleanly; refusing to guess" >&2
            exit 3
          fi

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          ours = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()

          def show_lines(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True).splitlines(keepends=True)

          def first_header(lines, marker, start=0):
              for i in range(start, len(lines)):
                  if lines[i].startswith(marker):
                      return i
              raise RuntimeError(f'header marker not found: {marker}')

          def merge_chain(path, current_marker, prior_marker):
              a = show_lines(ours, path)
              b = show_lines('origin/main', path)
              ai = first_header(a, current_marker)
              bi = first_header(b, current_marker)
              bj = first_header(b, prior_marker, bi + 1)

              main_current = b[bi:bj]
              ours_chain = a[ai:]
              if not ours_chain[0].startswith(current_marker):
                  raise RuntimeError(f'{path}: branch current marker not at split')
              ours_chain[0] = prior_marker + ours_chain[0][len(current_marker):]
              merged = a[:ai] + main_current + ours_chain

              current_headers = sum(1 for line in merged if line.startswith(current_marker))
              if current_headers != 1:
                  raise RuntimeError(f'{path}: expected exactly one current header, found {current_headers}')
              Path('/tmp/pr391-resolve/' + Path(path).name + '.merged').write_text(''.join(merged))

          merge_chain(
              'docs/tracking/CHANGELOG.md',
              '> **Last Updated:**',
              '> **Last Updated (prior):**')
          merge_chain(
              'docs/tracking/file-manifest.md',
              '**Last Updated:**',
              '**Last Updated (prior):**')
          PY

          git merge --no-commit --no-ff origin/main || true
          cp /tmp/pr391-resolve/CHANGELOG.md.merged docs/tracking/CHANGELOG.md
          cp /tmp/pr391-resolve/file-manifest.md.merged docs/tracking/file-manifest.md
          cp /tmp/pr391-resolve/open.merged docs/tracking/open-issues.md
          git add docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md docs/tracking/open-issues.md

          git rm .github/workflows/resolve-pr391-main.yml

          UNMERGED="$(git diff --name-only --diff-filter=U)"
          if [ -n "$UNMERGED" ]; then
            echo "Unexpected unresolved paths:" >&2
            echo "$UNMERGED" >&2
            exit 4
          fi

          git diff --check
          python3 tools/doc-consistency-check.py --repo .
          python3 tools/recurring-defect-lint.py --repo .
          python3 tools/dotnet-ci/measurement_catalog.py validate --repo .
          bash tools/unity-ci/check-meta-integrity.sh

          git commit -m "Merge remote main into PR #391"
          git push origin HEAD:"$BRANCH"
