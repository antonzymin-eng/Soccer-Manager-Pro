name: Temporary PR391 main conflict resolver

on:
  push:
    branches:
      - claude/spec-40-finance-t1b-ucb6np

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/spec-40-finance-t1b-ucb6np
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and resolve reviewed conflicts
        shell: bash
        env:
          EXPECTED_MAIN: e34af3fbbb7332f66d95f9a4cda11e49be3971bc
          BRANCH: claude/spec-40-finance-t1b-ucb6np
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          ACTUAL_MAIN="$(git rev-parse origin/main)"
          if [ "$ACTUAL_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "main moved: expected $EXPECTED_MAIN, found $ACTUAL_MAIN" >&2
            exit 2
          fi

          git merge --no-commit --no-ff origin/main || true

          mapfile -t UNMERGED < <(git diff --name-only --diff-filter=U)
          if [ "${#UNMERGED[@]}" -ne 2 ] || \
             [ "${UNMERGED[0]}" != "docs/tracking/CHANGELOG.md" ] || \
             [ "${UNMERGED[1]}" != "docs/tracking/file-manifest.md" ]; then
            echo "Unexpected conflict set:" >&2
            printf '%s\n' "${UNMERGED[@]}" >&2
            exit 3
          fi

          python3 - <<'PY'
          from pathlib import Path

          START = '<<<<<<< '
          SEP = '=======\n'
          END = '>>>>>>> '

          def split_blocks(lines):
              blocks = []
              i = 0
              while i < len(lines):
                  if not lines[i].startswith(START):
                      i += 1
                      continue
                  start = i
                  i += 1
                  ours_start = i
                  while i < len(lines) and lines[i] != SEP:
                      if lines[i].startswith(START):
                          raise RuntimeError('nested conflict marker')
                      i += 1
                  if i >= len(lines):
                      raise RuntimeError('missing conflict separator')
                  ours = lines[ours_start:i]
                  i += 1
                  theirs_start = i
                  while i < len(lines) and not lines[i].startswith(END):
                      i += 1
                  if i >= len(lines):
                      raise RuntimeError('missing conflict end')
                  theirs = lines[theirs_start:i]
                  end = i
                  blocks.append((start, end, ours, theirs))
                  i += 1
              return blocks

          def relabel_current_to_prior(lines, current, prior):
              out = list(lines)
              matches = [i for i, line in enumerate(out) if line.startswith(current)]
              if len(matches) != 1:
                  raise RuntimeError(f'expected exactly one current header in branch block, found {len(matches)}')
              i = matches[0]
              out[i] = prior + out[i][len(current):]
              return out

          def resolve_changelog():
              path = Path('docs/tracking/CHANGELOG.md')
              lines = path.read_text().splitlines(keepends=True)
              blocks = split_blocks(lines)
              if len(blocks) != 1:
                  raise RuntimeError(f'CHANGELOG: expected 1 conflict, found {len(blocks)}')
              start, end, ours, theirs = blocks[0]
              ours = relabel_current_to_prior(
                  ours,
                  '> **Last Updated:**',
                  '> **Last Updated (prior):**')
              merged = lines[:start] + theirs + ours + lines[end + 1:]
              if sum(1 for line in merged if line.startswith('> **Last Updated:**')) != 1:
                  raise RuntimeError('CHANGELOG: expected exactly one current header')
              path.write_text(''.join(merged))

          def resolve_manifest():
              path = Path('docs/tracking/file-manifest.md')
              lines = path.read_text().splitlines(keepends=True)
              blocks = split_blocks(lines)
              if len(blocks) != 2:
                  raise RuntimeError(f'file-manifest: expected 2 conflicts, found {len(blocks)}')

              replacements = []
              for index, (start, end, ours, theirs) in enumerate(blocks):
                  if index == 0:
                      ours = relabel_current_to_prior(
                          ours,
                          '**Last Updated:**',
                          '**Last Updated (prior):**')
                      replacement = theirs + ours
                  else:
                      # Maintained pointer conflict: current main's v1.14 value wins.
                      replacement = theirs
                  replacements.append((start, end, replacement))

              for start, end, replacement in reversed(replacements):
                  lines[start:end + 1] = replacement

              if sum(1 for line in lines if line.startswith('**Last Updated:**')) != 1:
                  raise RuntimeError('file-manifest: expected exactly one current header')
              path.write_text(''.join(lines))

          resolve_changelog()
          resolve_manifest()
          PY

          git add docs/tracking/CHANGELOG.md docs/tracking/file-manifest.md

          # open-issues.md merged cleanly in the actual three-way merge; leave that merge result intact.
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 4
          fi

          # The resolver is temporary; remove it from the final PR tree.
          git rm .github/workflows/resolve-pr391-main.yml

          git diff --check
          python3 tools/doc-consistency-check.py --repo .
          python3 tools/recurring-defect-lint.py --repo .
          python3 tools/dotnet-ci/measurement_catalog.py validate --repo .
          bash tools/unity-ci/check-meta-integrity.sh

          git commit -m "Merge remote main into PR #391"
          git push origin HEAD:"$BRANCH"
