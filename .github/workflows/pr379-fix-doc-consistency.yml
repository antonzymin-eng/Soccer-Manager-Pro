name: PR 379 one-shot consistency pointer fix

on:
  push:
    branches:
      - claude/brave-fermat-1pwubn

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/brave-fermat-1pwubn
          fetch-depth: 0
      - name: Advance maintained manifest pointers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/tracking/file-manifest.md')
          s = p.read_text(encoding='utf-8')
          old = 'since advanced to **v2.55**'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly two stale v2.55 maintained pointers, got {count}')
          s = s.replace(old, 'since advanced to **v2.56**')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          python3 tools/doc-consistency-check.py --repo .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tracking/file-manifest.md
          git commit -m "Advance PR 379 manifest error-log pointers to v2.56"
          git push origin HEAD:claude/brave-fermat-1pwubn
