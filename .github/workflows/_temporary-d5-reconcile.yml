name: Temporary D5 reconcile

on:
  push:
    branches: [codex/d5-transfers-t0]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d5-transfers-t0
          fetch-depth: 0
      - name: Reconcile onto current main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p /tmp/d5-reconcile
          cp docs/tracking/CHANGELOG.md /tmp/d5-reconcile/CHANGELOG.md
          cp docs/tracking/CHANGELOG-src.md /tmp/d5-reconcile/CHANGELOG-src.md
          cp docs/tracking/file-manifest.md /tmp/d5-reconcile/file-manifest.md
          cp docs/tracking/open-issues.md /tmp/d5-reconcile/open-issues.md
          git fetch origin main
          git merge -X theirs --no-commit --no-ff origin/main
          python3 tools/_temporary_d5_reconcile.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/tracking/file-manifest.md')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          hits = [i for i, line in enumerate(lines) if 'docs/specs/code-standards/section-3.md' in line and 'since advanced to **v1.13**' in line]
          if len(hits) != 1:
              raise SystemExit(f'expected one maintained Code Standards v1.13 pointer, found {len(hits)}')
          i = hits[0]
          lines[i] = lines[i].replace('since advanced to **v1.13**', 'since advanced to **v1.14**', 1)
          p.write_text(''.join(lines), encoding='utf-8')
          PY
          rm -f tools/_temporary_d5_reconcile.py .github/workflows/_temporary-d5-reconcile.yml
          git add -A
          git diff --cached --check -- \
            README.md \
            docs/agent-guides/project-reference.md \
            docs/specs/code-standards/section-3.md \
            docs/specs/transfers-contracts-negotiation \
            docs/tracking/CHANGELOG.md \
            docs/tracking/CHANGELOG-src.md \
            docs/tracking/data-contract-index.md \
            docs/tracking/file-manifest.md \
            docs/tracking/football-judgment-proxy-review.md \
            docs/tracking/open-issues.md \
            docs/tracking/path-to-playable-roadmap.md \
            docs/tracking/transfers-contracts-negotiation-design.md \
            src/transfers
          python3 tools/assembly-tier-check.py --repo .
          python3 tools/doc-consistency-check.py --repo .
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          git commit -m 'Reconcile #31 T0 onto current main'
          git push origin HEAD:codex/d5-transfers-t0
