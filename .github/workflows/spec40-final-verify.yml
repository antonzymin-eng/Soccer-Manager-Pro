name: Temporary Spec 40 final verification

on:
  push:
    branches:
      - openai/spec-40-finance-t2b-runtime

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cross-document consistency
        run: python3 tools/doc-consistency-check.py --repo .
      - name: Assembly tier check
        run: python3 tools/assembly-tier-check.py
      - name: PR functional gate
        env:
          TD_APPROVAL_BASE_REF: a4db868ffc2f2620ee1f6111b9a94d5d550c8ebb
        run: bash tools/run-tests-local.sh --pr
      - name: Remove temporary workflow after green verification
        if: success()
        shell: bash
        run: |
          rm .github/workflows/spec40-final-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/spec40-final-verify.yml
          git commit -m "chore(finance): remove temporary verification workflow"
          git push
