name: W4 Resolve Test Seam Fix

on:
  push:
    branches:
      - codex/w4-keeper-perception-final
    paths:
      - .github/w4-resolve-seam-marker

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w4-keeper-perception-final
      - name: Add narrow Resolve test seam and use it
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('src/match-engine/MatchEngine.cs')
          s = engine.read_text()
          marker = '        /// <summary>Phase 4 — Resolve. Runs collision (×22), advances the in-flight pass/shot executor\n'
          addition = '''        /// <summary>
        /// Test-only composition seam for a single Resolve phase. W4 uses this to prove that the
        /// CollisionSystem applied-deflection result reaches the goalkeeper reaction consumer inside
        /// the same Resolve call without unrelated Physics/AI setup mutating the staged collision first.
        /// </summary>
        internal void TestOnly_RunResolvePhase() => RunResolvePhase();

'''
          if s.count(marker) != 1:
              raise SystemExit(f'MatchEngine Resolve marker count={s.count(marker)}')
          engine.write_text(s.replace(marker, addition + marker, 1))

          test = Path('src/match-engine/tests/MatchEngineKeeperPerceptionW4Tests.cs')
          t = test.read_text()
          old = '''            engine.TestOnly_ForceBallLoose(preDeflectionPosition, preDeflectionVelocity);
            engine.RunTick();
'''
          new = '''            engine.TestOnly_ForceBallLoose(preDeflectionPosition, preDeflectionVelocity);
            engine.TestOnly_RunResolvePhase();
'''
          if t.count(old) != 1:
              raise SystemExit(f'W4 deflection RunTick site count={t.count(old)}')
          test.write_text(t.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/match-engine/MatchEngine.cs src/match-engine/tests/MatchEngineKeeperPerceptionW4Tests.cs
          git diff --cached --check
          git commit -m "test: isolate W4 deflection Resolve composition"
          git push origin HEAD:codex/w4-keeper-perception-final
