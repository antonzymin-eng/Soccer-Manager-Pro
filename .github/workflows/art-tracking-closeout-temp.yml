name: Art tracking close-out helper

'on':
  push:
    branches:
      - 'art/art-pipeline-foundation'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/art-pipeline-foundation
          fetch-depth: 0

      - name: Restore repository workflow and remove temporary helpers
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/art-tracking-closeout-temp.yml
          rm -f docs/tracking/_do_not_use_temp_marker*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows docs/tracking
          git diff --cached --check
          git commit -m "Remove temporary art tracking helpers"
          git push origin HEAD:art/art-pipeline-foundation
