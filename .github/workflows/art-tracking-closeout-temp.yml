name: Art tracking close-out helper

'on':
  push:
    branches:
      - 'art/art-pipeline-foundation'

permissions:
  contents: write

jobs:
  close-out:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/art-pipeline-foundation
          fetch-depth: 0
      - run: echo ready
