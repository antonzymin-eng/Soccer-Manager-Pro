name: W12 tracking closeout

on:
  push:
    branches:
      - docs/w12-evidence-repair

permissions:
  contents: write

jobs:
  closeout-tracking:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: docs/w12-evidence-repair
          fetch-depth: 1

      - name: Apply chain-safe W12 closeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # CHANGELOG.md: prepend/supersede; never rewrite historical body text.
          p = Path('docs/tracking/CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          marker = '> **Last Updated:** September 14, 2026 — **W12 evidence repair'
          if marker not in s:
              lines = s.splitlines()
              i = next(i for i, line in enumerate(lines) if line.startswith('> **Last Updated:**'))
              prior = lines[i].replace('> **Last Updated:**', '> **Last Updated (prior):**', 1)
              newest = '> **Last Updated:** September 14, 2026 — **W12 evidence repair closes the post-#398 measurement gate with durable, mechanically reconciled evidence.** The exact Actions archives from runs `34803051927`, `34844425733`, and `34847990460` are committed byte-for-byte with GitHub ZIP digests plus per-extracted-file SHA-256s. The corrected matched three-seed comparison proves W5 producer→consumer wiring: `latestPass` 0 → 141,491 team-heartbeats and BACKWARD_PASS 0 → 1,827 raw / 2,770 committed, while Active 140, InvariantRejected 139,309, NoPrimaryPresser 84, Disengaged 1,890, Cooldown 22,671, and all three scorelines are unchanged. `primaryAssigned +3` / WeakReceiver `−3` is selection-path wiring evidence, not a claimed gate-outcome change. A CI-discovered checker now reconstructs the census from the committed archives, verifies whole-table aggregates and heartbeat accounting, and prevents a transcription-only recurrence. Post-W6 measurement is pre-registered as normalized exit shares with an explicit falsifier. PR #412 remains separate; its MatchEngine `_tackleCooldown` P2 is not the W12 Pressing AI `Cooldown` bucket.'
              lines[i:i+1] = [newest, '>', prior]
              write(p, '\n'.join(lines) + '\n')

          # CHANGELOG-src.md: same immutable-chain convention + v2.137 history row.
          p = Path('docs/tracking/CHANGELOG-src.md')
          s = p.read_text(encoding='utf-8')
          marker = '> **Last Updated:** September 14, 2026 (v2.137 — **W12 evidence repair'
          if marker not in s:
              lines = s.splitlines()
              i = next(i for i, line in enumerate(lines) if line.startswith('> **Last Updated:**'))
              prior = lines[i].replace('> **Last Updated:**', '> **Last Updated (prior):**', 1)
              newest = '> **Last Updated:** September 14, 2026 (v2.137 — **W12 evidence repair / PR #413.** The exact static-sweep, corrected-pre-#398, and post-#398 Actions ZIPs are now durable repo evidence with reproducible ZIP and extracted-file SHA-256s. The post-#398 record is corrected to the matched 0–3 / 2–5 / 2–1 corpus: `latestPass` 0 → 141,491, BACKWARD_PASS 0 → 1,827 raw / 2,770 committed, all gate-outcome counters exactly unchanged, and `primaryAssigned +3` / WeakReceiver `−3` limited to selection-path evidence. New reconciliation tooling mechanically checks the committed census, aggregate table, scorelines, and heartbeat accounting. W6 measurement is pre-registered in normalized shares with an explicit falsifier. No production, snapshot, save, RNG, or `[GT]` change.)'
              lines[i:i+1] = [newest, '>', prior]
              # Insert newest version-history row after the table separator nearest VERSION HISTORY.
              hist = next(i for i, line in enumerate(lines) if line.strip().lower().startswith('## version history'))
              sep = next(i for i in range(hist, len(lines)) if lines[i].startswith('|---'))
              row = '| 2.137 | 2026-09-14 | W12 evidence repair: exact retained Actions archives, corrected matched post-#398 census, mechanical evidence reconciliation, and normalized W6 preregistration; no production/schema/RNG/`[GT]` change. |'
              lines.insert(sep + 1, row)
              write(p, '\n'.join(lines) + '\n')

          # file-manifest.md: prepend current block and preserve prior newest verbatim except required relabel.
          p = Path('docs/tracking/file-manifest.md')
          s = p.read_text(encoding='utf-8')
          marker = '**Last Updated:** September 14, 2026 — **W12 evidence repair / PR #413.**'
          if marker not in s:
              lines = s.splitlines()
              i = next(i for i, line in enumerate(lines) if line.startswith('**Last Updated:**'))
              prior = lines[i].replace('**Last Updated:**', '**Last Updated (prior):**', 1)
              block = [
                  '**Last Updated:** September 14, 2026 — **W12 evidence repair / PR #413.**',
                  '**New durable evidence/tooling:** `docs/tracking/evidence/w12/README.md`; three exact Actions artifact ZIPs for runs `34803051927`, `34844425733`, and `34847990460`; `tools/dotnet-ci/check_w12_evidence.py`; `tools/tests/test_w12_evidence.py`; `docs/tracking/w6-post-wiring-measurement-preregistration.md`. **Corrected:** `docs/tracking/w12-gate-firing-post398-comparison.md`. **Tracking close-out:** both changelogs, `match-engine-wiring-backlog.md` v1.16 → v1.17, and this manifest. **Binary handling:** `.gitattributes` explicitly marks `*.zip` non-text. Existing W12 instrument surfaces `src/match-engine/tests/W12GateFiringDiagnosticTests.cs` and `src/pressing-ai/PressingTickDiagnostics.cs` are explicitly reconciled into the manifest record. Exact archives are authoritative; the checker derives and validates the census/table against them. No production, assembly-edge, snapshot/save schema, RNG, or `[GT]` change.',
                  '', prior
              ]
              lines[i:i+1] = block
              write(p, '\n'.join(lines) + '\n')

          # Backlog: live body may be corrected in place; version history gets a new row.
          p = Path('docs/tracking/match-engine-wiring-backlog.md')
          s = p.read_text(encoding='utf-8')
          if '(v1.17)' not in s.split('## 0.', 1)[0]:
              lines = s.splitlines()
              i = next(i for i, line in enumerate(lines) if line.startswith('> **UPDATED September 14, 2026 (v1.16):**'))
              lines[i] = '> **UPDATED September 14, 2026 (v1.17):** W4, W5, W7, and W12 are on `main`; the repaired post-#398 W12 comparison is GREEN and mechanically reconciled to durable raw evidence. W5 producer→consumer wiring is proven in the matched corpus: `latestPass` 0 → 141,491 and BACKWARD_PASS 0 → 1,827 raw / 2,770 committed, while every gate-outcome counter and all three scorelines are unchanged; the `primaryAssigned +3` / WeakReceiver `−3` delta is bounded to selection-path evidence. Five Class-A items remain until W6 lands: W3, W6, W8, W9, W10. **W6 is next; PR #412 stays separate until this evidence repair lands and its recovered tackle-cooldown P2 is fixed.**'
              s = '\n'.join(lines) + '\n'
              stale = '**Consequence:** the ring is permanently empty, so #13\'s BackwardPass press trigger is dead. A\npress that should be sprung by a backward pass never is.'
              live = '**Measured post-#398 consequence:** the ring is no longer empty. In the matched three-seed corpus, `latestPass` rises **0 → 141,491 team-heartbeats** and BACKWARD_PASS rises **0 → 1,827 raw / 2,770 committed**. Active (140), InvariantRejected (139,309), NoPrimaryPresser (84), Disengaged (1,890), Pressing-AI Cooldown (22,671), and all three scorelines are exactly unchanged. `primaryAssigned` **21,800 → 21,803** while WeakReceiver raw/committed moves **141,379/141,414 → 141,376/141,411**: the +3/−3 shift is positive selection-path wiring evidence, not an observed gate-outcome change. `latestPass` counts heartbeats with a retained ring event, not discrete passes; raw BACKWARD_PASS may also include pending dwell continuation.'
              if stale not in s:
                  raise SystemExit('stale W5 consequence block not found')
              s = s.replace(stale, live, 1)
              oldrow = '| 6 | ~~**W5**~~ / ~~**W7**~~ / **W6 NEXT** | W5/W7 are carried by PR #398 and must clear the post-#398 W12 comparison before merge. Then W6 is the recorded next wiring item. |'
              newrow = '| 6 | ~~**W5**~~ / ~~**W7**~~ / **W6 NEXT** | Post-#398 W12 is GREEN on durable, mechanically reconciled evidence. W5/W7 are landed; W6 is the recorded next wiring item. Its post-wire measurement is pre-registered in normalized exit shares because W6 changes possession semantics and trajectory matching is not expected. |'
              if oldrow not in s:
                  raise SystemExit('sequence row 6 not found')
              s = s.replace(oldrow, newrow, 1)
              w6_anchor = 'Same root cause. Possession in the engine is a flag, never a kinematic constraint.\n'
              note = '\n**PR #412 review note:** the recovered P2 around MatchEngine `_tackleCooldown` is a separate mechanism from W12 Pressing AI\'s `Cooldown` exit bucket. The W12 baseline share (22,671 / 164,193 non-`InPossession` heartbeats = 13.8%) is **not evidence for that tackle-cooldown defect** and must not be used to justify it. PR #412 must decrement tackle cooldown by elapsed AI stride even while the ball lacks a physical carrier, with its own regression lock.\n'
              if note.strip() not in s:
                  if w6_anchor not in s:
                      raise SystemExit('W6 anchor not found')
                  s = s.replace(w6_anchor, w6_anchor + note, 1)
              lines = s.splitlines()
              hist = next(i for i, line in enumerate(lines) if line.strip().lower() == '## version history')
              sep = next(i for i in range(hist, len(lines)) if lines[i].startswith('|---'))
              row = '| 1.17 | 2026-09-14 | — | **W12 post-#398 evidence repaired and closed.** Exact retained Actions archives plus a mechanical reconciliation checker replace the bad transcription; matched gate outcomes and scorelines are unchanged while the W5 pass feed and BACKWARD_PASS are live. W5 stale “ring permanently empty” consequence corrected in place. W6 post-wire measurement pre-registered on normalized exit shares/falsifiers; PR #412 tackle-cooldown P2 explicitly separated from Pressing AI `Cooldown`. W6 remains next. |'
              lines.insert(sep + 1, row)
              write(p, '\n'.join(lines) + '\n')
          PY

      - name: Commit tracking closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tracking/CHANGELOG.md docs/tracking/CHANGELOG-src.md docs/tracking/file-manifest.md docs/tracking/match-engine-wiring-backlog.md
          if git diff --cached --quiet; then
            echo 'Tracking closeout already applied.'
            exit 0
          fi
          git commit -m 'docs(w12): close repaired evidence chain'
          git push origin HEAD:docs/w12-evidence-repair
