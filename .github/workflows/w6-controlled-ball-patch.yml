name: W6 Controlled Ball Patch

on:
  push:
    branches:
      - wiring/w6-controlled-ball
    paths:
      - .github/w6-controlled-ball-marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
      - name: Apply W6 controlled-ball wiring
        run: |
          python3 .github/w6-controlled-ball-patch-fix.py
          python3 .github/w6-controlled-ball-patch.py
      - name: Commit W6 wiring
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ball-physics/BallCollision.cs src/match-engine/MatchEngine.cs
          git diff --cached --check
          git commit -m "feat(match-engine): wire W6 controlled possession"
          git push origin HEAD:wiring/w6-controlled-ball
