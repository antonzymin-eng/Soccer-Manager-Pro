name: W6 Controlled Ball Patch

on:
  push:
    branches:
      - wiring/w6-controlled-ball
    paths:
      - .github/w6-controlled-ball-marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring/w6-controlled-ball
      - name: Apply W6 controlled-ball wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {n}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # Ball Physics owns the Controlled transitions; the MatchEngine owns the possessor identity.
          path = 'src/ball-physics/BallCollision.cs'
          replace_once(path,
              '// Modified: 2026-07-28 (shot-speed pass: swept goal-frame collision + crossing-point adjudication (ERR-001-005))\n',
              '// Modified: 2026-07-28 (shot-speed pass: swept goal-frame collision + crossing-point adjudication (ERR-001-005))\n'
              '// Modified: 2026-09-14 (W6: production Controlled entry + explicit non-kick release transition)\n')
          replace_once(path,
'''        public static void SetBallControlled(ref BallState ball)
        {
            ball.State           = BallStateType.Controlled;
            ball.Velocity        = Vector3.zero;
            ball.AngularVelocity = Vector3.zero;
        }

        /// <summary>
        /// Applies a kick impulse to the ball, releasing it from Controlled.
''',
'''        public static void SetBallControlled(ref BallState ball)
        {
            ball.State             = BallStateType.Controlled;
            ball.Velocity          = Vector3.zero;
            ball.AngularVelocity   = Vector3.zero;
            ball.LastValidPosition = ball.Position;
            ball.LastValidVelocity = Vector3.zero;
        }

        /// <summary>
        /// Releases a physically controlled ball without applying a kick. The caller owns possession
        /// identity (Option B); this method owns only the BallState transition. A non-Controlled ball is
        /// left untouched so restart/taker designation can never be converted into a physical release.
        /// </summary>
        public static void ReleaseBallControl(ref BallState ball)
        {
            if (ball.State != BallStateType.Controlled)
            {
                return;
            }

            ball.State             = BallStateType.Stationary;
            ball.Velocity          = Vector3.zero;
            ball.AngularVelocity   = Vector3.zero;
            ball.LastValidPosition = ball.Position;
            ball.LastValidVelocity = Vector3.zero;
        }

        /// <summary>
        /// Applies a kick impulse to the ball, releasing it from Controlled.
''')
          replace_once(path,
'''// | 1.8     | 2026-07-28 | —      | Shot-speed pass (ERR-001-005, design KD-4/KD-5): ApplySweptGoalFrame-       |
// |         |            |        | Collision — segment-vs-six-cylinder test (posts + crossbars, inflated by    |
// |         |            |        | ball radius; a discrete test tunnels a 0.12 m post at shot speeds), first   |
// |         |            |        | production caller of ApplyGoalPostCollision. CheckBoundaries gains a        |
// |         |            |        | prevPosition overload adjudicating goal-line crossings at the interpolated  |
// |         |            |        | crossing point (detected position is up to ~0.42 m past the plane); the     |
// |         |            |        | position-only overload delegates with prev == pos (IsOutOfBounds contract   |
// |         |            |        | unchanged — out-ness identical, only goal-vs-over/wide refines).            |
''',
'''// | 1.8     | 2026-07-28 | —      | Shot-speed pass (ERR-001-005, design KD-4/KD-5): ApplySweptGoalFrame-       |
// |         |            |        | Collision — segment-vs-six-cylinder test (posts + crossbars, inflated by    |
// |         |            |        | ball radius; a discrete test tunnels a 0.12 m post at shot speeds), first   |
// |         |            |        | production caller of ApplyGoalPostCollision. CheckBoundaries gains a        |
// |         |            |        | prevPosition overload adjudicating goal-line crossings at the interpolated  |
// |         |            |        | crossing point (detected position is up to ~0.42 m past the plane); the     |
// |         |            |        | position-only overload delegates with prev == pos (IsOutOfBounds contract   |
// |         |            |        | unchanged — out-ness identical, only goal-vs-over/wide refines).            |
// | 1.9     | 2026-09-14 | —      | W6: SetBallControlled refreshes its recovery checkpoint; new                |
// |         |            |        | ReleaseBallControl provides the explicit non-kick Controlled→Stationary     |
// |         |            |        | transition while possession identity remains host-owned (Option B).         |
''')

          # MatchEngine: one physical-control boundary, one attachment rule, explicit release paths.
          path = 'src/match-engine/MatchEngine.cs'
          replace_once(path,
              '// Modified: 2026-09-14 (W5/W7 reconciliation — W5 CONTACT pass feed + snapshot v22 / ERR-013-011 timing merged on top of W4; no RNG/draw-order change)\n',
              '// Modified: 2026-09-14 (W6 controlled ball — physical possession now drives BallState.Controlled + carrier attachment; restart-taker designation stays stationary; no schema/RNG change)\n'
              '// Modified: 2026-09-14 (W5/W7 reconciliation — W5 CONTACT pass feed + snapshot v22 / ERR-013-011 timing merged on top of W4; no RNG/draw-order change)\n')

          # Physical carry happens after every agent/GK movement and after same-phase GK claim/contact.
          replace_once(path,
'''            DriveGkHeadingPhysics();
        }

        /// <summary>
        /// W4 same-Resolve deflection consumer.''',
'''            DriveGkHeadingPhysics();

            // W6: Controlled is externally managed by design. After every agent (including GK) has
            // moved — and after #11 had its same-Physics opportunity to claim — attach a physically
            // controlled ball to the recorded holder. Restart-taker designation is Stationary, so it
            // deliberately does not enter this path.
            DriveControlledBallToPossessor();
        }

        /// <summary>
        /// W4 same-Resolve deflection consumer.''')

          # BallWon / BallLoose.
          replace_once(path,
'''                case TackleOutcome.BallWon:
                    _possessingAgentId = tackler;
                    ClearPassInFlight();
                    _tackleFlag[carrier] = true;
                    _tackleWonCount++;
                    break;
                case TackleOutcome.BallLoose:
                    // Dispossessed, but nobody has it. The ball is left exactly where it lies and the
                    // ordinary loose-ball paths (first touch while it moves, pickup once it settles)
                    // decide who gets it — which is what makes this a 50-50 rather than a slower way of
                    // awarding possession to the tackler.
                    _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
                    ClearPassInFlight();
''',
'''                case TackleOutcome.BallWon:
                    TakeControlledPossession(tackler);
                    ClearPassInFlight();
                    _tackleFlag[carrier] = true;
                    _tackleWonCount++;
                    break;
                case TackleOutcome.BallLoose:
                    // Dispossessed, but nobody has it. Exit physical control explicitly; the ball is
                    // left at the carrier's last controlled foot position and the ordinary loose-ball
                    // paths decide who gets it next.
                    ReleaseControlledPossession(placeAtGround: false);
                    ClearPassInFlight();
''')

          # Only a physically controlled carrier can be tackled; pseudo-possession at a restart is not a carrier.
          replace_once(path,
'''        private void TryResolveTackles()
        {
            for (int i = 0; i < MatchEngineConstants.SQUAD_SIZE; i++)
''',
'''        private void TryResolveTackles()
        {
            // W6: _possessingAgentId also designates a restart taker while the placed ball remains
            // Stationary. Only BallState.Controlled denotes a physical carrier that can be challenged.
            if (_ball.State != BallStateType.Controlled)
            {
                return;
            }

            for (int i = 0; i < MatchEngineConstants.SQUAD_SIZE; i++)
''')

          # Forced GK release transitions state and drops to feet.
          replace_once(path,
'''            _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
            _gkHoldTicks = 0;
            _gkReleasedAgentId = holder;
''',
'''            ReleaseControlledPossession(placeAtGround: true);
            _gkHoldTicks = 0;
            _gkReleasedAgentId = holder;
''')

          # First touch Controlled and resolved interception become physical control.
          replace_once(path,
'''                        _possessingAgentId = newHolder;
                        break;
                    }
                case TouchResult.Interception:
''',
'''                        TakeControlledPossession(newHolder);
                        break;
                    }
                case TouchResult.Interception:
''')
          replace_once(path,
'''                        int interceptor = result.InterceptingAgentID;
                        _possessingAgentId = interceptor >= 0 && interceptor < MatchEngineConstants.SQUAD_SIZE
                            ? interceptor
                            : MatchEngineConstants.NO_POSSESSION;
                        break;
                    }
                default:
                    // LOOSE_BALL / DEFLECTION — ball redirected but uncontrolled; possession stays loose.
                    _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
''',
'''                        int interceptor = result.InterceptingAgentID;
                        if (interceptor >= 0 && interceptor < MatchEngineConstants.SQUAD_SIZE)
                        {
                            TakeControlledPossession(interceptor);
                        }
                        else
                        {
                            _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
                        }
                        break;
                    }
                default:
                    // LOOSE_BALL / DEFLECTION — ball redirected but uncontrolled; possession stays loose.
                    _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
''')

          # Loose pickup becomes physical control.
          replace_once(path,
'''            if (claimer != MatchEngineConstants.NO_POSSESSION)
            {
                _possessingAgentId = claimer;
            }
''',
'''            if (claimer != MatchEngineConstants.NO_POSSESSION)
            {
                TakeControlledPossession(claimer);
            }
''')

          # Add physical-control helpers immediately before the existing kick-release helper.
          replace_once(path,
'''        /// <summary>
        /// Releases possession from <paramref name="agentId"/> when it kicks the ball (Option B: the ball
        /// leaves Controlled at ApplyKick). Authoritative possession transitions are finalized at C4; this
        /// keeps the executor adapters' IsBallPossessedBy honest so a re-entrant CONTACT cannot re-kick.
        /// </summary>
        private void ReleasePossessionOnKick(int agentId)
''',
'''        /// <summary>
        /// W6 physical-possession entry. MatchEngine remains the Option-B owner of WHO possesses the ball;
        /// Ball Physics owns the Controlled state transition. Acquisition geometry stays with the host's
        /// first-touch / loose-pickup / tackle / goalkeeper mechanisms rather than re-running the lower-level
        /// 0.5 m CheckPossession predicate after those mechanisms have already adjudicated the touch.
        /// </summary>
        private void TakeControlledPossession(int agentId)
        {
            _possessingAgentId = agentId;
            BallCollision.SetBallControlled(ref _ball);
            DriveControlledBallToPossessor();
        }

        /// <summary>
        /// W6 explicit non-kick release. A restart-taker award may have a possessor id with a Stationary
        /// placed ball; ReleaseBallControl is therefore intentionally conditional on the physical state.
        /// </summary>
        private void ReleaseControlledPossession(bool placeAtGround)
        {
            if (_ball.State == BallStateType.Controlled)
            {
                if (placeAtGround)
                {
                    _ball.Position = new Vector3(
                        _ball.Position.x, _ball.Position.y, MatchEngineConstants.BALL_REST_HEIGHT_M);
                }
                BallCollision.ReleaseBallControl(ref _ball);
            }
            _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
        }

        /// <summary>
        /// W6 external kinematic constraint for BallState.Controlled. Outfield control is at foot/ground
        /// height. A goalkeeper carry preserves the claim/contact height rather than inventing a new hand-
        /// height tuning constant; x/y follow the live keeper. No new cross-tick state is required because
        /// BallState (including State/Position) and the holder id already cross the snapshot boundary.
        /// </summary>
        private void DriveControlledBallToPossessor()
        {
            int holder = _possessingAgentId;
            if (_ball.State != BallStateType.Controlled
                || holder < 0 || holder >= MatchEngineConstants.SQUAD_SIZE)
            {
                return;
            }

            Vector2 holderPos = _agents[holder].Position;
            float z = _isGoalkeeper[holder]
                ? Mathf.Max(_ball.Position.z, MatchEngineConstants.BALL_REST_HEIGHT_M)
                : MatchEngineConstants.BALL_REST_HEIGHT_M;

            _ball.Position = new Vector3(holderPos.x, holderPos.y, z);
            _ball.Velocity = Vector3.zero;
            _ball.AngularVelocity = Vector3.zero;
            BallPhysicsCore.ValidatePhysicsState(ref _ball);
            _ball.LastValidPosition = _ball.Position;
            _ball.LastValidVelocity = Vector3.zero;
        }

        /// <summary>
        /// Releases possession from <paramref name="agentId"/> when it kicks the ball (Option B: the ball
        /// leaves Controlled at ApplyKick). Authoritative possession transitions are finalized at C4; this
        /// keeps the executor adapters' IsBallPossessedBy honest so a re-entrant CONTACT cannot re-kick.
        /// </summary>
        private void ReleasePossessionOnKick(int agentId)
''')

          # Keeper/heading adapter uses the same ownership boundary and releases holder on kicks.
          replace_once(path,
'''            public void ApplyKick(Vector3 velocity, Vector3 spin, int agentId, float matchTime)
            {
                BallCollision.ApplyKick(ref _engine._ball, velocity, spin, agentId, matchTime, logger: null);

                // ERR-012-011 — the same general rule: any agent striking the ball ends the previous
''',
'''            public void ApplyKick(Vector3 velocity, Vector3 spin, int agentId, float matchTime)
            {
                BallCollision.ApplyKick(ref _engine._ball, velocity, spin, agentId, matchTime, logger: null);
                _engine.ReleasePossessionOnKick(agentId);

                // ERR-012-011 — the same general rule: any agent striking the ball ends the previous
''')
          replace_once(path,
'''            public void SetPossessor(int agentId) => _engine._possessingAgentId = agentId;
''',
'''            public void SetPossessor(int agentId) => _engine.TakeControlledPossession(agentId);
''')

          # Test seams must not create impossible holder/state combinations.
          replace_once(path,
'''        internal void TestOnly_SetPossession(int agentId)
        {
            _possessingAgentId = agentId;
        }
''',
'''        internal void TestOnly_SetPossession(int agentId)
        {
            if (agentId == MatchEngineConstants.NO_POSSESSION)
            {
                ReleaseControlledPossession(placeAtGround: false);
                return;
            }
            TakeControlledPossession(agentId);
        }
''')
          replace_once(path,
'''        internal void TestOnly_ForceBallLoose(Vector3 position, Vector3 velocity)
        {
            _ball.Position = position;
            _ball.Velocity = velocity;
            _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
            ClearPassInFlight();   // ERR-012-011 — "loose" means loose; do not leave a latch behind
        }
''',
'''        internal void TestOnly_ForceBallLoose(Vector3 position, Vector3 velocity)
        {
            _ball.Position = position;
            BallCollision.ApplyKick(
                ref _ball, velocity, Vector3.zero,
                MatchEngineConstants.NO_POSSESSION, _clock.CurrentMatchTimeSeconds, logger: null);
            _possessingAgentId = MatchEngineConstants.NO_POSSESSION;
            ClearPassInFlight();   // ERR-012-011 — "loose" means loose; do not leave a latch behind
        }
''')

          # The W2 census note becomes a regression check rather than a known-drift explanation.
          replace_once(path,
'''            // Possession is a FLAG, not a kinematic constraint — nothing holds the ball at the carrier's
            // feet (wiring backlog W6). Record how far the two readings drift, because a contact gate
            // calibrated against carrier separation while the mechanism measures ball separation would be
            // calibrated against the wrong distance.
''',
'''            // W6 turns physical possession into a kinematic constraint. Keep this census observation:
            // any material carrier/ball gap now diagnoses a regression in the Controlled attachment rule,
            // rather than being an expected property of the model.
''')

          # Append a compact MatchEngine version row before region end.
          replace_once(path,
'''#endregion
''',
'''// W6 (2026-09-14): physical open-play possession now enters BallState.Controlled and follows the holder;
// restart-taker designation remains Stationary; explicit non-kick release exits Controlled; no schema/RNG change.
#endregion
''')
          PY

          git diff --check
      - name: Commit W6 wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ball-physics/BallCollision.cs src/match-engine/MatchEngine.cs
          git diff --cached --check
          git commit -m "feat(match-engine): wire W6 controlled possession"
          git push origin HEAD:wiring/w6-controlled-ball
