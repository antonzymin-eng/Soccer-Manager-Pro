name: W2 InPoss anatomy comparison

on:
  push:
    branches:
      - wiring/w2-post-w6-closeout
    paths:
      - .github/workflows/w2-inposs-anatomy.yml

permissions:
  contents: read

jobs:
  anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre-w6
            ref: 1ba13e071909b5a08ead6cf5ed50a995f8dc301d
          - label: post-w6
            ref: e4335f7ff059deb483b1aaa534f2190fd3762008

    steps:
      - name: Checkout anatomy driver
        uses: actions/checkout@v4
        with:
          ref: wiring/w2-post-w6-closeout
          path: driver
          fetch-depth: 1

      - name: Checkout measured production head
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: repo
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply anatomy probe
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          MEASURED_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          OUT="repo/artifacts/w2-anatomy-${LABEL}"
          mkdir -p "${OUT}/trx"
          python3 driver/tools/w2_inposs_anatomy_apply.py repo
          git -C repo diff -- src/match-engine/tests/MatchEngineInPossGateScenarios.cs > "${OUT}/measurement-only.patch"
          cat > "${OUT}/provenance.txt" <<EOF
          Label: ${LABEL}
          Measured production ref: ${MEASURED_REF}
          Mode: shipping-disarmed; no tackle arm is injected.
          Seed: 0x0F1E2D3C4B5A6978 only.
          Probe: final-third possession-phase versus holder/pass-flight signal anatomy.
          EOF

      - name: Capture anatomy
        working-directory: repo
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -uo pipefail
          OUT="artifacts/w2-anatomy-${LABEL}"
          set +e
          bash tools/dotnet-ci/run-gate.sh --fast --test-filter 'FullyQualifiedName~sim_match_engine_inposs_gate' 2>&1 | tee "${OUT}/gate.txt"
          gate_rc=${PIPESTATUS[0]}
          dotnet test src/match-engine/tests/match-engine-tests.gen.csproj --no-build --no-restore --filter 'FullyQualifiedName~sim_match_engine_inposs_gate' --logger 'console;verbosity=detailed' --logger "trx;LogFileName=w2-anatomy-${LABEL}.trx" --results-directory "${OUT}/trx" 2>&1 | tee "${OUT}/instrument-output.txt"
          test_rc=${PIPESTATUS[0]}
          set -e
          grep -F 'W2_INPOSS_ANATOMY seed=0x0F1E2D3C4B5A6978' "${OUT}/instrument-output.txt"
          printf 'gate_rc=%s\ntest_rc=%s\n' "$gate_rc" "$test_rc" > "${OUT}/exit-status.txt"
          cd "${OUT}"
          sha256sum provenance.txt measurement-only.patch gate.txt instrument-output.txt exit-status.txt "trx/w2-anatomy-${LABEL}.trx" > SHA256SUMS

      - name: Upload anatomy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-anatomy-${{ matrix.label }}-${{ github.run_id }}
          path: repo/artifacts/w2-anatomy-${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90
